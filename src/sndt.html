请复制下方文本并妥善保存。", "Aquí no se pueden guardar archivos, así que copia el texto de abajo y guárdalo en un lugar seguro.", "L’enregistrement de fichiers n’est pas disponible ici : copiez le texte ci-dessous et conservez-le.", "Dateien können hier nicht gespeichert werden. Kopiere den Text unten und bewahre ihn sicher auf.", "Здесь нельзя сохранять файлы, поэтому скопируйте текст ниже и сохраните его в надёжном месте.", "Qui non è possibile salvare file, quindi copia il testo qui sotto e conservalo al sicuro.", "Não é possível salvar arquivos aqui, então copie o texto abaixo e guarde-o em lugar seguro.", "Fail tidak boleh disimpan di sini, jadi salin teks di bawah dan simpan di tempat selamat.", "لا يمكن حفظ الملفات هنا، لذا انسخ النص أدناه واحتفظ به في مكان آمن.", "Burada dosya kaydedilemiyor; aşağıdaki metni kopyalayıp güvenli bir yerde saklayın."], ["JSON backup", "JSON 备份", "Copia JSON", "Sauvegarde JSON", "JSON-Sicherung", "Резервная копия JSON", "Backup JSON", "Backup em JSON", "Sandaran JSON", "نسخة احتياطية JSON", "JSON yedeği"], ["Map JSON", "地图 JSON", "JSON del mapa", "JSON de la carte", "Karten-JSON", "JSON карты", "JSON della mappa", "JSON do mapa", "JSON peta", "JSON الخريطة", "Harita JSON'u"], ["SVG code", "SVG 代码", "Código SVG", "Code SVG", "SVG-Code", "Код SVG", "Codice SVG", "Código SVG", "Kod SVG", "رمز SVG", "SVG kodu"], ["just now", "刚刚", "ahora mismo", "à l’instant", "gerade eben", "только что", "proprio ora", "agora mesmo", "baru sahaja", "الآن", "az önce"], ["Language", "语言", "Idioma", "Langue", "Sprache", "Язык", "Lingua", "Idioma", "Bahasa", "اللغة", "Dil"], ["Status", "状态", "Estado", "État", "Status", "Статус", "Stato", "Status", "Status", "الحالة", "Durum"], ["Unnamed line", "未命名线路", "Línea sin nombre", "Ligne sans nom", "Unbenannte Linie", "Линия без названия", "Linea senza nome", "Linha sem nome", "Laluan tanpa nama", "خط بلا اسم", "Adsız hat"], ["Welcome to SNDT", "欢迎使用 SNDT", "Te damos la bienvenida a SNDT", "Bienvenue dans SNDT", "Willkommen bei SNDT", "Добро пожаловать в SNDT", "Benvenuto in SNDT", "Boas-vindas ao SNDT", "Selamat datang ke SNDT", "مرحبًا بك في SNDT", "SNDT'ye hoş geldiniz"], ["Draw a transit map for your Minecraft server: stations, lines, rivers and parks. This short tour shows the basics and takes about a minute.", "为你的 Minecraft 服务器绘制交通线路图：车站、线路、河流和公园。这个简短的导览会介绍基本操作，大约需要一分钟。", "Dibuja un mapa de transporte para tu servidor de Minecraft: estaciones, líneas, ríos y parques. Este breve recorrido muestra lo básico y dura alrededor de un minuto.", "Dessinez un plan de transport pour votre serveur Minecraft : stations, lignes, rivières et parcs. Cette courte visite présente l’essentiel et dure environ une minute.", "Zeichne einen Verkehrsplan für deinen Minecraft-Server: Stationen, Linien, Flüsse und Parks. Diese kurze Tour zeigt die Grundlagen und dauert etwa eine Minute.", "Нарисуйте транспортную схему для своего сервера Minecraft: станции, линии, реки и парки. Этот короткий тур покажет основы и займёт около минуты.", "Disegna una mappa dei trasporti per il tuo server Minecraft: stazioni, linee, fiumi e parchi. Questo breve tour mostra le basi e dura circa un minuto.", "Desenhe um mapa de transporte para o seu servidor de Minecraft: estações, linhas, rios e parques. Este tour rápido mostra o básico e leva cerca de um minuto.", "Lukis peta pengangkutan untuk pelayan Minecraft anda: stesen, laluan, sungai dan taman. Lawatan ringkas ini menunjukkan asas dan mengambil kira-kira seminit.", "ارسم خريطة نقل لخادم ماينكرافت الخاص بك: محطات وخطوط وأنهار وحدائق. تعرض هذه الجولة القصيرة الأساسيات وتستغرق نحو دقيقة.", "Minecraft sunucunuz için bir ulaşım haritası çizin: istasyonlar, hatlar, nehirler ve parklar. Bu kısa tur temelleri gösterir ve yaklaşık bir dakika sürer."], ["Pick a tool here or press its key. V selects and moves, S places stations, L draws lines, T adds text, R draws areas, W paints water, N paints nature and H pans.", "在这里选择工具或按对应的按键。V 选择和移动，S 放置车站，L 绘制线路，T 添加文字，R 绘制区域，W 绘制水域，N 绘制自然区域，H 平移视图。", "Elige una herramienta aquí o pulsa su tecla. V selecciona y mueve, S coloca estaciones, L dibuja líneas, T añade texto, R dibuja zonas, W pinta agua, N pinta naturaleza y H desplaza la vista.", "Choisissez un outil ici ou appuyez sur sa touche. V sélectionne et déplace, S place des stations, L trace des lignes, T ajoute du texte, R dessine des zones, W peint l’eau, N peint la nature et H déplace la vue.", "Wähle hier ein Werkzeug oder drücke seine Taste. V wählt und verschiebt, S setzt Stationen, L zeichnet Linien, T fügt Text hinzu, R zeichnet Bereiche, W malt Wasser, N malt Natur und H verschiebt die Ansicht.", "Выберите инструмент здесь или нажмите его клавишу. V — выбор и перемещение, S — станции, L — линии, T — текст, R — зоны, W — вода, N — природа, H — перемещение вида.", "Scegli uno strumento qui o premi il suo tasto. V seleziona e sposta, S posiziona stazioni, L disegna linee, T aggiunge testo, R disegna zone, W dipinge l’acqua, N dipinge la natura e H sposta la vista.", "Escolha uma ferramenta aqui ou pressione a tecla dela. V seleciona e move, S coloca estações, L desenha linhas, T adiciona texto, R desenha zonas, W pinta água, N pinta natureza e H move a vista.", "Pilih alat di sini atau tekan kekuncinya. V memilih dan mengalih, S meletakkan stesen, L melukis laluan, T menambah teks, R melukis kawasan, W melukis air, N melukis alam semula jadi dan H menggerakkan pandangan.", "اختر أداة من هنا أو اضغط مفتاحها. V للتحديد والنقل، S لوضع المحطات، L لرسم الخطوط، T لإضافة نص، R لرسم المناطق، W لرسم المياه، N لرسم الطبيعة، وH لتحريك العرض.", "Buradan bir araç seçin ya da tuşuna basın. V seçer ve taşır, S istasyon koyar, L hat çizer, T metin ekler, R alan çizer, W su çizer, N doğa çizer, H görünümü kaydırır."], ["Choose the station tool, then click the map wherever a station should go. Stations snap to the grid.", "选择车站工具，然后在地图上点击需要放置车站的位置。车站会吸附到网格。", "Elige la herramienta de estación y haz clic en el mapa donde quieras una estación. Las estaciones se ajustan a la cuadrícula.", "Choisissez l’outil station, puis cliquez sur la carte là où doit se trouver une station. Les stations s’alignent sur la grille.", "Wähle das Stationswerkzeug und klicke auf die Karte, wo eine Station hin soll. Stationen rasten am Raster ein.", "Выберите инструмент станции и щёлкните на карте там, где должна быть станция. Станции привязываются к сетке.", "Scegli lo strumento stazione e clicca sulla mappa dove deve andare una stazione. Le stazioni si agganciano alla griglia.", "Escolha a ferramenta de estação e clique no mapa onde a estação deve ficar. As estações alinham à grade.", "Pilih alat stesen, kemudian klik pada peta di mana stesen patut diletakkan. Stesen melekat pada grid.", "اختر أداة المحطة ثم انقر على الخريطة حيث تريد وضع المحطة. تلتصق المحطات بالشبكة.", "İstasyon aracını seçin, sonra istasyonun olacağı yere tıklayın. İstasyonlar ızgaraya yapışır."], ["Draw a line", "绘制线路", "Dibujar una línea", "Tracer une ligne", "Eine Linie zeichnen", "Нарисовать линию", "Disegna una linea", "Desenhe uma linha", "Lukis laluan", "ارسم خطًا", "Bir hat çizin"], ["Choose the line tool and click stations in order. Click empty space to add a new stop on the way. Press Enter when the line is done.", "选择线路工具，按顺序点击车站。点击空白处可在途中新增站点。线路完成后按 Enter。", "Elige la herramienta de línea y haz clic en las estaciones en orden. Haz clic en un espacio vacío para añadir una parada nueva por el camino. Pulsa Intro cuando termines la línea.", "Choisissez l’outil ligne et cliquez sur les stations dans l’ordre. Cliquez dans le vide pour ajouter un nouvel arrêt en chemin. Appuyez sur Entrée quand la ligne est terminée.", "Wähle das Linienwerkzeug und klicke die Stationen der Reihe nach an. Klicke ins Leere, um unterwegs einen neuen Halt hinzuzufügen. Drücke Enter, wenn die Linie fertig ist.", "Выберите инструмент линии и щёлкайте станции по порядку. Щёлкните пустое место, чтобы добавить новую остановку по пути. Нажмите Enter, когда линия готова.", "Scegli lo strumento linea e clicca le stazioni in ordine. Clicca nel vuoto per aggiungere una nuova fermata lungo il percorso. Premi Invio quando la linea è finita.", "Escolha a ferramenta de linha e clique nas estações em ordem. Clique num espaço vazio para adicionar uma nova parada no caminho. Pressione Enter quando a linha estiver pronta.", "Pilih alat laluan dan klik stesen mengikut urutan. Klik ruang kosong untuk menambah hentian baharu di sepanjang jalan. Tekan Enter apabila laluan siap.", "اختر أداة الخط وانقر على المحطات بالترتيب. انقر في مساحة فارغة لإضافة محطة جديدة على الطريق. اضغط Enter عند الانتهاء من الخط.", "Hat aracını seçin ve istasyonlara sırayla tıklayın. Yol üstüne yeni durak eklemek için boş bir yere tıklayın. Hat bitince Enter'a basın."], ["Shape the tracks", "调整轨道形状", "Dar forma a las vías", "Façonner les voies", "Gleise formen", "Форма путей", "Modella i binari", "Molde as vias", "Bentuk landasan", "شكّل المسارات", "Rayları biçimlendirin"], ["With the select tool, click a track to choose how it bends, or drag its handles into any shape. Double-click a track to insert a station. Scroll to zoom and Ctrl+drag to pan.", "使用选择工具点击一段轨道来选择弯折方式，或拖动控制点调整成任意形状。双击轨道可插入车站。滚轮缩放，Ctrl+拖动平移。", "Con la herramienta de selección, haz clic en una vía para elegir cómo se curva o arrastra sus tiradores para darle cualquier forma. Haz doble clic en una vía para insertar una estación. Usa la rueda para hacer zoom y Ctrl+arrastrar para desplazarte.", "Avec l’outil de sélection, cliquez sur une voie pour choisir sa courbe, ou faites glisser ses poignées pour lui donner n’importe quelle forme. Double-cliquez sur une voie pour insérer une station. Molette pour zoomer, Ctrl+glisser pour déplacer la vue.", "Klicke mit dem Auswahlwerkzeug ein Gleis an, um zu wählen, wie es abknickt, oder ziehe seine Griffe in jede beliebige Form. Doppelklicke ein Gleis, um eine Station einzufügen. Scrolle zum Zoomen und ziehe mit Strg, um die Ansicht zu verschieben.", "Инструментом выбора щёлкните путь, чтобы выбрать изгиб, или тяните его маркеры, придавая любую форму. Двойной щелчок по пути вставляет станцию. Колёсико — масштаб, Ctrl+перетаскивание — перемещение вида.", "Con lo strumento di selezione, clicca un binario per scegliere come curva, oppure trascina le sue maniglie per dargli qualsiasi forma. Fai doppio clic su un binario per inserire una stazione. Scorri per lo zoom e usa Ctrl+trascina per spostare la vista.", "Com a ferramenta de seleção, clique numa via para escolher como ela se curva ou arraste as alças para dar qualquer forma. Clique duas vezes numa via para inserir uma estação. Role para dar zoom e use Ctrl+arrastar para mover a vista.", "Dengan alat pilih, klik landasan untuk memilih cara ia melengkung, atau seret pemegangnya ke apa-apa bentuk. Dwiklik landasan untuk menyisipkan stesen. Tatal untuk zum dan Ctrl+seret untuk menggerakkan pandangan.", "بأداة التحديد، انقر على مسار لاختيار طريقة انحنائه، أو اسحب مقابضه لأي شكل. انقر نقرًا مزدوجًا على مسار لإدراج محطة. مرّر للتكبير واستخدم Ctrl+سحب لتحريك العرض.", "Seçim aracıyla bir raya tıklayıp nasıl kıvrılacağını seçin ya da tutamaçlarını istediğiniz biçime sürükleyin. İstasyon eklemek için raya çift tıklayın. Yakınlaştırmak için kaydırın, görünümü kaydırmak için Ctrl+sürükleyin."], ["Edit anything", "编辑任意内容", "Edita lo que quieras", "Tout modifier", "Alles bearbeiten", "Меняйте что угодно", "Modifica tutto", "Edite tudo", "Sunting apa sahaja", "عدّل أي شيء", "Her şeyi düzenleyin"], ["Whatever you select appears here: names, station types, colours, line types, in-game coordinates and more.", "选中的内容会显示在这里：名称、车站类型、颜色、线路类型、游戏内坐标等。", "Lo que selecciones aparece aquí: nombres, tipos de estación, colores, tipos de línea, coordenadas del juego y más.", "Tout ce que vous sélectionnez apparaît ici : noms, types de station, couleurs, types de ligne, coordonnées en jeu et plus encore.", "Was du auswählst, erscheint hier: Namen, Stationstypen, Farben, Linientypen, Spielkoordinaten und mehr.", "Всё выбранное появляется здесь: названия, типы станций, цвета, типы линий, игровые координаты и многое другое.", "Ciò che selezioni compare qui: nomi, tipi di stazione, colori, tipi di linea, coordinate di gioco e altro.", "O que você selecionar aparece aqui: nomes, tipos de estação, cores, tipos de linha, coordenadas do jogo e mais.", "Apa sahaja yang anda pilih muncul di sini: nama, jenis stesen, warna, jenis laluan, koordinat permainan dan banyak lagi.", "كل ما تحدده يظهر هنا: الأسماء وأنواع المحطات والألوان وأنواع الخطوط وإحداثيات اللعبة وغير ذلك.", "Seçtiğiniz her şey burada görünür: adlar, istasyon türleri, renkler, hat türleri, oyun içi koordinatlar ve daha fazlası."], ["Simple or Advanced", "简单或高级", "Sencillo o avanzado", "Simple ou avancé", "Einfach oder erweitert", "Простой или расширенный", "Semplice o avanzato", "Simples ou avançado", "Ringkas atau lanjutan", "بسيط أم متقدم", "Basit veya gelişmiş"], ["Simple keeps the panel short. Advanced adds exact positions, label nudging, widths and other fine controls.", "简单模式让面板保持简洁。高级模式会增加精确位置、标签微调、宽度等精细控制。", "El modo sencillo mantiene el panel corto. El avanzado añade posiciones exactas, ajuste de etiquetas, grosores y otros controles finos.", "Le mode simple garde le panneau court. Le mode avancé ajoute les positions exactes, le décalage des étiquettes, les épaisseurs et d’autres réglages fins.", "Einfach hält den Bereich kurz. Erweitert fügt genaue Positionen, Beschriftungsverschiebung, Breiten und weitere Feineinstellungen hinzu.", "Простой режим делает панель короткой. Расширенный добавляет точные позиции, сдвиг подписей, толщину линий и другие тонкие настройки.", "Semplice mantiene il pannello corto. Avanzato aggiunge posizioni esatte, spostamento delle etichette, spessori e altri controlli fini.", "O modo simples mantém o painel curto. O avançado adiciona posições exatas, ajuste de rótulos, espessuras e outros controles finos.", "Ringkas memastikan panel pendek. Lanjutan menambah kedudukan tepat, anjakan label, lebar dan kawalan halus lain.", "الوضع البسيط يبقي اللوحة قصيرة. والمتقدم يضيف المواضع الدقيقة وإزاحة التسميات والعروض وعناصر تحكم دقيقة أخرى.", "Basit mod paneli kısa tutar. Gelişmiş mod tam konumlar, etiket kaydırma, kalınlıklar ve diğer ince ayarları ekler."], ["Every line and station is listed here. Click one to select it, or use the eye to hide a line.", "所有线路和车站都列在这里。点击即可选中，点击眼睛图标可隐藏线路。", "Aquí aparecen todas las líneas y estaciones. Haz clic en una para seleccionarla o usa el ojo para ocultar una línea.", "Toutes les lignes et stations sont listées ici. Cliquez sur l’une d’elles pour la sélectionner, ou sur l’œil pour masquer une ligne.", "Hier sind alle Linien und Stationen aufgeführt. Klicke eine an, um sie auszuwählen, oder nutze das Auge, um eine Linie auszublenden.", "Здесь перечислены все линии и станции. Щёлкните, чтобы выбрать, или используйте глаз, чтобы скрыть линию.", "Qui sono elencate tutte le linee e le stazioni. Clicca su una per selezionarla, oppure usa l’occhio per nascondere una linea.", "Todas as linhas e estações aparecem aqui. Clique numa para selecioná-la ou use o olho para ocultar uma linha.", "Setiap laluan dan stesen disenaraikan di sini. Klik salah satu untuk memilihnya, atau gunakan ikon mata untuk menyembunyikan laluan.", "تُسرد هنا كل الخطوط والمحطات. انقر على أحدها لتحديده، أو استخدم أيقونة العين لإخفاء خط.", "Tüm hatlar ve istasyonlar burada listelenir. Seçmek için birine tıklayın ya da bir hattı gizlemek için göz simgesini kullanın."], ["Your work saves automatically. Open this menu to start a new map, switch between maps or import a backup.", "你的作品会自动保存。打开此菜单可新建地图、切换地图或导入备份。", "Tu trabajo se guarda automáticamente. Abre este menú para crear un mapa nuevo, cambiar de mapa o importar una copia de seguridad.", "Votre travail s’enregistre automatiquement. Ouvrez ce menu pour créer une carte, passer d’une carte à l’autre ou importer une sauvegarde.", "Deine Arbeit wird automatisch gespeichert. Öffne dieses Menü, um eine neue Karte zu beginnen, zwischen Karten zu wechseln oder eine Sicherung zu importieren.", "Ваша работа сохраняется автоматически. Откройте это меню, чтобы начать новую карту, переключиться между картами или импортировать резервную копию.", "Il tuo lavoro si salva automaticamente. Apri questo menu per iniziare una nuova mappa, passare da una mappa all’altra o importare un backup.", "Seu trabalho é salvo automaticamente. Abra este menu para começar um novo mapa, alternar entre mapas ou importar um backup.", "Kerja anda disimpan secara automatik. Buka menu ini untuk memulakan peta baharu, bertukar antara peta atau mengimport sandaran.", "يُحفظ عملك تلقائيًا. افتح هذه القائمة لبدء خريطة جديدة أو التنقل بين الخرائط أو استيراد نسخة احتياطية.", "Çalışmanız otomatik kaydedilir. Yeni harita başlatmak, haritalar arasında geçmek ya da yedek içe aktarmak için bu menüyü açın."], ["Download your map as a PNG or SVG image, or as a JSON backup you can import later.", "将地图下载为 PNG 或 SVG 图片，或下载为之后可以导入的 JSON 备份。", "Descarga tu mapa como imagen PNG o SVG, o como copia JSON para importarla más tarde.", "Téléchargez votre carte en image PNG ou SVG, ou en sauvegarde JSON à réimporter plus tard.", "Lade deine Karte als PNG- oder SVG-Bild herunter oder als JSON-Sicherung, die du später importieren kannst.", "Скачайте карту как изображение PNG или SVG или как резервную копию JSON для последующего импорта.", "Scarica la mappa come immagine PNG o SVG, oppure come backup JSON da importare in seguito.", "Baixe o mapa como imagem PNG ou SVG, ou como um backup em JSON para importar depois.", "Muat turun peta anda sebagai imej PNG atau SVG, atau sebagai sandaran JSON yang boleh diimport kemudian.", "نزّل خريطتك كصورة PNG أو SVG، أو كنسخة احتياطية JSON يمكنك استيرادها لاحقًا.", "Haritanızı PNG ya da SVG görsel olarak veya daha sonra içe aktarabileceğiniz bir JSON yedeği olarak indirin."], ["You’re ready", "准备就绪", "Ya puedes empezar", "Vous êtes prêt", "Du bist startklar", "Всё готово", "Sei pronto", "Tudo pronto", "Anda sudah sedia", "أنت جاهز", "Hazırsınız"], ["Open this tour again any time with this button. Have fun building your network!", "随时可以用这个按钮再次打开导览。祝你建网愉快！", "Puedes volver a abrir este recorrido cuando quieras con este botón. ¡Disfruta construyendo tu red!", "Rouvrez cette visite à tout moment avec ce bouton. Amusez-vous bien à construire votre réseau !", "Öffne diese Tour jederzeit wieder mit diesem Knopf. Viel Spaß beim Bauen deines Netzes!", "Этот тур всегда можно открыть снова этой кнопкой. Удачи в строительстве сети!", "Riapri questo tour quando vuoi con questo pulsante. Divertiti a costruire la tua rete!", "Abra este tour de novo quando quiser com este botão. Divirta-se construindo sua rede!", "Buka semula lawatan ini bila-bila masa dengan butang ini. Selamat membina rangkaian anda!", "افتح هذه الجولة مجددًا في أي وقت بهذا الزر. استمتع ببناء شبكتك!", "Bu turu istediğiniz zaman bu düğmeyle yeniden açın. Ağınızı kurarken iyi eğlenceler!"], ["Back", "上一步", "Atrás", "Retour", "Zurück", "Назад", "Indietro", "Voltar", "Kembali", "السابق", "Geri"], ["Next", "下一步", "Siguiente", "Suivant", "Weiter", "Далее", "Avanti", "Avançar", "Seterusnya", "التالي", "İleri"], ["Done", "完成", "Hecho", "Terminé", "Fertig", "Готово", "Fatto", "Concluído", "Selesai", "تم", "Bitti"], ["Skip tour", "跳过导览", "Saltar recorrido", "Passer la visite", "Tour überspringen", "Пропустить тур", "Salta il tour", "Pular tour", "Langkau lawatan", "تخطي الجولة", "Turu atla"], ["Support SNDT", "支持 SNDT", "Apoyar SNDT", "Soutenir SNDT", "SNDT unterstützen", "Поддержать SNDT", "Sostieni SNDT", "Apoiar o SNDT", "Sokong SNDT", "ادعم SNDT", "SNDT'yi destekle"], ["Tutorial", "教程", "Tutorial", "Tutoriel", "Anleitung", "Обучение", "Tutorial", "Tutorial", "Tutorial", "الشرح التعليمي", "Öğretici"], ["Position", "位置", "Posición", "Position", "Position", "Положение", "Posizione", "Posição", "Kedudukan", "الموضع", "Konum"], ["Type a position and the station jumps there. It snaps to the grid unless snapping is off.", "输入一     if(ls){try{loadInto(JSON.parse(ls),last)}catch(e){}}
    return;
  }
  const maps=await listMaps();
  if(!maps.length){status('Example, not saved','#9aa');return}
  const last=lsGet('blockline:last'),pick=maps.find(m=>m.id===last)||maps[0];
  await openMap(pick.id);
})();
})();
</script>
