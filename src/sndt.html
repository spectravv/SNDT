 zones (R), l’eau (W) et la nature (N). Maintenez Espace et faites glisser pour vous déplacer.", "Wähle hier ein Werkzeug oder drücke seine Taste. V wählt aus und verschiebt, S setzt Stationen, L zeichnet Linien. Der letzte Knopf enthält Text (T), Bilder (I), Flächen (R), Wasser (W) und Natur (N). Leertaste halten und ziehen zum Verschieben.", "Выберите инструмент или нажмите его клавишу. V выбирает и перемещает, S ставит станции, L рисует линии. Последняя кнопка содержит текст (T), изображения (I), области (R), воду (W) и природу (N). Удерживайте пробел и тяните, чтобы двигать карту.", "Scegli uno strumento qui o premi il suo tasto. V seleziona e sposta, S posiziona stazioni, L disegna linee. L’ultimo pulsante raccoglie testo (T), immagini (I), aree (R), acqua (W) e natura (N). Tieni premuto Spazio e trascina per spostarti.", "Escolha uma ferramenta aqui ou pressione a tecla dela. V seleciona e move, S coloca estações, L desenha linhas. O último botão reúne texto (T), imagens (I), áreas (R), água (W) e natureza (N). Segure Espaço e arraste para mover.", "Pilih alat di sini atau tekan kekuncinya. V memilih dan mengalih, S meletakkan stesen, L melukis laluan. Butang terakhir mengandungi teks (T), imej (I), kawasan (R), air (W) dan alam (N). Tahan Space dan seret untuk mengalih pandangan.", "اختر أداة من هنا أو اضغط مفتاحها. V للتحديد والتحريك، S لوضع المحطات، L لرسم الخطوط. الزر الأخير يضم النص (T) والصور (I) والمناطق (R) والماء (W) والطبيعة (N). اضغط مع الاستمرار على المسافة واسحب للتحريك.", "Buradan bir araç seçin ya da tuşuna basın. V seçer ve taşır, S istasyon koyar, L hat çizer. Son düğme metin (T), görseller (I), alanlar (R), su (W) ve doğayı (N) içerir. Kaydırmak için Boşluk’u basılı tutup sürükleyin."], ["Pick a tool here: select, stations and lines. The last button holds text, images, areas, water and nature.", "在这里选择工具：选择、车站和线路。最后一个按钮里有文字、图片、区域、水体和自然。", "Elige una herramienta aquí: seleccionar, estaciones y líneas. El último botón reúne texto, imágenes, zonas, agua y naturaleza.", "Choisissez un outil ici : sélection, stations et lignes. Le dernier bouton regroupe le texte, les images, les zones, l’eau et la nature.", "Wähle hier ein Werkzeug: Auswahl, Stationen und Linien. Der letzte Knopf enthält Text, Bilder, Flächen, Wasser und Natur.", "Выберите инструмент: выбор, станции и линии. Последняя кнопка содержит текст, изображения, области, воду и природу.", "Scegli uno strumento qui: selezione, stazioni e linee. L’ultimo pulsante raccoglie testo, immagini, aree, acqua e natura.", "Escolha uma ferramenta aqui: selecionar, estações e linhas. O último botão reúne texto, imagens, áreas, água e natureza.", "Pilih alat di sini: pilih, stesen dan laluan. Butang terakhir mengandungi teks, imej, kawasan, air dan alam.", "اختر أداة من هنا: تحديد ومحطات وخطوط. الزر الأخير يضم النص والصور والمناطق والماء والطبيعة.", "Buradan bir araç seçin: seçim, istasyonlar ve hatlar. Son düğme metin, görseller, alanlar, su ve doğayı içerir."], ["Install app", "安装应用", "Instalar app", "Installer l’app", "App installieren", "Установить приложение", "Installa app", "Instalar app", "Pasang aplikasi", "تثبيت التطبيق", "Uygulamayı yükle"], ["Install SNDT", "安装 SNDT", "Instalar SNDT", "Installer SNDT", "SNDT installieren", "Установить SNDT", "Installa SNDT", "Instalar o SNDT", "Pasang SNDT", "تثبيت SNDT", "SNDT’yi yükle"], ["Tap the Share button in your browser, then Add to Home Screen. SNDT then opens like an app, and works without internet too.", "点击浏览器中的“分享”按钮，然后选择“添加到主屏幕”。之后 SNDT 会像应用一样打开，没有网络也能使用。", "Toca el botón Compartir de tu navegador y luego Añadir a pantalla de inicio. SNDT se abrirá como una app y también funciona sin internet.", "Touchez le bouton Partager de votre navigateur, puis Sur l’écran d’accueil. SNDT s’ouvre alors comme une app, et fonctionne aussi sans internet.", "Tippe in deinem Browser auf Teilen und dann auf Zum Home-Bildschirm. SNDT öffnet sich dann wie eine App und funktioniert auch ohne Internet.", "Нажмите кнопку «Поделиться» в браузере, затем «На экран „Домой“». SNDT будет открываться как приложение и работать без интернета.", "Tocca il pulsante Condividi del browser, poi Aggiungi alla schermata Home. SNDT si aprirà come un’app e funziona anche senza internet.", "Toque no botão Partilhar do navegador e depois em Adicionar à Tela de Início. O SNDT abre como um app e funciona também sem internet.", "Ketik butang Kongsi dalam pelayar anda, kemudian Tambah ke Skrin Utama. SNDT kemudian dibuka seperti aplikasi, dan berfungsi tanpa internet juga.", "اضغط على زر المشاركة في متصفحك، ثم إضافة إلى الشاشة الرئيسية. سيفتح SNDT بعدها كتطبيق، ويعمل أيضاً بدون إنترنت.", "Tarayıcınızda Paylaş düğmesine, ardından Ana Ekrana Ekle’ye dokunun. SNDT bundan sonra bir uygulama gibi açılır ve internetsiz de çalışır."], ["SNDT is installed.", "SNDT 已安装。", "SNDT está instalado.", "SNDT est installé.", "SNDT ist installiert.", "SNDT установлен.", "SNDT è installato.", "O SNDT está instalado.", "SNDT telah dipasang.", "تم تثبيت SNDT.", "SNDT yüklendi."], ["Tap points around an area to fill it. Tap the first point or Done to close it.", "点击区域周围的点来填充。点击第一个点或“完成”来闭合。", "Toca puntos alrededor de una zona para rellenarla. Toca el primer punto o Hecho para cerrarla.", "Touchez des points autour d’une zone pour la remplir. Touchez le premier point ou Terminé pour la fermer.", "Tippe Punkte um eine Fläche, um sie zu füllen. Tippe den ersten Punkt oder Fertig, um sie zu schließen.", "Касайтесь точек вокруг области, чтобы залить её. Коснитесь первой точки или «Готово», чтобы замкнуть.", "Tocca dei punti attorno a un’area per riempirla. Tocca il primo punto o Fatto per chiuderla.", "Toque em pontos ao redor de uma área para preenchê-la. Toque no primeiro ponto ou em Concluído para fechá-la.", "Ketik titik di sekeliling kawasan untuk mengisinya. Ketik titik pertama atau Selesai untuk menutupnya.", "اضغط على نقاط حول منطقة لملئها. اضغط على النقطة الأولى أو تم لإغلاقها.", "Doldurmak için bir alanın çevresindeki noktalara dokunun. Kapatmak için ilk noktaya veya Bitti’ye dokunun."], ["Pick River, Fill shape or Eraser below, then tap to place points.", "先在下方选择河流、填充形状或橡皮擦，然后点击放置点。", "Elige Río, Forma rellena o Borrador abajo y luego toca para colocar puntos.", "Choisissez Rivière, Forme pleine ou Gomme ci-dessous, puis touchez pour placer des points.", "Wähle unten Fluss, Füllform oder Radierer und tippe dann, um Punkte zu setzen.", "Выберите внизу «Река», «Заливка формы» или «Ластик», затем касайтесь, чтобы ставить точки.", "Scegli Fiume, Forma piena o Gomma qui sotto, poi tocca per posizionare i punti.", "Escolha Rio, Forma preenchida ou Borracha abaixo e toque para colocar pontos.", "Pilih Sungai, Bentuk isian atau Pemadam di bawah, kemudian ketik untuk meletakkan titik.", "اختر نهر أو شكل معبأ أو ممحاة في الأسفل، ثم اضغط لوضع النقاط.", "Aşağıdan Nehir, Dolu şekil veya Silgi’yi seçin, sonra nokta koymak için dokunun."], ["Tap anywhere to place a station.", "点击任意位置放置车站。", "Toca en cualquier lugar para colocar una estación.", "Touchez n’importe où pour placer une station.", "Tippe irgendwo, um eine Station zu setzen.", "Коснитесь любого места, чтобы поставить станцию.", "Tocca un punto qualsiasi per posizionare una stazione.", "Toque em qualquer lugar para colocar uma estação.", "Ketik di mana-mana untuk meletakkan stesen.", "اضغط في أي مكان لوضع محطة.", "İstasyon koymak için herhangi bir yere dokunun."], ["Tap stations in order to start a new line. To extend a line, select it first, then tap one of its end stations.", "按顺序点击车站来开始新线路。要延长线路，请先选中它，再点击它的一个终点站。", "Toca estaciones en orden para empezar una línea nueva. Para alargar una línea, selecciónala primero y luego toca una de sus estaciones finales.", "Touchez des stations dans l’ordre pour commencer une nouvelle ligne. Pour prolonger une ligne, sélectionnez-la d’abord, puis touchez l’une de ses stations terminus.", "Tippe Stationen der Reihe nach an, um eine neue Linie zu beginnen. Um eine Linie zu verlängern, wähle sie zuerst aus und tippe dann eine ihrer Endstationen an.", "Касайтесь станций по порядку, чтобы начать новую линию. Чтобы продлить линию, сначала выберите её, затем коснитесь одной из конечных станций.", "Tocca le stazioni in ordine per iniziare una nuova linea. Per prolungare una linea, selezionala prima, poi tocca una delle sue stazioni terminali.", "Toque nas estações em ordem para começar uma nova linha. Para estender uma linha, selecione-a primeiro e depois toque numa das estações das pontas.", "Ketik stesen mengikut urutan untuk memulakan laluan baharu. Untuk memanjangkan laluan, pilih dahulu, kemudian ketik salah satu stesen hujungnya.", "اضغط على المحطات بالترتيب لبدء خط جديد. لتمديد خط، حدده أولاً ثم اضغط على إحدى محطتيه الطرفيتين.", "Yeni bir hat başlatmak için istasyonlara sırayla dokunun. Bir hattı uzatmak için önce onu seçin, sonra uç istasyonlarından birine dokunun."], ["Tap to place a text label.", "点击放置文字标签。", "Toca para colocar una etiqueta de texto.", "Touchez pour placer une étiquette de texte.", "Tippe, um eine Textbeschriftung zu setzen.", "Коснитесь, чтобы поставить текстовую подпись.", "Tocca per posizionare un’etichetta di testo.", "Toque para colocar um rótulo de texto.", "Ketik untuk meletakkan label teks.", "اضغط لوضع تسمية نصية.", "Metin etiketi koymak için dokunun."], ["Tap the corners of an area, like a district or the spawn chunks.", "点击一个区域的各个角，例如城区或出生点区块。", "Toca las esquinas de una zona, como un distrito o los chunks de aparición.", "Touchez les coins d’une zone, comme un quartier ou les chunks d’apparition.", "Tippe die Ecken einer Fläche an, etwa eines Bezirks oder der Spawn-Chunks.", "Касайтесь углов области, например района или чанков спавна.", "Tocca gli angoli di un’area, come un quartiere o i chunk di spawn.", "Toque nos cantos de uma área, como um bairro ou os chunks de spawn.", "Ketik sudut-sudut kawasan, seperti daerah atau chunk spawn.", "اضغط على زوايا منطقة، مثل حي أو قطع نقطة الظهور.", "Bir alanın köşelerine dokunun, örneğin bir semt ya da doğma chunk’ları."], ["Drag to move around. Pinch to zoom.", "拖动来移动视图，双指缩放。", "Arrastra para moverte. Pellizca para hacer zoom.", "Faites glisser pour vous déplacer. Pincez pour zoomer.", "Ziehen zum Verschieben. Mit zwei Fingern zoomen.", "Перетаскивайте для перемещения. Сведите или разведите пальцы для масштаба.", "Trascina per spostarti. Pizzica per lo zoom.", "Arraste para se mover. Faça pinça para dar zoom.", "Seret untuk bergerak. Cubit untuk zum.", "اسحب للتنقل. اقرص للتكبير.", "Gezinmek için sürükleyin. Yakınlaştırmak için iki parmakla sıkıştırın."], ["Tap to add corners. Tap the first corner or Done to finish.", "点击添加角点。点击第一个角点或“完成”来结束。", "Toca para añadir esquinas. Toca la primera esquina o Hecho para terminar.", "Touchez pour ajouter des coins. Touchez le premier coin ou Terminé pour finir.", "Tippe, um Ecken hinzuzufügen. Tippe die erste Ecke oder Fertig zum Abschließen.", "Касайтесь, чтобы добавлять углы. Коснитесь первого угла или «Готово», чтобы закончить.", "Tocca per aggiungere angoli. Tocca il primo angolo o Fatto per finire.", "Toque para adicionar cantos. Toque no primeiro canto ou em Concluído para terminar.", "Ketik untuk menambah sudut. Ketik sudut pertama atau Selesai untuk menamatkan.", "اضغط لإضافة زوايا. اضغط على الزاوية الأولى أو تم للإنهاء.", "Köşe eklemek için dokunun. Bitirmek için ilk köşeye veya Bitti’ye dokunun."], ["Tap to place the first corner of the area. Corners snap to the grid.", "点击放置区域的第一个角点。角点会吸附到网格。", "Toca para colocar la primera esquina de la zona. Las esquinas se ajustan a la cuadrícula.", "Touchez pour placer le premier coin de la zone. Les coins s’alignent sur la grille.", "Tippe, um die erste Ecke der Fläche zu setzen. Ecken rasten am Raster ein.", "Коснитесь, чтобы поставить первый угол области. Углы привязываются к сетке.", "Tocca per posizionare il primo angolo dell’area. Gli angoli si agganciano alla griglia.", "Toque para colocar o primeiro canto da área. Os cantos se encaixam na grade.", "Ketik untuk meletakkan sudut pertama kawasan. Sudut melekat pada grid.", "اضغط لوضع الزاوية الأولى للمنطقة. تلتصق الزوايا بالشبكة.", "Alanın ilk köşesini koymak için dokunun. Köşeler ızgaraya oturur."], ["Tap to add points. Tap the first point or Done to close the area.", "点击添加点。点击第一个点或“完成”来闭合区域。", "Toca para añadir puntos. Toca el primer punto o Hecho para cerrar la zona.", "Touchez pour ajouter des points. Touchez le premier point ou Terminé pour fermer la zone.", "Tippe, um Punkte hinzuzufügen. Tippe den ersten Punkt oder Fertig, um die Fläche zu schließen.", "Касайтесь, чтобы добавлять точки. Коснитесь первой точки или «Готово», чтобы замкнуть область.", "Tocca per aggiungere punti. Tocca il primo punto o Fatto per chiudere l’area.", "Toque para adicionar pontos. Toque no primeiro ponto ou em Concluído para fechar a área.", "Ketik untuk menambah titik. Ketik titik pertama atau Selesai untuk menutup kawasan.", "اضغط لإضافة نقاط. اضغط على النقطة الأولى أو تم لإغلاق المنطقة.", "Nokta eklemek için dokunun. Alanı kapatmak için ilk noktaya veya Bitti’ye dokunun."], ["Tap to add points. Tap the first point or Done to close the shape.", "点击添加点。点击第一个点或“完成”来闭合形状。", "Toca para añadir puntos. Toca el primer punto o Hecho para cerrar la forma.", "Touchez pour ajouter des points. Touchez le premier point ou Terminé pour fermer la forme.", "Tippe, um Punkte hinzuzufügen. Tippe den ersten Punkt oder Fertig, um die Form zu schließen.", "Касайтесь, чтобы добавлять точки. Коснитесь первой точки или «Готово», чтобы замкнуть фигуру.", "Tocca per aggiungere punti. Tocca il primo punto o Fatto per chiudere la forma.", "Toque para adicionar pontos. Toque no primeiro ponto ou em Concluído para fechar a forma.", "Ketik untuk menambah titik. Ketik titik pertama atau Selesai untuk menutup bentuk.", "اضغط لإضافة نقاط. اضغط على النقطة الأولى أو تم لإغلاق الشكل.", "Nokta eklemek için dokunun. Şekli kapatmak için ilk noktaya veya Bitti’ye dokunun."], ["Tap to add points. Tap Done to finish.", "点击添加点。点击“完成”来结束。", "Toca para añadir puntos. Toca Hecho para terminar.", "Touchez pour ajouter des points. Touchez Terminé pour finir.", "Tippe, um Punkte hinzuzufügen. Tippe Fertig zum Abschließen.", "Касайтесь, чтобы добавлять точки. Коснитесь «Готово», чтобы закончить.", "Tocca per aggiungere punti. Tocca Fatto per finire.", "Toque para adicionar pontos. Toque em Concluído para terminar.", "Ketik untuk menambah titik. Ketik Selesai untuk menamatkan.", "اضغط لإضافة نقاط. اضغط على تم للإنهاء.", "Nokta eklemek için dokunun. Bitirmek için Bitti’ye dokunun."], ["Tap to place the first point.", "点击放置第一个点。", "Toca para colocar el primer punto.", "Touchez pour placer le premier point.", "Tippe, um den ersten Punkt zu setzen.", "Коснитесь, чтобы поставить первую точку.", "Tocca per posizionare il primo punto.", "Toque para colocar o primeiro ponto.", "Ketik untuk meletakkan titik pertama.", "اضغط لوضع النقطة الأولى.", "İlk noktayı koymak için dokunun."], ["Tap stations to add them to", "点击车站将其加入", "Toca estaciones para añadirlas a", "Touchez des stations pour les ajouter à", "Tippe Stationen an, um sie hinzuzufügen zu", "Касайтесь станций, чтобы добавить их в", "Tocca le stazioni per aggiungerle a", "Toque nas estações para adicioná-las a", "Ketik stesen untuk menambahnya ke", "اضغط على المحطات لإضافتها إلى", "Eklemek için istasyonlara dokunun:"], ["Tap its first station to extend from the start.", "点击它的第一个车站可从起点延长。", "Toca su primera estación para alargarla desde el inicio.", "Touchez sa première station pour la prolonger depuis le début.", "Tippe ihre erste Station an, um sie am Anfang zu verlängern.", "Коснитесь её первой станции, чтобы продлить от начала.", "Tocca la sua prima stazione per prolungarla dall’inizio.", "Toque na primeira estação para estendê-la a partir do início.", "Ketik stesen pertamanya untuk memanjangkan dari permulaan.", "اضغط على محطته الأولى للتمديد من البداية.", "Baştan uzatmak için ilk istasyonuna dokunun."], ["Move and select", "移动与选择", "Moverse y seleccionar", "Se déplacer et sélectionner", "Bewegen und auswählen", "Перемещение и выбор", "Muoversi e selezionare", "Mover e selecionar", "Gerak dan pilih", "التنقل والتحديد", "Gezinme ve seçme"], ["Pick a tool here: select, stations, lines, text, images, areas, water, nature and pan.", "在这里选择工具：选择、车站、线路、文字、图片、区域、水体、自然和平移。", "Elige una herramienta aquí: seleccionar, estaciones, líneas, texto, imágenes, zonas, agua, naturaleza y desplazar.", "Choisissez un outil ici : sélection, stations, lignes, texte, images, zones, eau, nature et déplacement.", "Wähle hier ein Werkzeug: Auswahl, Stationen, Linien, Text, Bilder, Flächen, Wasser, Natur und Verschieben.", "Выберите инструмент: выбор, станции, линии, текст, изображения, области, вода, природа и перемещение.", "Scegli uno strumento qui: selezione, stazioni, linee, testo, immagini, aree, acqua, natura e spostamento.", "Escolha uma ferramenta aqui: selecionar, estações, linhas, texto, imagens, áreas, água, natureza e mover.", "Pilih alat di sini: pilih, stesen, laluan, teks, imej, kawasan, air, alam dan anjak.", "اختر أداة من هنا: تحديد، محطات، خطوط، نص، صور، مناطق، ماء، طبيعة وتحريك.", "Buradan bir araç seçin: seçim, istasyonlar, hatlar, metin, görseller, alanlar, su, doğa ve kaydırma."], ["Choose the station tool, then tap the map wherever a station should go. Stations snap to the grid.", "选择车站工具，然后在地图上需要车站的位置点击。车站会吸附到网格。", "Elige la herramienta de estación y toca el mapa donde deba ir una estación. Las estaciones se ajustan a la cuadrícula.", "Choisissez l’outil station, puis touchez la carte là où une station doit aller. Les stations s’alignent sur la grille.", "Wähle das Stationswerkzeug und tippe auf die Karte, wo eine Station hin soll. Stationen rasten am Raster ein.", "Выберите инструмент станций и коснитесь карты там, где должна быть станция. Станции привязываются к сетке.", "Scegli lo strumento stazione, poi tocca la mappa dove deve andare una stazione. Le stazioni si agganciano alla griglia.", "Escolha a ferramenta de estação e toque no mapa onde a estação deve ficar. As estações se encaixam na grade.", "Pilih alat stesen, kemudian ketik peta di mana stesen patut diletakkan. Stesen melekat pada grid.", "اختر أداة المحطة، ثم اضغط على الخريطة حيث يجب أن تكون المحطة. تلتصق المحطات بالشبكة.", "İstasyon aracını seçin, sonra haritada istasyonun olacağı yere dokunun. İstasyonlar ızgaraya oturur."], ["Choose the line tool and tap stations in order. Tap empty space to add a new stop on the way. Tap Done when the line is finished.", "选择线路工具，按顺序点击车站。点击空白处可在途中添加新站点。线路画完后点击“完成”。", "Elige la herramienta de línea y toca las estaciones en orden. Toca un espacio vacío para añadir una parada nueva en el camino. Toca Hecho cuando la línea esté terminada.", "Choisissez l’outil ligne et touchez les stations dans l’ordre. Touchez le vide pour ajouter un nouvel arrêt en route. Touchez Terminé quand la ligne est finie.", "Wähle das Linienwerkzeug und tippe die Stationen der Reihe nach an. Tippe ins Leere, um unterwegs einen neuen Halt einzufügen. Tippe Fertig, wenn die Linie steht.", "Выберите инструмент линий и касайтесь станций по порядку. Коснитесь пустого места, чтобы добавить остановку по пути. Коснитесь «Готово», когда линия закончена.", "Scegli lo strumento linea e tocca le stazioni in ordine. Tocca uno spazio vuoto per aggiungere una nuova fermata lungo il percorso. Tocca Fatto quando la linea è finita.", "Escolha a ferramenta de linha e toque nas estações em ordem. Toque num espaço vazio para adicionar uma nova parada no caminho. Toque em Concluído quando a linha estiver pronta.", "Pilih alat laluan dan ketik stesen mengikut urutan. Ketik ruang kosong untuk menambah hentian baharu di sepanjang jalan. Ketik Selesai apabila laluan siap.", "اختر أداة الخط واضغط على المحطات بالترتيب. اضغط على مساحة فارغة لإضافة محطة جديدة في الطريق. اضغط تم عند انتهاء الخط.", "Hat aracını seçin ve istasyonlara sırayla dokunun. Yol üzerinde yeni durak eklemek için boş bir yere dokunun. Hat bitince Bitti’ye dokunun."], ["Drag with one finger to move around and pinch to zoom. Double-tap something to select it, then drag it or its handles. Long-press a track to insert a station. Double-tap and drag to select several things.", "单指拖动来移动视图，双指缩放。双击某个对象来选中它，然后拖动它或它的控制点。长按轨道可插入车站。双击后拖动可选择多个对象。", "Arrastra con un dedo para moverte y pellizca para hacer zoom. Toca dos veces algo para seleccionarlo y luego arrástralo a él o a sus controles. Mantén pulsada una vía para insertar una estación. Toca dos veces y arrastra para seleccionar varias cosas.", "Faites glisser un doigt pour vous déplacer et pincez pour zoomer. Touchez deux fois un élément pour le sélectionner, puis faites-le glisser ou ses poignées. Appuyez longuement sur une voie pour insérer une station. Touchez deux fois puis faites glisser pour sélectionner plusieurs éléments.", "Ziehe mit einem Finger zum Verschieben und zoome mit zwei Fingern. Tippe doppelt auf etwas, um es auszuwählen, und ziehe es oder seine Griffe. Halte auf einem Gleis gedrückt, um eine Station einzufügen. Doppelt tippen und ziehen wählt mehrere Dinge aus.", "Перетаскивайте одним пальцем для перемещения, масштабируйте двумя. Дважды коснитесь объекта, чтобы выбрать его, затем тяните его или его маркеры. Удерживайте палец на пути, чтобы вставить станцию. Двойное касание с перетаскиванием выбирает несколько объектов.", "Trascina con un dito per spostarti e pizzica per lo zoom. Tocca due volte qualcosa per selezionarlo, poi trascinalo o trascina le sue maniglie. Tieni premuto su un binario per inserire una stazione. Tocca due volte e trascina per selezionare più elementi.", "Arraste com um dedo para se mover e faça pinça para dar zoom. Toque duas vezes em algo para selecioná-lo e depois arraste-o ou as suas alças. Mantenha pressionado um trilho para inserir uma estação. Toque duas vezes e arraste para selecionar várias coisas.", "Seret dengan satu jari untuk bergerak dan cubit untuk zum. Ketik dua kali pada sesuatu untuk memilihnya, kemudian seret ia atau pemegangnya. Tekan lama pada landasan untuk menyisipkan stesen. Ketik dua kali dan seret untuk memilih beberapa perkara.", "اسحب بإصبع واحد للتنقل واقرص للتكبير. اضغط مرتين على عنصر لتحديده، ثم اسحبه أو اسحب مقابضه. اضغط مطولاً على مسار لإدراج محطة. اضغط مرتين واسحب لتحديد عدة عناصر.", "Gezinmek için tek parmakla sürükleyin, yakınlaştırmak için sıkıştırın. Seçmek için bir şeye iki kez dokunun, sonra onu ya da tutamaçlarını sürükleyin. İstasyon eklemek için bir raya basılı tutun. Birden çok şey seçmek için iki kez dokunup sürükleyin."], ["Whatever you select opens in a panel at the bottom: names, station types, colours, line types, in-game coordinates and more. Drag its bar up to see everything.", "选中的内容会在底部面板中打开：名称、车站类型、颜色、线路类型、游戏内坐标等。向上拖动面板顶部的横条可查看全部。", "Lo que selecciones se abre en un panel abajo: nombres, tipos de estación, colores, tipos de línea, coordenadas del juego y más. Arrastra su barra hacia arriba para verlo todo.", "Ce que vous sélectionnez s’ouvre dans un panneau en bas : noms, types de station, couleurs, types de ligne, coordonnées en jeu et plus. Faites glisser sa barre vers le haut pour tout voir.", "Was du auswählst, öffnet sich unten in einem Feld: Namen, Stationstypen, Farben, Linientypen, Spielkoordinaten und mehr. Ziehe die Leiste nach oben, um alles zu sehen.", "Всё, что вы выбрали, открывается в панели внизу: названия, типы станций, цвета, типы линий, игровые координаты и многое другое. Потяните её полоску вверх, чтобы увидеть всё.", "Ciò che selezioni si apre in un pannello in basso: nomi, tipi di stazione, colori, tipi di linea, coordinate di gioco e altro. Trascina la sua barra verso l’alto per vedere tutto.", "O que você selecionar abre num painel em baixo: nomes, tipos de estação, cores, tipos de linha, coordenadas do jogo e mais. Arraste a barra para cima para ver tudo.", "Apa sahaja yang anda pilih dibuka dalam panel di bawah: nama, jenis stesen, warna, jenis laluan, koordinat dalam permainan dan banyak lagi. Seret palangnya ke atas untuk melihat semuanya.", "كل ما تحدده يُفتح في لوحة بالأسفل: الأسماء وأنواع المحطات والألوان وأنواع الخطوط والإحداثيات داخل اللعبة والمزيد. اسحب شريطها للأعلى لرؤية كل شيء.", "Seçtiğiniz her şey alttaki bir panelde açılır: adlar, istasyon türleri, renkler, hat türleri, oyun içi koordinatlar ve daha fazlası. Hepsini görmek için çubuğunu yukarı sürükleyin."], ["Simple keeps the panel short. Advanced adds exact positions, label nudging, widths and other fine controls. Switch between them in this menu.", "简单模式让面板保持简洁。高级模式会加入精确位置、标签微调、宽度等细节控制。在此菜单中切换。", "Simple mantiene el panel corto. Avanzado añade posiciones exactas, ajuste de etiquetas, anchos y otros controles finos. Cambia entre ellos en este menú.", "Simple garde le panneau court. Avancé ajoute les positions exactes, le décalage des étiquettes, les largeurs et d’autres réglages fins. Passez de l’un à l’autre dans ce menu.", "Einfach hält das Feld kurz. Erweitert fügt genaue Positionen, Beschriftungsversatz, Breiten und weitere Feinregler hinzu. Wechsle in diesem Menü.", "Простой режим держит панель короткой. Расширенный добавляет точные позиции, сдвиг подписей, ширину и другие тонкие настройки. Переключайтесь в этом меню.", "Semplice mantiene il pannello corto. Avanzato aggiunge posizioni esatte, spostamento delle etichette, larghezze e altri controlli fini. Passa dall’uno all’altro in questo menu.", "Simples mantém o painel curto. Avançado adiciona posições exatas, ajuste de rótulos, larguras e outros controles finos. Alterne entre eles neste menu.", "Ringkas memastikan panel pendek. Lanjutan menambah kedudukan tepat, anjakan label, lebar dan kawalan halus lain. Tukar antara keduanya dalam menu ini.", "الوضع البسيط يُبقي اللوحة قصيرة. المتقدم يضيف مواضع دقيقة وتحريك التسميات والعروض وعناصر تحكم دقيقة أخرى. بدّل بينهما من هذه القائمة.", "Basit, paneli kısa tutar. Gelişmiş; tam konumlar, etiket kaydırma, genişlikler ve diğer ince ayarları ekler. Aralarında bu menüden geçiş yapın."], ["Every line and station is listed behind this button. Tap one to select it, or use the eye to hide a line.", "所有线路和车站都列在这个按钮后面。点击其中一个来选中它，或用眼睛图标隐藏线路。", "Todas las líneas y estaciones están en la lista tras este botón. Toca una para seleccionarla o usa el ojo para ocultar una línea.", "Toutes les lignes et stations sont listées derrière ce bouton. Touchez-en une pour la sélectionner, ou utilisez l’œil pour masquer une ligne.", "Alle Linien und Stationen sind hinter diesem Knopf aufgelistet. Tippe eine an, um sie auszuwählen, oder blende eine Linie mit dem Auge aus.", "Все линии и станции перечислены за этой кнопкой. Коснитесь одной, чтобы выбрать её, или скройте линию значком глаза.", "Tutte le linee e le stazioni sono elencate dietro questo pulsante. Toccane una per selezionarla, o usa l’occhio per nascondere una linea.", "Todas as linhas e estações estão listadas atrás deste botão. Toque numa para selecioná-la ou use o olho para ocultar uma linha.", "Setiap laluan dan stesen disenaraikan di sebalik butang ini. Ketik satu untuk memilihnya, atau gunakan ikon mata untuk menyembunyikan laluan.", "كل الخطوط والمحطات مدرجة خلف هذا الزر. اضغط على أحدها لتحديده، أو استخدم العين لإخفاء خط.", "Tüm hatlar ve istasyonlar bu düğmenin arkasında listelenir. Seçmek için birine dokunun ya da bir hattı gizlemek için göz simgesini kullanın."], ["Download your map as a PNG or SVG image, or as a JSON backup you can import later. Export is in this menu.", "将地图下载为 PNG 或 SVG 图片，或下载 JSON 备份以便日后导入。导出功能在此菜单中。", "Descarga tu mapa como imagen PNG o SVG, o como copia JSON que puedes importar después. Exportar está en este menú.", "Téléchargez votre carte en image PNG ou SVG, ou en sauvegarde JSON à importer plus tard. Exporter se trouve dans ce menu.", "Lade deine Karte als PNG- oder SVG-Bild herunter oder als JSON-Sicherung, die du später importieren kannst. Exportieren findest du in diesem Menü.", "Скачайте карту как изображение PNG или SVG либо как резервную копию JSON для импорта позже. Экспорт находится в этом меню.", "Scarica la mappa come immagine PNG o SVG, o come backup JSON da importare in seguito. Esporta si trova in questo menu.", "Baixe o seu mapa como imagem PNG ou SVG, ou como backup JSON para importar depois. Exportar fica neste menu.", "Muat turun peta anda sebagai imej PNG atau SVG, atau sebagai sandaran JSON untuk diimport kemudian. Eksport ada dalam menu ini.", "نزّل خريطتك كصورة PNG أو SVG، أو كنسخة احتياطية JSON يمكنك استيرادها لاحقاً. التصدير موجود في هذه القائمة.", "Haritanızı PNG veya SVG görseli ya da daha sonra içe aktarabileceğiniz bir JSON yedeği olarak indirin. Dışa aktarma bu menüde."], ["Open this tour again any time from this menu. Have fun building your network!", "随时可以从此菜单再次打开本教程。祝你建网愉快！", "Abre este recorrido de nuevo cuando quieras desde este menú. ¡Diviértete construyendo tu red!", "Rouvrez cette visite à tout moment depuis ce menu. Amusez-vous bien à construire votre réseau !", "Öffne diese Tour jederzeit wieder über dieses Menü. Viel Spaß beim Bauen deines Netzes!", "Откройте этот тур снова в любое время из этого меню. Приятного строительства сети!", "Riapri questo tour quando vuoi da questo menu. Buon divertimento a costruire la tua rete!", "Abra este tour novamente quando quiser a partir deste menu. Divirta-se construindo a sua rede!", "Buka lawatan ini semula bila-bila masa dari menu ini. Selamat membina rangkaian anda!", "افتح هذه الجولة مجدداً في أي وقت من هذه القائمة. استمتع ببناء شبكتك!", "Bu turu istediğiniz zaman bu menüden yeniden açın. Ağınızı kurarken iyi eğlenceler!"], ["Add stop here", "在此添加车站", "Añadir parada aquí", "Ajouter un arrêt ici", "Halt hier einfügen", "Добавить остановку здесь", "Aggiungi fermata qui", "Adicionar parada aqui", "Tambah hentian di sini", "أضف محطة هنا", "Buraya durak ekle"], ["Add bend point here", "在此添加弯折点", "Añadir punto de curva aquí", "Ajouter un point de courbe ici", "Knickpunkt hier einfügen", "Добавить точку изгиба здесь", "Aggiungi punto di curva qui", "Adicionar ponto de curva aqui", "Tambah titik lengkung di sini", "أضف نقطة انحناء هنا", "Buraya kırılma noktası ekle"], ["Remove point", "删除此点", "Quitar punto", "Supprimer le point", "Punkt entfernen", "Удалить точку", "Rimuovi punto", "Remover ponto", "Buang titik", "إزالة النقطة", "Noktayı kaldır"], ["Reset curve", "重置曲线", "Restablecer curva", "Réinitialiser la courbe", "Kurve zurücksetzen", "Сбросить кривую", "Ripristina curva", "Redefinir curva", "Set semula lengkung", "إعادة ضبط المنحنى", "Eğriyi sıfırla"], ["Undo point", "撤销上一点", "Deshacer punto", "Annuler le point", "Punkt zurück", "Отменить точку", "Annulla punto", "Desfazer ponto", "Buat asal titik", "تراجع عن النقطة", "Noktayı geri al"], ["Map settings", "地图设置", "Ajustes del mapa", "Réglages de la carte", "Karteneinstellungen", "Настройки карты", "Impostazioni mappa", "Configurações do mapa", "Tetapan peta", "إعدادات الخريطة", "Harita ayarları"], ["Select several", "多选", "Seleccionar varios", "Sélection multiple", "Mehrere wählen", "Выбрать несколько", "Selezione multipla", "Selecionar vários", "Pilih beberapa", "تحديد عدة عناصر", "Çoklu seçim"], ["Menu", "菜单", "Menú", "Menu", "Menü", "Меню", "Menu", "Menu", "Menu", "القائمة", "Menü"], ["View", "视图", "Vista", "Affichage", "Ansicht", "Вид", "Vista", "Visualização", "Paparan", "العرض", "Görünüm"], ["Close", "关闭", "Cerrar", "Fermer", "Schließen", "Закрыть", "Chiudi", "Fechar", "Tutup", "إغلاق", "Kapat"], ["Lines that share track run side by side on their own. To change their order at a station, switch to Advanced, turn on Reorder lines at stations in the station’s panel, and drag one line’s dot onto another.", "共用轨道的线路会自动并行排列。要调整某个车站处的顺序，请切换到高级模式，在车站面板中开启“在车站调整线路顺序”，然后把一条线路的圆点拖到另一条上。", "Las líneas que comparten vía van lado a lado solas. Para cambiar su orden en una estación, pasa a Avanzado, activa Reordenar líneas en las estaciones en el panel de la estación y arrastra el punto de una línea sobre otro.", "Les lignes qui partagent une voie se placent côte à côte toutes seules. Pour changer leur ordre à une station, passez en mode Avancé, activez Réordonner les lignes aux stations dans le panneau de la station, puis faites glisser le point d’une ligne sur un autre.", "Linien auf gemeinsamer Strecke laufen von selbst nebeneinander. Um ihre Reihenfolge an einer Station zu ändern, wechsle zu Erweitert, schalte im Stationsbereich „Linien an Stationen umordnen“ ein und ziehe den Punkt einer Linie auf einen anderen.", "Линии на общем пути сами идут рядом. Чтобы изменить их порядок на станции, перейдите в расширенный режим, включите «Менять порядок линий на станциях» на панели станции и перетащите точку одной линии на другую.", "Le linee che condividono il binario si affiancano da sole. Per cambiarne l’ordine in una stazione, passa ad Avanzate, attiva Riordina le linee nelle stazioni nel pannello della stazione e trascina il punto di una linea su un altro.", "As linhas que partilham via ficam lado a lado sozinhas. Para mudar a ordem numa estação, mude para Avançado, ligue Reordenar linhas nas estações no painel da estação e arraste o ponto de uma linha para cima de outro.", "Laluan yang berkongsi landasan akan bersebelahan dengan sendirinya. Untuk menukar susunannya di stesen, tukar ke Lanjutan, hidupkan Susun semula laluan di stesen dalam panel stesen, dan seret titik satu laluan ke titik lain.", "الخطوط التي تتشارك المسار تصطف متجاورة تلقائيًا. لتغيير ترتيبها في محطة، انتقل إلى الوضع المتقدم، وشغّل إعادة ترتيب الخطوط في المحطات في لوحة المحطة، ثم اسحب نقطة خط فوق أخرى.", "Aynı rayı paylaşan hatlar kendiliğinden yan yana dizilir. Bir istasyondaki sıralarını değiştirmek için Gelişmiş moda geçin, istasyon panelinde İstasyonlarda hat sırasını değiştir’i açın ve bir hattın noktasını diğerinin üzerine sürükleyin."], ["Lines side by side", "线路并行", "Líneas lado a lado", "Lignes côte à côte", "Linien nebeneinander", "Линии рядом", "Linee affiancate", "Linhas lado a lado", "Laluan bersebelahan", "خطوط متجاورة", "Yan yana hatlar"], ["Runs over stations it doesn’t stop at", "经过但不停靠的车站", "Pasa sobre estaciones donde no para", "Passe sur des stations sans s’y arrêter", "Fährt über Stationen, ohne dort zu halten", "Проходит через станции без остановки", "Passa sopra stazioni dove non ferma", "Passa por cima de estações onde não para", "Melalui stesen tanpa berhenti", "يمر فوق محطات لا يتوقف فيها", "Durmadığı istasyonların üzerinden geçiyor"], ["It looks as if the line stops there. Add the station as a stop, or move the line or the station.", "看起来像是线路在此停靠。请把该车站加为停靠站，或移动线路或车站。", "Parece que la línea para ahí. Añade la estación como parada o mueve la línea o la estación.", "On dirait que la ligne s’y arrête. Ajoutez la station comme arrêt, ou déplacez la ligne ou la station.", "Es sieht aus, als würde die Linie dort halten. Füge die Station als Halt hinzu oder verschiebe die Linie oder die Station.", "Похоже, что линия там останавливается. Добавьте станцию как остановку или передвиньте линию или станцию.", "Sembra che la linea si fermi lì. Aggiungi la stazione come fermata, oppure sposta la linea o la stazione.", "Parece que a linha para ali. Adicione a estação como paragem, ou mova a linha ou a estação.", "Nampak seolah-olah laluan berhenti di situ. Tambah stesen itu sebagai hentian, atau alihkan laluan atau stesen.", "يبدو كأن الخط يتوقف هناك. أضف المحطة كمحطة توقف، أو انقل الخط أو المحطة.", "Hat orada duruyormuş gibi görünüyor. İstasyonu durak olarak ekleyin ya da hattı veya istasyonu taşıyın."], ["Small gap", "小间隙", "Espacio pequeño", "Petit écart", "Kleine Lücke", "Маленький зазор", "Spazio piccolo", "Espaço pequeno", "Jarak kecil", "فجوة صغيرة", "Küçük boşluk"], ["Medium gap", "中等间隙", "Espacio mediano", "Écart moyen", "Mittlere Lücke", "Средний зазор", "Spazio medio", "Espaço médio", "Jarak sederhana", "فجوة متوسطة", "Orta boşluk"], ["Large gap", "大间隙", "Espacio grande", "Grand écart", "Große Lücke", "Большой зазор", "Spazio grande", "Espaço grande", "Jarak besar", "فجوة كبيرة", "Büyük boşluk"], ["The line higher in the Lines list passes over  pilih stesen untuk melihat titik tempat setiap laluan bertemu dengannya. Seret satu titik ke titik lain untuk menukar kedudukan dua laluan itu di situ.", "عند التشغيل، اختر محطة لترى نقطة حيث يلتقي بها كل خط. اسحب نقطة فوق أخرى لتبديل مكان الخطين هناك.", "Açıkken bir istasyon seçince her hattın ona bağlandığı yerde bir nokta görünür. İki hattın yerini orada değiştirmek için bir noktayı diğerinin üzerine sürükleyin."], ["Drag a line’s dot on the map onto another to swap the two lines here.", "在地图上把一条线路的圆点拖到另一个圆点上，即可交换这两条线路在此处的位置。", "Arrastra el punto de una línea en el mapa sobre otro para intercambiar esas dos líneas aquí.", "Faites glisser le point d’une ligne sur la carte vers un autre pour échanger ces deux lignes ici.", "Ziehe den Punkt einer Linie auf der Karte auf einen anderen, um die beiden Linien hier zu tauschen.", "Перетащите точку линии на карте на другую, чтобы поменять эти две линии здесь местами.", "Trascina il punto di una linea sulla mappa su un altro per scambiare qui le due linee.", "Arraste o ponto de uma linha no mapa para cima de outro para trocar as duas linhas aqui.", "Seret titik sesuatu laluan pada peta ke titik lain untuk menukar kedudukan dua laluan itu di sini.", "اسحب نقطة خط على الخريطة فوق نقطة أخرى لتبديل مكان الخطين هنا.", "İki hattın yerini burada değiştirmek için haritada bir hattın noktasını diğerinin üzerine sürükleyin."], ["Reset to automatic", "恢复自动", "Volver a automático", "Revenir en automatique", "Auf automatisch zurücksetzen", "Вернуть автоматически", "Torna ad automatico", "Voltar ao automático", "Tetapkan semula kepada automatik", "إعادة إلى التلقائي", "Otomatiğe döndür"], ["Drop the dot on another line’s dot to swap them.", "请把圆点放到另一条线路的圆点上以交换位置。", "Suelta el punto sobre el punto de otra línea para intercambiarlas.", "Déposez le point sur celui d’une autre ligne pour les échanger.", "Lege den Punkt auf den Punkt einer anderen Linie, um sie zu tauschen.", "Отпустите точку на точке другой линии, чтобы поменять их местами  puntos.", "Une rivière a besoin d’au moins 2 points.", "Ein Fluss braucht mindestens 2 Punkte.", "Реке нужно не меньше 2 точек.", "Un fiume ha bisogno di almeno 2 punti.", "Um rio precisa de pelo menos 2 pontos.", "Sungai memerlukan sekurang-kurangnya 2 titik.", "يحتاج النهر إلى نقطتين على الأقل.", "Bir nehir en az 2 nokta gerektirir."], ["List branch lines in the legend", "在图例中列出支线", "Mostrar los ramales en la leyenda", "Lister les branches dans la légende", "Zweiglinien in der Legende aufführen", "Показывать ответвления в легенде", "Elenca le diramazioni nella legenda", "Listar os ramais na legenda", "Senaraikan laluan cabang dalam petunjuk", "اعرض الخطوط الفرعية في وسيلة الإيضاح", "Yan hatları açıklamada listele"], ["The legend is switched off because this map has many lines. Turn it back on under Map settings.", "此地图线路较多，因此图例已关闭。可在地图设置中重新打开。", "La leyenda está desactivada porque este mapa tiene muchas líneas. Vuelve a activarla en los ajustes del mapa.", "La légende est désactivée car cette carte a beaucoup de lignes. Réactivez-la dans les réglages de la carte.", "Die Legende ist aus, weil diese Karte viele Linien hat. In den Karteneinstellungen kannst du sie wieder einschalten.", "Легенда выключена, потому что на карте много линий. Её можно снова включить в настройках карты.", "La legenda è disattivata perché questa mappa ha molte linee. Riattivala nelle impostazioni della mappa.", "A legenda está desligada porque este mapa tem muitas linhas. Volte a ligá-la nas definições do mapa.", "Petunjuk dimatikan kerana peta ini mempunyai banyak laluan. Hidupkan semula dalam tetapan peta.", "وسيلة الإيضاح مطفأة لأن هذه الخريطة فيها خطوط كثيرة. أعد تشغيلها من إعدادات الخريطة.", "Bu haritada çok hat olduğu için açıklama kapatıldı. Harita ayarlarından yeniden açabilirsiniz."], ["Import from Rail Map Painter", "从 Rail Map Painter 导入", "Importar de Rail Map Painter", "Importer depuis Rail Map Painter", "Aus Rail Map Painter importieren", "Импорт из Rail Map Painter", "Importa da Rail Map Painter", "Importar do Rail Map Painter", "Import daripada Rail Map Painter", "استيراد من Rail Map Painter", "Rail Map Painter'dan içe aktar"], ["RMP draws thinner lines and smaller labels than SNDT, so busy maps need more room.", "RMP 的线路更细、标签更小，因此线路密集的地图在 SNDT 中需要更多空间。", "RMP dibuja líneas más finas y etiquetas más pequeñas que SNDT, así que los mapas con mucho detalle necesitan más espacio.", "RMP trace des lignes plus fines et des étiquettes plus petites que SNDT : les cartes chargées ont besoin de plus de place.", "RMP zeichnet dünnere Linien und kleinere Beschriftungen als SNDT, volle Karten brauchen daher mehr Platz.", "RMP рисует линии тоньше и подписи мельче, чем SNDT, поэтому плотным картам нужно больше места.", "RMP disegna linee più sottili ed etichette più piccole di SNDT, quindi le mappe affollate hanno bisogno di più spazio.", "O RMP desenha linhas mais finas e etiquetas mais pequenas do que o SNDT, por isso mapas cheios precisam de mais espaço.", "RMP melukis laluan lebih nipis dan label lebih kecil daripada SNDT, jadi peta yang sesak memerlukan lebih ruang.", "يرسم RMP خطوطًا أرفع وتسميات أصغر من SNDT، لذا تحتاج الخرائط المزدحمة إلى مساحة أكبر.", "RMP, SNDT'den daha ince hatlar ve daha küçük etiketler çizer; bu yüzden kalabalık haritalar daha fazla alana ihtiyaç duyar."], ["Spread the map out", "拉开地图间距", "Separar el mapa", "Espacer la carte", "Karte auseinanderziehen", "Растянуть карту", "Allarga la mappa", "Espalhar o mapa", "Jarakkan peta", "باعد بين عناصر الخريطة", "Haritayı aç"], ["Suggested for this map", "此地图的建议值", "Recomendado para este mapa", "Suggéré pour cette carte", "Für diese Karte empfohlen", "Рекомендуется для этой карты", "Consigliato per questa mappa", "Sugerido para este mapa", "Dicadangkan untuk peta ini", "المقترح لهذه الخريطة", "Bu harita için önerilen"], ["Use a thinner look like RMP (thinner lines, smaller stations and labels)", "使用类似 RMP 的纤细风格（更细的线路、更小的车站和标签）", "Usar un aspecto más fino como RMP (líneas más fina  les noms, les couleurs des lignes et les coudes sont conservés. Les noms de ligne viennent des pastilles de ligne de la carte quand il y en a ; renommez les autres dans la liste des lignes. Les styles de station propres à RMP deviennent des types de station SNDT.", "Positionen, Namen, Linienfarben und Knicke bleiben erhalten. Liniennamen stammen von den Linienschildern der Karte, sofern vorhanden; benenne die übrigen in der Linienliste um. Die besonderen Stationsdesigns von RMP werden zu SNDT-Stationstypen.", "Сохраняются положения, названия, цвета линий и изгибы. Названия линий берутся из значков линий на карте, если они есть; остальные переименуйте в списке линий. Особые виды станций RMP становятся типами станций SNDT.", "Posizioni, nomi, colori delle linee e curve vengono mantenuti. I nomi delle linee vengono dai badge di linea della mappa, se presenti; rinomina le altre nell’elenco delle linee. Gli stili speciali di stazione di RMP diventano tipi di stazione SNDT.", "As posições, os nomes, as cores das linhas e as curvas são mantidos. Os nomes das linhas vêm dos emblemas de linha do mapa, quando existem; mude o nome das restantes na lista de linhas. Os estilos especiais de estação do RMP passam a tipos de estação do SNDT.", "Kedudukan, nama, warna laluan dan selekoh dikekalkan. Nama laluan diambil daripada lencana laluan pada peta jika ada; namakan semula yang lain dalam senarai Laluan. Reka bentuk stesen khas RMP menjadi jenis stesen SNDT.", "يُحتفظ بالمواضع والأسماء وألوان الخطوط والانحناءات. تُؤخذ أسماء الخطوط من شارات الخطوط في الخريطة إن وُجدت، وأعد تسمية الباقي في قائمة الخطوط. تتحول تصاميم المحطات الخاصة في RMP إلى أنواع محطات SNDT.", "Konumlar, adlar, hat renkleri ve kıvrımlar korunur. Hat adları, varsa haritadaki hat rozetlerinden alınır; diğerlerini Hatlar listesinden yeniden adlandırın. RMP'nin özel istasyon tasarımları SNDT istasyon türlerine dönüşür."], ["SNDT backups, or Rail Map Painter projects (Download → Export project)", "SNDT 备份，或 Rail Map Painter 项目（下载 → 导出项目）", "Copias de SNDT o proyectos de Rail Map Painter (Descargar → Exportar proyecto)", "Sauvegardes SNDT ou projets Rail Map Painter (Télécharger → Exporter le projet)", "SNDT-Sicherungen oder Rail-Map-Painter-Projekte (Herunterladen → Projekt exportieren)", "Резервные копии SNDT или проекты Rail Map Painter (Скачать → Экспорт проекта)", "Backup di SNDT o progetti di Rail Map Painter (Scarica → Esporta progetto)", "Cópias do SNDT ou projetos do Rail Map Painter (Transferir → Exportar projeto)", "Sandaran SNDT, atau projek Rail Map Painter (Muat turun → Eksport projek)", "نسخ SNDT الاحتياطية أو مشاريع Rail Map Painter (تنزيل ← تصدير المشروع)", "SNDT yedekleri veya Rail Map Painter projeleri (İndir → Projeyi dışa aktar)"], ["Timeline preview", "时间线预览", "Vista previa de la línea de tiempo", "Aperçu de la chronologie", "Vorschau der Zeitleiste", "Предпросмотр таймлайна", "Anteprima della timeline", "Pré-visualização da linha do tempo", "Pratonton garis masa", "معاينة الخط الزمني", "Zaman çizelgesi önizlemesi"], ["Ctrl+drag", "Ctrl+拖动", "Ctrl+arrastrar", "Ctrl+glisser", "Strg+Ziehen", "Ctrl+перетаскивание", "Ctrl+trascina", "Ctrl+arrastar", "Ctrl+seret", "Ctrl+سحب", "Ctrl+sürükle"], ["Add X and Z coordinates first.", "请先添加 X 和 Z 坐标。", "Añade primero las coordenadas X y Z.", "Ajoutez d’abord les coordonnées X et Z.", "Füge zuerst X- und Z-Koordinaten hinzu.", "Сначала добавьте координаты X и Z.", "Aggiungi prima le coordinate X e Z.", "Adicione primeiro as coordenadas X e Z.", "Tambah koordinat X dan Z dahulu.", "أضف إحداثيات X وZ أولًا.", "Önce X ve Z koordinatlarını ekleyin."], ["Add X and Z coordinates to both stations to see distance and travel time.", "为两个车站都添加 X 和 Z 坐标，即可查看距离和行程时间。", "Añade coordenadas X y Z a las dos estaciones para ver la distancia y el tiempo de viaje.", "Ajoutez les coordonnées X et Z aux deux stations pour voir la distance et le temps de trajet.", "Füge beiden Stationen X- und Z-Koordinaten hinzu, um Entfernung und Fahrzeit zu n", "حسب نوع الخط", "Hat türüne göre"], ["Cable car", "缆车", "Teleférico", "Téléphérique", "Seilbahn", "Канатная дорога", "Funivia", "Teleférico", "Kereta kabel", "تلفريك", "Teleferik"], ["Centre", "居中", "Centro", "Centre", "Zentriert", "По центру", "Centro", "Centro", "Tengah", "توسيط", "Orta"], ["Cherry grove", "樱花林", "Cerezal", "Cerisaie", "Kirschhain", "Вишнёвая роща", "Boschetto di ciliegi", "Bosque de cerejeiras", "Hutan ceri", "بستان الكرز", "Kiraz bahçesi"], ["Circles", "圆圈", "Círculos", "Cercles", "Kreise", "Круги", "Cerchi", "Círculos", "Bulatan", "دوائر", "Daireler"], ["Circular arc", "圆弧", "Arco circular", "Arc de cercle", "Kreisbogen", "Дуга окружности", "Arco di cerchio", "Arco circular", "Lengkok bulatan", "قوس دائري", "Daire yayı"], ["Clear all water", "清除所有水域", "Borrar toda el agua", "Effacer toute l’eau", "Alles Wasser löschen", "Удалить всю воду", "Cancella tutta l’acqua", "Apagar toda a água", "Kosongkan semua air", "مسح كل المياه", "Tüm suyu temizle"], ["Click a track", "点击一段轨道", "Haz clic en una vía", "Cliquez sur une voie", "Gleis anklicken", "Щёлкните путь", "Clicca un binario", "Clique numa via", "Klik landasan", "انقر على مسار", "Bir raya tıklayın"], ["Click again to delete", "再次点击以删除", "Haz clic otra vez para eliminar", "Cliquez à nouveau pour supprimer", "Zum Löschen erneut klicken", "Нажмите ещё раз, чтобы удалить", "Clicca di nuovo per eliminare", "Clique novamente para excluir", "Klik sekali lagi untuk padam", "انقر مرة أخرى للحذف", "Silmek için tekrar tıklayın"], ["Click anywhere to place a station. Shift+click to keep placing without selecting.", "点击任意位置放置车站。Shift+点击可连续放置而不选中。", "Haz clic en cualquier lugar para colocar una estación. Mayús+clic para seguir colocando sin seleccionar.", "Cliquez n’importe où pour placer une station. Maj+clic pour continuer sans sélectionner.", "Irgendwo klicken, um eine Station zu setzen. Umschalt+Klick, um weiter zu setzen, ohne auszuwählen.", "Щёлкните где угодно, чтобы поставить станцию. Shift+щелчок — ставить дальше без выделения.", "Clicca in un punto qualsiasi per posizionare una stazione. Maiusc+clic per continuare senza selezionare.", "Clique em qualquer lugar para colocar uma estação. Shift+clique para continuar sem selecionar.", "Klik di mana-mana untuk meletakkan stesen. Shift+klik untuk terus meletakkan tanpa memilih.", "انقر في أي مكان لوضع محطة. Shift+نقر لمواصلة الوضع دون تحديد.", "İstasyon koymak için herhangi bir yere tıklayın. Seçmeden devam etmek için Shift+tıklama."], ["Click points across the water to cut a channel. Double-click or press Enter to finish. Points snap to the grid unless you hold Alt.", "在水面上点击各点以切出一条通道。双击或按 Enter 完成。除非按住 Alt，否则点会吸附到网格。", "Haz clic en puntos sobre el agua para abrir un canal. Doble clic o Intro para terminar. Los puntos se ajustan a la cuadrícula salvo que mantengas Alt.", "Cliquez des points sur l’eau pour creuser un chenal. Double-clic ou Entrée pour terminer. Les points s’alignent sur la grille sauf avec Alt.", "Punkte quer übers Wasser klicken, um einen Kanal zu schneiden. Doppelklick oder Enter zum Beenden. Punkte rasten am Raster ein, außer du hältst Alt.", "Щёлкайте точки поперёк воды, чтобы прорезать канал. Двойной щелчок или Enter — готово. Точки прилипают к сетке, если не держать Alt.", "Clicca dei punti attraverso l’acqua per tagliare un canale. Doppio clic o Invio per finire. I punti si agganciano alla griglia se non tieni premuto Alt.", "Clique pontos através da água para abrir um canal. Clique duplo ou Enter para terminar. Os pontos alinham à grade, a menos que segure Alt.", "Klik titik merentasi air untuk memotong saluran. Dwiklik atau tekan Enter untuk selesai. Titik melekat pada grid kecuali anda menahan Alt.", "انقر نقاطًا عبر الماء لشق قناة. انقر نقرًا مزدوجًا أو اضغط Enter للإنهاء. تلتصق النقاط بالشبكة ما لم تضغط Alt.", "Kanal açmak için suyun üzerinde noktalara tıklayın. Bitirmek için çift tıklayın veya Enter'a basın. Alt tutulmadıkça noktalar ızgaraya yapışır."], ["Click points along the river or shore. Double-click or press Enter to finish. Points snap to the grid unless you hold Alt.", "沿河流或岸线点击各点。双击或按 Enter 完成。除非按住 Alt，否则点会吸附到网格。", "Haz clic en puntos a lo largo del río o la costa. Doble clic o Intro para terminar. Los puntos se ajustan a la cuadrícula salvo que mantengas Alt.", "Cliquez des points le long de la rivière ou de la côte. Double-clic ou Entrée pour terminer. Les points s’alignent sur la grille sauf avec Alt.", "Punkte entlang des Flusses oder Ufers klicken. Doppelklick oder Enter zum Beenden. Punkte rasten am Raster ein, außer du hältst Alt.", "Щёлкайте точки вдоль реки или берега. Двойной щелчок или Enter — готово. Точки прилипают к сетке, если не держать Alt.", "Clicca dei punti lungo il fiume o la costa. Doppio clic o Invio per finire. I punti si agganciano alla griglia se non tieni premuto Alt.", "Clique pontos ao longo do rio ou da costa. Clique duplo ou Enter para terminar. Os pontos alinham à grade, a menos que segure Alt.", "Klik titik di sepanjang sungai atau pantai. Dwiklik atau tekan Enter untuk selesai. Titik melekat pada grid kecuali anda menahan Alt.", "انقر نقاطًا على طول النهر أو الشاطئ. انقر نقرًا مزدوجًا أو اضغط Enter للإنهاء. تلتصق النقاط بالشبكة ما لم تضغط Alt.", "Nehir ya da kıyı boyunca noktalara tıklayın. Bitirmek için çift tıklayın veya Enter'a basın. Alt tutulmadıkça noktalar ızgaraya yapışır."], ["Click points around an area to fill it, like a forest, park or desert. Click the first point again, double-click or press Enter to close it. Esc cancels. Points snap to the grid unless you hold Alt.", "围绕一片区域点击各点来填充，例如森林、公园或沙漠。再次点击第一个点、双击或按 Enter 闭合。Esc 取消。除非按住 Alt，否则点会吸附到网格。", "Haz clic en puntos alrededor de una zona para rellenarla, como un bosque, parque o desierto. Vuelve a hacer clic en el primer punto, doble clic o Intro para cerrarla. Esc cancela. Los puntos se ajustan a la cuadrícula salvo que mantengas Alt.", "Cliquez des points autour d’une zone pour la remplir, comme une forêt, un parc ou un désert. Recliquez sur le premier point, double-cliquez ou appuyez sur Entrée pour la fermer. Échap annule. Les points s’alignent sur la grille sauf avec Alt.", "Punkte rund um einen Bereich klicken, um ihn zu füllen, z. B. Wald, Park oder Wüste. Ersten Punkt erneut klicken, doppelklicken oder Enter zum Schließen. Esc bricht ab. Punkte rasten am Raster ein, außer du hältst Alt.", "Щёлкайте точки вокруг области, чтобы залить её, например лес, парк или пустыню. Щёлкните первую точку ещё раз, дважды щёлкните или нажмите Enter, чтобы замкнуть. Esc — отмена. Точки прилипают к сетке, если не держать Alt.", "Clicca dei punti attorno a una zona per riempirla, come un bosco, un parco o un deserto. Clicca di nuovo il primo punto, fai doppio clic o premi Invio per chiuderla. Esc annulla. I punti si agganciano alla griglia se non tieni premuto Alt.", "Clique pontos em volta de uma área para preenchê-la, como uma floresta, parque ou deserto. Clique de novo no primeiro ponto, dê um clique duplo ou pressione Enter para fechar. Esc cancela. Os pontos alinham à grade, a menos que segure Alt.", "Klik titik di sekeliling kawasan untuk mengisinya, seperti hutan, taman atau gurun. Klik titik pertama sekali lagi, dwiklik atau tekan Enter untuk menutup. Esc membatalkan. Titik melekat pada grid kecuali anda menahan Alt.", "انقر نقاطًا حول منطقة لتعبئتها، مثل غابة أو حديقة أو صحراء. انقر النقطة الأولى مجددًا أو انقر نقرًا مزدوجًا أو اضغط Enter لإغلاقها. Esc للإلغاء. تلتصق النقاط بالشبكة ما لم تضغط Alt.", "Doldurmak için bir alanın çevresinde noktalara tıklayın; orman, park ya da çöl gibi. Kapatmak için ilk noktaya yeniden tıklayın, çift tıklayın veya Enter'a basın. Esc iptal eder. Alt tutulmadıkça noktalar ızgaraya yapışır."], ["Click points around an area to fill it. Click the first point, double-click or press Enter to close it.", "围绕一片区域点击各点来填充。点击第一个点、双击或按 Enter 闭合。", "Haz clic en puntos alrededor de una zona para rellenarla. Haz clic en el primer punto, doble clic o Intro para cerrarla.", "Cliquez des points autour d’une zone pour la remplir. Cliquez sur le premier point, double-cliquez ou appuyez sur Entrée pour la fermer.", "Punkte rund um einen Bereich klicken, um ihn zu füllen. Ersten Punkt klicken, doppelklicken oder Enter zum Schließen.", "Щёлкайте точки вокруг области, чтобы залить её. Щёлкните первую точку, дважды щёлкните или нажмите Enter, чтобы замкнуть.", "Clicca dei punti attorno a una zona per riempirla. Clicca il primo punto, fai doppio clic o premi Invio per chiuderla.", "Clique pontos em volta de uma área para preenchê-la. Clique no primeiro ponto, dê um clique duplo ou pressione Enter para fechar.", "Klik titik di sekeliling kawasan untuk mengisinya. Klik titik pertama, dwiklik atau tekan Enter untuk menutup.", "انقر نقاطًا حول منطقة لتعبئتها. انقر النقطة الأولى أو انقر نقرًا مزدوجًا أو اضغط Enter لإغلاقها.", "Doldurmak için bir alanın çevresinde noktalara tıklayın. Kapatmak için ilk noktaya tıklayın, çift tıklayın veya Enter'a basın."], ["Click points around the area. Click the first point again, double-click or press Enter to close it. Points snap to the grid unless you hold Alt.", "围绕区域点击各点。再次点击第一个点、双击或按 Enter 闭合。除非按住 Alt，否则点会吸附到网格。", "Haz clic en puntos alrededor de la zona. Vuelve a hacer clic en el primer punto, doble clic o Intro para cerrarla. Los puntos se ajustan a la cuadrícula salvo que mantengas Alt.", "Cliquez des points autour de la zone. Recliquez sur le premier point, double-cliquez ou appuyez sur Entrée pour la fermer. Les points s’alignent sur la grille sauf avec Alt.", "Punkte rund um den Bereich klicken. Ersten Punkt erneut klicken, doppelklicken oder Enter zum Schließen. Punkte rasten am Raster ein, außer du hältst Alt.", "Щёлкайте точки вокруг области. Щёлкните первую точку ещё раз, дважды щёлкните или нажмите Enter, чтобы замкнуть. Точки прилипают к сетке, если не держать Alt.", "Clicca dei punti attorno alla zona. Clicca di nuovo il primo punto, fai doppio clic o premi Invio per chiuderla. I punti si agganciano alla griglia se non tieni premuto Alt.", "Clique pontos em volta da área. Clique de novo no primeiro ponto, dê um clique duplo ou pressione Enter para fechar. Os pontos alinham à grade, a menos que segure Alt.", "Klik titik di sekeliling kawasan. Klik titik pertama sekali lagi, dwiklik atau tekan Enter untuk menutup. Titik melekat pada grid kecuali anda menahan Alt.", "انقر نقاطًا حول المنطقة. انقر النقطة الأولى مجددًا أو انقر نقرًا مزدوجًا أو اضغط Enter لإغلاقها. تلتصق النقاط بالشبكة ما لم تضغط Alt.", "Alanın çevresinde noktalara tıklayın. Kapatmak için ilk noktaya yeniden tıklayın, çift tıklayın veya Enter'a basın. Alt tutulmadıkça noktalar ızgaraya yapışır."], ["Click stations in order to start a new line. To extend a line from either end, select the line first, then click one of its end stations.", "按顺序点击车站来新建线路。要从任一端延长线路，先选中该线路，再点击它的一个终点站。", "Haz clic en las estaciones en orden para crear una línea. Para alargar una línea por cualquier extremo, selecciónala primero y luego haz clic en una de sus estaciones finales.", "Cliquez sur les stations dans l’ordre pour créer une ligne. Pour prolonger une ligne par un bout, sélectionnez-la d’abord puis cliquez sur une de ses stations terminus.", "Stationen der Reihe nach anklicken, um eine neue Linie zu beginnen. Um eine Linie an einem Ende zu verlängern, zuerst die Linie auswählen und dann eine ihrer Endstationen anklicken.", "Щёлкайте станции по порядку, чтобы начать новую линию. Чтобы продлить линию с любого конца, сначала выберите её, затем щёлкните одну из её конечных станций.", "Clicca le stazioni in ordine per iniziare una nuova linea. Per prolungare una linea da un’estremità, selezionala prima e poi clicca una delle sue stazioni capolinea.", "Clique nas estações em ordem para começar uma nova linha. Para estender uma linha por qualquer ponta, selecione-a primeiro e depois clique numa das estações terminais.", "Klik stesen mengikut urutan untuk memulakan laluan baharu. Untuk memanjangkan laluan dari mana-mana hujung, pilih laluan dahulu, kemudian klik salah satu stesen hujungnya.", "انقر على المحطات بالترتيب لبدء خط جديد. لتمديد خط من أي طرف، حدد الخط أولًا ثم انقر على إحدى محطتيه الطرفيتين.", "Yeni bir hat başlatmak için istasyonlara sırayla tıklayın. Bir hattı uçlarından uzatmak için önce hattı seçin, sonra uç istasyonlarından birine tıklayın."], ["Click to add points. Click the first point, double-click or press Enter to close the area. Esc cancels.", "点击添加点。点击第一个点、双击或按 Enter 闭合区域。Esc 取消。", "Haz clic para añadir puntos. Haz clic en el primer punto, doble clic o Intro para cerrar la zona. Esc cancela.", "Cliquez pour ajouter des points. Cliquez sur le premier point, double-cliquez ou appuyez sur Entrée pour fermer la zone. Échap annule.", "Klicken, um Punkte hinzuzufügen. Ersten Punkt klicken, doppelklicken oder Enter, um den Bereich zu schließen. Esc bricht ab.", "Щёлкайте, чтобы добавить точки. Щёлкните первую точку, дважды щёлкните или нажмите Enter, чтобы замкнуть область. Esc — отмена.", "Clicca per aggiungere punti. Clicca il primo punto, fai doppio clic o premi Invio per chiudere la zona. Esc annulla.", "Clique para adicionar pontos. Clique no primeiro ponto, dê um clique duplo ou pressione Enter para fechar a área. Esc cancela.", "Klik untuk menambah titik. Klik titik pertama, dwiklik atau tekan Enter untuk menutup kawasan. Esc membatalkan.", "انقر لإضافة نقاط. انقر النقطة الأولى أو انقر نقرًا مزدوجًا أو اضغط Enter لإغلاق المنطقة. Esc للإلغاء.", "Nokta eklemek için tıklayın. Alanı kapatmak için ilk noktaya tıklayın, çift tıklayın veya Enter'a basın. Esc iptal eder."], ["Click to add points. Click the first point, double-click or press Enter to close the shape. Esc cancels.", "点击添加点。点击第一个点、双击或按 Enter 闭合形状。Esc 取消。", "Haz clic para añadir puntos. Haz clic en el primer punto, doble clic o Intro para cerrar la forma. Esc cancela.", "Cliquez pour ajouter des points. Cliquez sur le premier point, double-cliquez ou appuyez sur Entrée pour fermer la forme. Échap annule.", "Klicken, hen, um den Bereich zu verschieben.", "Тяните круглые углы, чтобы изменить форму. Потяните маленький белый маркер, чтобы добавить угол, дважды щёлкните угол, чтобы удалить его. Тяните внутри области, чтобы переместить её.", "Trascina gli angoli rotondi per cambiare la forma. Trascina una piccola maniglia bianca per aggiungere un angolo e fai doppio clic su un angolo per rimuoverlo. Trascina all’interno per spostare la zona.", "Arraste os cantos redondos para mudar a forma. Arraste uma pequena alça branca para adicionar um canto e dê um clique duplo num canto para removê-lo. Arraste por dentro para mover a área.", "Seret sudut bulat untuk mengubah bentuk. Seret pemegang putih kecil untuk menambah sudut, dan dwiklik sudut untuk membuangnya. Seret di dalam kawasan untuk mengalihkannya.", "اسحب الزوايا الدائرية لتغيير الشكل. اسحب مقبضًا أبيض صغيرًا لإضافة زاوية، وانقر نقرًا مزدوجًا على زاوية لإزالتها. اسحب داخل المنطقة لتحريكها.", "Biçimi değiştirmek için yuvarlak köşeleri sürükleyin. Köşe eklemek için küçük beyaz tutamacı sürükleyin, kaldırmak için köşeye çift tıklayın. Taşımak için alanın içini sürükleyin."], ["Drag the round handles on the map to reshape this segment. Drag a small white handle to add a bend, and double-click a handle to remove it. Hold Alt to place off the grid.", "在地图上拖动圆形控制点来改变此路段形状。拖动白色小控制点可添加弯折，双击控制点可删除。按住 Alt 可不吸附网格。", "Arrastra los tiradores redondos del mapa para cambiar la forma de este tramo. Arrastra un tirador blanco para añadir una curva y haz doble clic en un tirador para quitarlo. Mantén Alt para salir de la cuadrícula.", "Faites glisser les poignées rondes sur la carte pour remodeler ce tronçon. Faites glisser une petite poignée blanche pour ajouter une courbe, double-cliquez sur une poignée pour la retirer. Maintenez Alt pour ignorer la grille.", "Runde Griffe auf der Karte ziehen, um diesen Abschnitt zu formen. Kleine weiße Marke ziehen, um einen Knick hinzuzufügen, Griff doppelklicken, um ihn zu entfernen. Alt halten, um ohne Raster zu setzen.", "Тяните круглые маркеры на карте, чтобы изменить форму участка. Потяните маленький белый маркер, чтобы добавить изгиб, дважды щёлкните маркер, чтобы удалить его. Держите Alt, чтобы ставить вне сетки.", "Trascina le maniglie rotonde sulla mappa per modellare questo tratto. Trascina una piccola maniglia bianca per aggiungere una curva e fai doppio clic su una maniglia per rimuoverla. Tieni premuto Alt per ignorare la griglia.", "Arraste as alças redondas no mapa para moldar este trecho. Arraste uma pequena alça branca para adicionar uma curva e dê um clique duplo numa alça para removê-la. Segure Alt para ignorar a grade.", "Seret pemegang bulat pada peta untuk membentuk semula segmen ini. Seret pemegang putih kecil untuk menambah lengkung, dan dwiklik pemegang untuk membuangnya. Tahan Alt untuk meletakkan di luar grid.", "اسحب المقابض الدائرية على الخريطة لتشكيل هذا المقطع. اسحب مقبضًا أبيض صغيرًا لإضافة انحناء، وانقر نقرًا مزدوجًا على مقبض لإزالته. اضغط Alt للوضع خارج الشبكة.", "Bu bölümü biçimlendirmek için haritadaki yuvarlak tutamaçları sürükleyin. Kıvrım eklemek için küçük beyaz tutamacı sürükleyin, kaldırmak için tutamaca çift tıklayın. Izgara dışına koymak için Alt'ı basılı tutun."], ["Drag the round points to reshape. Drag a small white handle to add a point, and double-click a point to remove it. Drag the water itself to move it. The colour is set in the Water panel (W).", "拖动圆点改变形状。拖动白色小控制点可添加点，双击点可删除。拖动水体本身可移动它。颜色在水域面板 (W) 中设置。", "Arrastra los puntos redondos para cambiar la forma. Arrastra un tirador blanco para añadir un punto y haz doble clic en un punto para quitarlo. Arrastra el agua para moverla. El color se elige en el panel Agua (W).", "Faites glisser les points ronds pour remodeler. Faites glisser une petite poignée blanche pour ajouter un point, double-cliquez sur un point pour le retirer. Faites glisser l’eau pour la déplacer. La couleur se règle dans le panneau Eau (W).", "Runde Punkte ziehen, um die Form zu ändern. Kleine weiße Marke ziehen, um einen Punkt hinzuzufügen, Punkt doppelklicken, um ihn zu entfernen. Das Wasser selbst ziehen, um es zu verschieben. Die Farbe wird im Wasser-Bereich (W) eingestellt.", "Тяните круглые точки, чтобы изменить форму. Потяните маленький белый маркер, чтобы добавить точку, дважды щёлкните точку, чтобы удалить её. Тяните саму воду, чтобы переместить её. Цвет задаётся на панели «Вода» (W).", "Trascina i punti rotondi per cambiare la forma. Trascina una piccola maniglia bianca per aggiungere un punto e fai doppio clic su un punto per rimuoverlo. Trascina l’acqua per spostarla. Il colore si imposta nel pannello Acqua (W).", "Arraste os pontos redondos para mudar a forma. Arraste uma pequena alça branca para adicionar um ponto e dê um clique duplo num ponto para removê-lo. Arraste a própria água para movê-la. A cor é definida no painel Água (W).", "Seret titik bulat untuk mengubah bentuk. Seret pemegang putih kecil untuk menambah titik, dan dwiklik titik untuk membuangnya. Seret air itu sendiri untuk mengalihkannya. Warna ditetapkan dalam panel Air (W).", "اسحب النقاط الدائرية لتغيير الشكل. اسحب مقبضًا أبيض صغيرًا لإضافة نقطة، وانقر نقرًا مزدوجًا على نقطة لإزالتها. اسحب الماء نفسه لتحريكه. يُضبط اللون في لوحة المياه (W).", "Biçimi değiştirmek için yuvarlak noktaları sürükleyin. Nokta eklemek için küçük beyaz tutamacı sürükleyin, kaldırmak için noktaya çift tıklayın. Taşımak için suyun kendisini sürükleyin. Renk, Su panelinden (W) ayarlanır."], ["Drag to add another rectangle to the selected area. It merges into one shape.", "拖动以给所选区域再添加一个矩形，它会合并成一个形状。", "Arrastra para añadir otro rectángulo a la zona seleccionada. Se une en una sola forma.", "Faites glisser pour ajouter un autre rectangle à la zone sélectionnée. Il fusionne en une seule forme.", "Ziehen, um dem ausgewählten Bereich ein weiteres Rechteck hinzuzufügen. Es verschmilzt zu einer Form.", "Потяните, чтобы добавить ещё один прямоугольник к выбранной зоне. Он сольётся в одну фигуру.", "Trascina per aggiungere un altro rettangolo alla zona selezionata. Si unisce in un’unica forma.", "Arraste para adicionar outro retângulo à zona selecionada. Ele se une numa só forma.", "Seret untuk menambah segi empat lagi pada kawasan yang dipilih. Ia bergabung menjadi satu bentuk.", "اسحب لإضافة مستطيل آخر إلى المنطقة المحددة. يندمج في شكل واحد.", "Seçili alana başka bir dikdörtgen eklemek için sürükleyin. Tek bir şekilde birleşir."], ["Drag to draw an area, like a district or the spawn chunks.", "拖动绘制一个区域，例如街区或出生点区块。", "Arrastra para dibujar una zona, como un distrito o los chunks del spawn.", "Faites glisser pour dessiner une zone, comme un quartier ou les chunks du spawn.", "Ziehen, um einen Bereich zu zeichnen, z. B. ein Viertel oder die Spawn-Chunks.", "Потяните, чтобы нарисовать зону, например район или чанки спавна.", "Trascina per disegnare una zona, come un quartiere o i chunk dello spawn.", "Arraste para desenhar uma zona, como um bairro ou os chunks do spawn.", "Seret untuk melukis kawasan, seperti daerah atau chunk spawn.", "اسحب لرسم منطقة، مثل حي أو قطع نقطة الظهور.", "Bir alan çizmek için sürükleyin; bir semt ya da doğma noktası chunk'ları gibi."], ["Drag to draw an area.", "拖动以绘制区域。", "Arrastra para dibujar una zona.", "Faites glisser pour dessiner une zone.", "Ziehen, um einen Bereich zu zeichnen.", "Потяните, чтобы нарисовать зону.", "Trascina per disegnare una zona.", "Arraste para desenhar uma zona.", "Seret untuk melukis kawasan.", "اسحب لرسم منطقة.", "Alan çizmek için sürükleyin."], ["Drag to move around. Scroll to zoom. Ctrl+drag pans with any tool.", "拖动以移动视图，滚轮缩放。任何工具下按 Ctrl+拖动都可平移。", "Arrastra para moverte. Usa la rueda para hacer zoom. Ctrl+arrastrar desplaza con cualquier herramienta.", "Faites glisser pour vous déplacer. Molette pour zoomer. Ctrl+glisser déplace la vue avec n’importe quel outil.", "Ziehen zum Verschieben. Scrollen zum Zoomen. Strg+Ziehen verschiebt mit jedem Werkzeug.", "Тяните, чтобы перемещаться. Колёсико — масштаб. Ctrl+перетаскиван
