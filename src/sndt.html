<title>SNDT</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' aria-hidden='true'%3E%3Crect width='32' height='32' fill='%230b0b0b'/%3E%3Cpath d='M5 21H12L20 13H28' fill='none' stroke='%23efede7' stroke-width='3.2' stroke-linejoin='miter'/%3E%3Cpath d='M5 17V25' stroke='%23efede7' stroke-width='3.2'/%3E%3Cpath d='M19 3V29' fill='none' stroke='%23e61919' stroke-width='3.2'/%3E%3Ccircle cx='19' cy='14' r='3.7' fill='%23efede7' stroke='%230b0b0b' stroke-width='1.8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Overpass:wght@400;500;600;700;800&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
/* Layout: one-screen editor on a strict grid. Header strip, lists left, canvas centre, inspector right; panels become drawers on phones.
   Direction: Swiss industrial print. Paper substrate, carbon ink, hazard red as the only accent, 90° corners, visible rules. */
:root{
  --paper:#efede7; --paper-2:#e3e0d8; --field:#f8f7f3; --ink:#0b0b0b; --muted:#55524c; --rule:#0b0b0b; --hair:#b9b5ab;
  --red:#e61919; --sel:#e61919; --danger:#e61919;
  --font-display:'Archivo Black','Arial Black',Impact,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans Arabic','Segoe UI',Tahoma,sans-serif;
  --font-ui:'JetBrains Mono',ui-monospace,'SFMono-Regular',Menlo,'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC','Noto Sans Arabic','Segoe UI',Tahoma,monospace;
  --hard:4px 4px 0 var(--ink); --nether:#6a2fb0;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#121212; --paper-2:#1e1e1d; --field:#1a1a19; --ink:#eaeaea; --muted:#9a978f; --rule:#eaeaea; --hair:#3a3936; --red:#ff2a2a; --sel:#ff2a2a; --danger:#ff2a2a; --nether:#c49bff; color-scheme:dark}}
:root[data-theme="dark"]{--paper:#121212; --paper-2:#1e1e1d; --field:#1a1a19; --ink:#eaeaea; --muted:#9a978f; --rule:#eaeaea; --hair:#3a3936; --red:#ff2a2a; --sel:#ff2a2a; --danger:#ff2a2a; --nether:#c49bff; color-scheme:dark}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--font-ui);font-size:12px;overflow:hidden}
*{box-sizing:border-box;border-radius:0!important}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:1px}
.app{display:grid;grid-template-rows:auto 1fr;height:100%}

/* header */
header{display:flex;align-items:stretch;gap:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--paper);border-bottom:3px solid var(--ink);min-width:0;height:52px}
header>*{align-self:center}
.logo{display:flex;align-items:center;gap:10px;white-space:nowrap;padding-right:14px;margin-right:10px;border-right:2px solid var(--ink);align-self:stretch}
.logo .mark{width:30px;height:30px;flex:none;display:block}
.logo .word{font-family:var(--font-display);font-size:24px;letter-spacing:-.05em;line-height:.9}
.hbtn{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 10px;border:2px solid var(--ink);background:var(--paper);white-space:nowrap;text-transform:uppercase;font-size:11px;letter-spacing:.08em;font-weight:500;margin-left:6px}
.hbtn:first-child{margin-left:0}
@media (hover:hover){.hbtn:hover{background:var(--ink);color:var(--paper)}}
.hbtn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:square;stroke-linejoin:miter}
.hbtn.icon{width:32px;padding:0;justify-content:center}
.lg-list{max-height:52vh;overflow:auto;border:2px solid var(--ink);margin:8px 0;padding:4px 10px}
.lg-row{padding:8px 0;border-bottom:1px solid var(--hair)}.lg-row:last-child{border-bottom:0}
.lg-head{display:flex;align-items:center;gap:8px;font-size:12px}.lg-head i{width:10px;height:10px;border:2px solid var(--ink);flex:none}.lg-head .sub{margin-left:auto}.lg-head .btn{margin:0;flex:none}
.lg-item{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;padding:3px 0 3px 18px}.lg-item .btn{margin:0;flex:none}
.fld[data-lock]::after{content:attr(data-lock);display:block;margin-top:4px;font-size:10px;font-weight:700;letter-spacing:.06em;color:var(--red)}
.fld [data-lk]{opacity:.55;cursor:not-allowed}
#liveBtn.on{width:auto;padding:0 9px;background:var(--red);border-color:var(--red);color:#fff}
#liveBtn .lv{display:none;font-weight:700}#liveBtn.on .lv{display:inline}
.live-code{font-family:var(--font-display);font-size:38px;letter-spacing:.06em;border:2px solid var(--ink);padding:8px 14px;text-align:center;margin:6px 0 10px;user-select:all}
.live-ppl{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:5px;font-size:12px}
.live-ppl li{display:flex;align-items:center;gap:8px}.live-ppl i{width:12px;height:12px;border:2px solid var(--ink);flex:none}
.live-join{display:flex;gap:6px}.live-join input{flex:1;text-transform:uppercase;letter-spacing:.12em;font-weight:700}
a.hbtn{color:inherit;text-decoration:none}a.hbtn[hidden]{display:none}
.hbtn:disabled{opacity:.3;cursor:default;background:var(--paper);color:var(--ink)}
.hbtn.primary{background:var(--red);color:#fff;border-color:var(--ink)}
@media (hover:hover){.hbtn.primary:hover{background:var(--ink)}}
#mapsBtn{margin-left:0;text-transform:none;letter-spacing:0;font-weight:700;font-size:12px}
.mapname{max-width:220px;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.hsel{height:32px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);font:inherit;font-size:11px;letter-spacing:.06em;padding:0 6px;margin-left:6px;cursor:pointer}
@media (hover:hover){.hsel:hover{background:var(--paper-2)}}
.seg{display:inline-flex;border:2px solid var(--ink);height:32px;margin-left:6px}
.seg button{border:0;background:transparent;padding:0 10px;text-transform:uppercase;font-size:11px;letter-spacing:.08em}
.seg button+button{border-left:2px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.status{font-size:10px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:7px;text-transform:uppercase;letter-spacing:.1em;margin-left:12px}
.status::before{content:"";width:8px;height:8px;background:var(--status,#9a968d);border:1px solid var(--ink)}
.only-narrow{display:none}

main{display:grid;grid-template-columns:var(--lw,256px) minmax(0,1fr) var(--rw,304px);min-height:0}
aside{background:var(--paper);overflow-y:auto;min-height:0}
#left{border-right:2px solid var(--ink)}
#right{border-left:2px solid var(--ink)}
.pane{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;border-bottom:2px solid var(--ink)}
.pane:last-child{border-bottom:0}
.pane h3{margin:0 -16px 2px;padding:0 16px 8px;font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid var(--hair)}
.pane h3::before{content:"//\00a0";color:var(--red)}
.pane>h3{cursor:pointer;user-select:none}
@media (hover:hover){.pane>h3:hover{color:var(--red)}}
.pane>h3::after{content:"";flex:none;width:7px;height:7px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-2px) rotate(45deg);margin-left:10px;transition:transform .15s ease}
.pane>h3:not(:has(> :last-child:not(:first-child)))::after{margin-left:auto}
.pane.closed>h3::after{transform:translateY(1px) rotate(-45deg)}
.pane.closed>h3{margin-bottom:0;padding-bottom:0;border-bottom:0}
.pane.closed>:not(h3){display:none!important}
@media (prefers-reduced-motion: reduce){.pane>h3::after{transition:none}}
.pane h3{justify-content:flex-start}
.pane h3>:last-child:not(:first-child){margin-left:auto}
.pane h2{margin:0;font-family:var(--font-display);font-size:17px;font-weight:400;letter-spacing:-.03em;line-height:1;text-transform:uppercase;text-wrap:balance}
.sub{color:var(--muted);font-size:11px;line-height:1.5;margin:0}

.list{display:flex;flex-direction:column;border-top:1px solid var(--hair)}
.list>.row,.list>div.row{border-bottom:1px solid var(--hair)}
.row{display:flex;align-items:center;gap:9px;width:100%;padding:6px 8px;border:0;background:transparent;text-align:left;min-width:0}
@media (hover:hover){.row:hover{background:var(--paper-2)}}
.row.on{background:var(--ink);color:var(--paper)}
.row.on .ct,.row.on .eye{color:var(--paper)}
.row .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .ct{font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.row .dim{font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:1px 4px;border:1px solid currentColor;color:var(--nether)}
.row.on .dim{color:var(--paper)}
.row.hid .nm{opacity:.45;text-decoration:line-through}
.sw{width:26px;height:12px;flex:none}
.eye{border:0;background:transparent;padding:3px;color:var(--muted);display:inline-flex}
@media (hover:hover){.eye:hover{color:var(--paper);background:var(--ink)}}
.eye svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2}
.mini{border:2px dashed var(--ink);background:transparent;padding:7px 9px;color:var(--ink);text-align:left;text-transform:uppercase;font-size:10.5px;letter-spacing:.08em}
@media (hover:hover){.mini:hover{background:var(--ink);color:var(--paper);border-style:solid}}
.search{width:100%;height:30px;border:2px solid var(--ink);background:var(--field);padding:0 9px}

/* stage */
#stage{position:relative;overflow:hidden;min-width:0}
#map{position:relative;width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none;background:transparent;will-change:transform;transform-origin:0 0;overflow:visible}
#under{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;will-change:transform;transform-origin:0 0;overflow:visible}
#map.t-pan{cursor:grab}#map.t-station,#map.t-line,#map.t-region{cursor:crosshair}#map.t-text{cursor:text}#map.t-water,#map.t-nature{cursor:crosshair}
.tools{position:absolute;left:14px;top:14px;display:flex;flex-direction:column;background:var(--paper);border:2px solid var(--ink);box-shadow:var(--hard)}
.tools button{width:40px;height:40px;border:0;background:transparent;display:grid;place-items:center;color:var(--ink);position:relative}
.tools button+button{border-top:1px solid var(--hair)}
@media (hover:hover){.tools button:hover{background:var(--paper-2)}}
.tools button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tools svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square;stroke-linejoin:miter}
.tools kbd{position:absolute;right:3px;bottom:2px;font-size:8.5px;opacity:.6}
.tg-tri{position:absolute;right:3px;bottom:3px;width:0;height:0;border-left:6px solid transparent;border-bottom:6px solid currentColor;opacity:.75}
.tg-pop{min-width:200px}
.tg-row{display:flex;align-items:center;gap:12px;border:0;background:transparent;text-align:left;width:100%;min-height:44px}
.tg-row svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:square}
.tg-row kbd{margin-left:auto;font-size:10px;opacity:.6}
.tg-row[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.zoom{position:absolute;right:14px;bottom:14px;display:flex;align-items:stretch;background:var(--paper);border:2px solid var(--ink);box-shadow:var(--hard)}
.zoom button{height:30px;min-width:30px;border:0;background:transparent;font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.06em}
.zoom button+*{border-left:1px solid var(--hair)}
@media (hover:hover){.zoom button:hover{background:var(--ink);color:var(--paper)}}
.zoom #bendsBtn{padding:0 9px;border-right:1px solid var(--hair)}
.zoom #bendsBtn[aria-pressed="false"]{text-decoration:line-through;color:var(--muted)}
.zoom #bendsBtn[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.zoom span{font-size:10.5px;min-width:48px;display:grid;place-items:center;color:var(--ink);font-variant-numeric:tabular-nums}
.cursor{position:absolute;left:14px;bottom:14px;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);background:var(--paper);border:2px solid var(--ink);padding:5px 8px;font-variant-numeric:tabular-nums}
.hint{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:7px 12px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;line-height:1.45;max-width:min(560px,calc(100% - 130px));text-align:center;pointer-events:none;border-left:6px solid var(--red)}
.banner{position:absolute;left:70px;right:14px;bottom:58px;margin-inline:auto;width:fit-content;max-width:calc(100% - 84px);display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--paper);border:2px solid var(--ink);box-shadow:var(--hard);padding:8px 8px 8px 0;font-size:11px}
.banner::before{content:"";align-self:stretch;width:14px;margin:-8px 0;background:repeating-linear-gradient(-45deg,var(--red) 0 5px,var(--paper) 5px 10px);border-right:2px solid var(--ink)}
.banner b{color:var(--red);text-transform:uppercase;letter-spacing:.08em}
.hsearch{flex:0 1 250px;min-width:32px;padding:0 8px;cursor:text;text-transform:none;letter-spacing:0;overflow:hidden}
.hsearch input{flex:1;min-width:0;border:0;background:transparent;outline:none;font-size:11px;height:100%;padding:0}
.hsearch input::placeholder{color:var(--muted)}
.hsearch kbd{font-size:9px;color:var(--muted);border:1px solid var(--hair);padding:1px 4px;white-space:nowrap}
.hsearch:focus-within{outline:2px solid var(--red);outline-offset:1px}
@media (hover:hover){.hsearch:hover{background:var(--paper);color:var(--ink)}}
@media (max-width:1250px){.hsearch kbd{display:none}header #status{display:none}}
@media (max-width:1100px) and (min-width:901px){header .seg button{padding:0 7px}header .hbtn{margin-left:4px}.logo{padding-right:10px;margin-right:6px}.mapname{max-width:140px}}
#navMenu .hsearch input,#navMenu .hsearch kbd{display:none}#navMenu .hsearch{cursor:pointer;flex:none}
.cmdk-drop{position:fixed;z-index:45;background:var(--paper);border:2px solid var(--ink);box-shadow:var(--hard);max-height:min(60vh,460px);display:flex;flex-direction:column}
.cmdk{width:min(520px,100%);align-self:start;margin-top:8vh;background:var(--paper);border:3px solid var(--ink);box-shadow:8px 8px 0 var(--red);display:flex;flex-direction:column;max-height:70vh}
.cmdk input{height:46px;border:0;border-bottom:2px solid var(--ink);background:var(--field);padding:0 14px;font-size:14px;outline:none}
.cmdk-list{overflow:auto;display:flex;flex-direction:column}
.cmdk-row{display:flex;align-items:center;gap:10px;border:0;border-bottom:1px solid var(--hair);background:transparent;text-align:left;padding:9px 14px;font-size:12px;min-height:40px}
.cmdk-row small{margin-left:auto;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em;white-space:nowrap}
.cmdk-row svg{width:17px;height:17px;flex:none;fill:none;stroke:currentColor;stroke-width:2}
.cmdk-row.on{background:var(--ink);color:var(--paper)}.cmdk-row.on small{color:var(--paper)}
.cmdk-empty{padding:14px;color:var(--muted)}
.fld.found,.pane.found>h3{outline:3px solid var(--red);outline-offset:3px;transition:outline-color 1.5s}
.chips.tpl-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}.tpl-grid .chip{width:100%;min-width:0;flex-direction:column;justify-content:center;gap:4px;padding:6px 4px;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tpl-grid .chip svg{width:30px;height:19px}
.crew{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.crew-card{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;border:2px solid var(--ink);background:var(--field);padding:12px 8px}
@media (max-width:640px){.crew{grid-template-columns:1fr 1fr}.crew-card:first-child{grid-column:1/-1}}
.crew-card img{border:0!important;background:none!important;width:84px;height:84px;image-rendering:auto}
.crew-card b{font-family:var(--font-display);font-weight:400;font-size:17px;letter-spacing:-.02em}
.crew-card .role{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--red)}
.crew-card .idea{font-size:11px;color:var(--muted);line-height:1.4}
.crew-thanks{display:flex;align-items:center;gap:12px;border-left:6px solid var(--red);background:var(--paper-2);padding:8px 12px;font-size:12px}
.crew-thanks img{width:48px;height:48px;flex:none}
.ab-bar{position:absolute;z-index:5;display:flex;flex-wrap:wrap;max-width:min(420px,calc(100% - 28px));background:var(--paper);border:2px solid var(--ink);box-shadow:var(--hard);transform:translateX(-50%)}
.ab-bar button{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 9px;border:0;background:transparent;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.ab-bar button+button{border-left:1px solid var(--hair)}
.ab-bar button i{width:12px;height:6px;flex:none}
.ab-bar button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
@media (hover:hover){.ab-bar button:not([aria-pressed="true"]):hover{background:var(--paper-2)}}
@media (pointer:coarse){.ab-bar button{height:40px}}

/* inspector controls */
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld>span{font-size:9.5px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.12em}
.fld input[type=text],.fld input[type=number],.fld select,.fld textarea,.ro{width:100%;height:30px;border:2px solid var(--ink);background:var(--field);padding:0 8px;min-width:0;font-size:12px}
.fld select{font-size:11px;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 13px) 12px,calc(100% - 8px) 12px;background-size:5px 5px;background-repeat:no-repeat;padding-right:24px}
.fld textarea{height:auto;min-height:54px;padding:6px 8px;resize:vertical;line-height:1.4}
.fld input[type=number],.ro{font-variant-numeric:tabular-nums}
.fld input[type=color]{width:100%;height:30px;border:2px solid var(--ink);background:var(--field);padding:2px}
.kgrp{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.kinds{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--ink);border:2px solid var(--ink)}
.kind{display:flex;align-items:center;gap:8px;border:0;background:var(--paper);padding:5px 6px;font-size:10px;text-transform:uppercase;letter-spacing:.04em;text-align:left;min-width:0}
@media (hover:hover){.kind:hover{background:var(--paper-2)}}
.kind[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.kind:last-child:nth-child(odd){grid-column:span 2}
.kind span{min-width:0;overflow-wrap:anywhere;hyphens:auto}
.kind .ki{width:30px;height:20px;flex:none;background:#fff;border:1px solid var(--ink)}
.grp{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:9px 8px 4px;border-bottom:1px solid var(--hair)}
.arcman{display:grid;grid-template-columns:1fr 84px;gap:10px;align-items:end}
.arcman input[type=range]{width:100%;height:30px;margin:0;accent-color:var(--red)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chk{display:flex;align-items:center;gap:8px;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.chk input{width:15px;height:15px;accent-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--ink);background:var(--paper);padding:3px 7px;font-size:11px}
@media (hover:hover){.chip:hover{background:var(--ink);color:var(--paper)}}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chip svg{flex:none}
.chip i{width:10px;height:10px;display:inline-block;border:1px solid var(--ink)}
.opts{display:flex;flex-wrap:wrap;gap:0;border:2px solid var(--ink);background:var(--ink);gap:2px}
.opt{border:0;background:var(--paper);padding:6px 8px;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;flex:1 1 auto}
@media (hover:hover){.opt:hover{background:var(--paper-2)}}
.opt[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

const L10N=[["Creators", "制作者", "Creadores", "Créateurs", "Mitwirkende", "Создатели", "Creatori", "Criadores", "Pembangun", "المبدعون", "Yapımcılar"],["the people who made SNDT", "制作 SNDT 的人们", "las personas que hicieron SNDT", "les personnes qui ont fait SNDT", "die Menschen hinter SNDT", "люди, создавшие SNDT", "le persone che hanno creato SNDT", "as pessoas que fizeram o SNDT", "orang yang membina SNDT", "الأشخاص الذين صنعوا SNDT", "SNDT’yi yapanlar"],["Developer", "开发者", "Desarrollador", "Développeur", "Entwickler", "Разработчик", "Sviluppatore", "Desenvolvedor", "Pembangun perisian", "المطوّر", "Geliştirici"],["Main Tester", "主要测试员", "Probador principal", "Testeur principal", "Haupttester", "Главный тестировщик", "Tester principale", "Testador principal", "Penguji utama", "المختبِر الرئيسي", "Baş test uzmanı"],["Tester", "测试员", "Probador", "Testeur", "Tester", "Тестировщик", "Tester", "Testador", "Penguji", "مختبِر", "Test uzmanı"],["Idea: custom station icons", "创意：自定义车站图标", "Idea: iconos de estación personalizados", "Idée : icônes de station personnalisées", "Idee: eigene Stationssymbole", "Идея: свои значки станций", "Idea: icone personalizzate delle stazioni", "Ideia: ícones de estação personalizados", "Idea: ikon stesen tersuai", "فكرة: أيقونات محطات مخصصة", "Fikir: özel istasyon simgeleri"],["Ideas: Zigzag bends and Mix types", "创意：之字形弯折和混合类型", "Ideas: curvas en zigzag y Mezclar tipos", "Idées : virages en zigzag et Mélanger les types", "Ideen: Zickzack-Knicke und Typen mischen", "Идеи: зигзаги и «Смешать типы»", "Idee: curve a zigzag e Mescola tipi", "Ideias: curvas em zigue-zague e Misturar tipos", "Idea: selekoh zigzag dan Campur jenis", "أفكار: الانعطاف المتعرج ومزج الأنواع", "Fikirler: zikzak kıvrımlar ve Türleri karıştır"],["Ideas: one-way segments and station shapes", "创意：单向区段和车站形状", "Ideas: tramos de un solo sentido y formas de estación", "Idées : segments à sens unique et formes de station", "Ideen: Einbahn-Abschnitte und Stationsformen", "Идеи: односторонние сегменты и формы станций", "Idee: segmenti a senso unico e forme delle stazioni", "Ideias: trechos de sentido único e formas de estação", "Idea: segmen sehala dan bentuk stesen", "أفكار: المقاطع ذات الاتجاه الواحد وأشكال المحطات", "Fikirler: tek yönlü bölümler ve istasyon şekilleri"],["And everyone else in the Petrolavia community, for ideas, testing and feedback.", "还有 Petrolavia 社区的每一位成员，感谢你们的创意、测试和反馈。", "Y a todos los demás de la comunidad de Petrolavia, por las ideas, las pruebas y los comentarios.", "Et à tous les autres membres de la communauté Petrolavia, pour les idées, les tests et les retours.", "Und allen anderen aus der Petrolavia-Community für Ideen, Tests und Rückmeldungen.", "И всем остальным из сообщества Petrolavia — за идеи, тесты и отзывы.", "E a tutti gli altri della comunità di Petrolavia, per idee, test e commenti.", "E a todos os outros da comunidade Petrolavia, pelas ideias, testes e sugestões.", "Dan semua yang lain dalam komuniti Petrolavia, atas idea, ujian dan maklum balas.", "وإلى كل أعضاء مجتمع Petrolavia الآخرين، على الأفكار والاختبار والملاحظات.", "Ve Petrolavia topluluğundaki herkese; fikirler, testler ve geri bildirimler için."],["Basics", "基础", "Lo básico", "Les bases", "Grundlagen", "Основы", "Le basi", "Básico", "Asas", "الأساسيات", "Temeller"], ["Pick a tool here or press its key: V selects and moves, S places stations, L draws lines. The last button holds text (T), images (I), areas (R), water (W) and nature (N).", "在这里选择工具或按对应按键：V 选择和移动，S 放置车站，L 绘制线路。最后一个按钮里有文字 (T)、图片 (I)、区域 (R)、水域 (W) 和自然 (N)。", "Elige aquí una herramienta o pulsa su tecla: V selecciona y mueve, S coloca estaciones, L dibuja líneas. El último botón contiene texto (T), imágenes (I), zonas (R), agua (W) y naturaleza (N).", "Choisissez un outil ici ou appuyez sur sa touche : V sélectionne et déplace, S place des stations, L trace des lignes. Le dernier bouton contient le texte (T), les images (I), les zones (R), l’eau (W) et la nature (N).", "Wähle hier ein Werkzeug oder drücke seine Taste: V wählt aus und verschiebt, S setzt Stationen, L zeichnet Linien. Der letzte Knopf enthält Text (T), Bilder (I), Flächen (R), Wasser (W) und Natur (N).", "Выберите инструмент здесь или нажмите его клавишу: V выделяет и перемещает, S ставит станции, L рисует линии. В последней кнопке — текст (T), изображения (I), области (R), вода (W) и природа (N).", "Scegli qui uno strumento o premi il suo tasto: V seleziona e sposta, S posiziona le stazioni, L disegna le linee. L’ultimo pulsante contiene testo (T), immagini (I), aree (R), acqua (W) e natura (N).", "Escolha uma ferramenta aqui ou pressione a tecla dela: V seleciona e move, S coloca estações, L desenha linhas. O último botão tem texto (T), imagens (I), áreas (R), água (W) e natureza (N).", "Pilih alat di sini atau tekan kekuncinya: V memilih dan menggerakkan, S meletakkan stesen, L melukis laluan. Butang terakhir mengandungi teks (T), imej (I), kawasan (R), air (W) dan alam semula jadi (N).", "اختر أداة من هنا أو اضغط مفتاحها: V للتحديد والتحريك، وS لوضع المحطات، وL لرسم الخطوط. يضم الزر الأخير النص (T) والصور (I) والمناطق (R) والماء (W) والطبيعة (N).", "Buradan bir araç seçin ya da tuşuna basın: V seçer ve taşır, S istasyon koyar, L hat çizer. Son düğmede metin (T), görsel (I), alan (R), su (W) ve doğa (N) var."], ["The station tool is on. Click the map wherever a station should go. Stations snap to the grid.", "车站工具已开启。在地图上点击要放置车站的位置。车站会吸附到网格。", "La herramienta de estación está activa. Haz clic en el mapa donde deba ir una estación. Las estaciones se ajustan a la cuadrícula.", "L’outil station est actif. Cliquez sur la carte là où une station doit aller. Les stations s’alignent sur la grille.", "Das Stationswerkzeug ist aktiv. Klicke auf die Karte, wo eine Station hin soll. Stationen rasten am Raster ein.", "Инструмент станций включён. Нажмите на карту там, где должна быть станция. Станции привязываются к сетке.", "Lo strumento stazione è attivo. Fai clic sulla mappa dove deve andare una stazione. Le stazioni si agganciano alla griglia.", "A ferramenta de estação está ativa. Clique no mapa onde uma estação deve ficar. As estações se encaixam na grade.", "Alat stesen dihidupkan. Klik peta di tempat stesen patut diletakkan. Stesen melekat pada grid.", "أداة المحطات مفعّلة. انقر على الخريطة حيث تريد وضع محطة. تلتصق المحطات بالشبكة.", "İstasyon aracı açık. İstasyonun olacağı yere haritada tıklayın. İstasyonlar ızgaraya oturur."], ["The station tool is on. Tap the map wherever a station should go. Stations snap to the grid.", "车站工具已开启。在地图上轻触要放置车站的位置。车站会吸附到网格。", "La herramienta de estación está activa. Toca el mapa donde deba ir una estación. Las estaciones se ajustan a la cuadrícula.", "L’outil station est actif. Touchez la carte là où une station doit aller. Les stations s’alignent sur la grille.", "Das Stationswerkzeug ist aktiv. Tippe auf die Karte, wo eine Station hin soll. Stationen rasten am Raster ein.", "Инструмент станций включён. Коснитесь карты там, где должна быть станция. Станции привязываются к сетке.", "Lo strumento stazione è attivo. Tocca la mappa dove deve andare una stazione. Le stazioni si agganciano alla griglia.", "A ferramenta de estação está ativa. Toque no mapa onde uma estação deve ficar. As estações se encaixam na grade.", "Alat stesen dihidupkan. Ketik peta di tempat stesen patut diletakkan. Stesen melekat pada grid.", "أداة المحطات مفعّلة. المس الخريطة حيث تريد وضع محطة. تلتصق المحطات بالشبكة.", "İstasyon aracı açık. İstasyonun olacağı yere haritada dokunun. İstasyonlar ızgaraya oturur."], ["Place 3 stations.", "放置 3 个车站。", "Coloca 3 estaciones.", "Placez 3 stations.", "Setze 3 Stationen.", "Поставьте 3 станции.", "Posiziona 3 stazioni.", "Coloque 3 estações.", "Letakkan 3 stesen.", "ضع 3 محطات.", "3 istasyon koyun."], ["Click your stations in order. Clicking empty map adds a new stop on the way. Press Enter when the line is done.", "按顺序点击你的车站。点击空白处会在途中添加新车站。线路画完后按 Enter。", "Haz clic en tus estaciones en orden. Hacer clic en el mapa vacío añade una parada nueva por el camino. Pulsa Enter cuando termines la línea.", "Cliquez sur vos stations dans l’ordre. Cliquer sur la carte vide ajoute un nouvel arrêt en chemin. Appuyez sur Entrée quand la ligne est finie.", "Klicke deine Stationen der Reihe nach an. Ein Klick auf leere Karte fügt unterwegs einen neuen Halt hinzu. Drücke Enter, wenn die Linie fertig ist.", "Нажимайте на станции по порядку. Нажатие на пустое место добавляет новую остановку по пути. Нажмите Enter, когда линия готова.", "Fai clic sulle stazioni in ordine. Un clic sulla mappa vuota aggiunge una nuova fermata lungo il percorso. Premi Invio quando la linea è finita.", "Clique nas suas estações em ordem. Clicar no mapa vazio adiciona uma nova parada no caminho. Pressione Enter quando a linha estiver pronta.", "Klik stesen anda mengikut urutan. Klik peta kosong menambah hentian baharu di laluan. Tekan Enter apabila laluan siap.", "انقر على محطاتك بالترتيب. النقر على مكان فارغ يضيف محطة جديدة في الطريق. اضغط Enter عند انتهاء الخط.", "İstasyonlarınıza sırayla tıklayın. Boş haritaya tıklamak yol üzerine yeni durak ekler. Hat bitince Enter’a basın."], ["Tap your stations in order. Tapping empty map adds a new stop on the way. Tap Done when the line is finished.", "按顺序轻触你的车站。轻触空白处会在途中添加新车站。线路画完后轻触“完成”。", "Toca tus estaciones en orden. Tocar el mapa vacío añade una parada nueva por el camino. Toca Hecho cuando termines la línea.", "Touchez vos stations dans l’ordre. Toucher la carte vide ajoute un nouvel arrêt en chemin. Touchez Terminé quand la ligne est finie.", "Tippe deine Stationen der Reihe nach an. Tippen auf leere Karte fügt unterwegs einen neuen Halt hinzu. Tippe auf Fertig, wenn die Linie fertig ist.", "Касайтесь станций по порядку. Касание пустого места добавляет новую остановку по пути. Нажмите «Готово», когда линия готова.", "Tocca le stazioni in ordine. Toccare la mappa vuota aggiunge una nuova fermata lungo il percorso. Tocca Fatto quando la linea è finita.", "Toque nas suas estações em ordem. Tocar no mapa vazio adiciona uma nova parada no caminho. Toque em Concluído quando a linha estiver pronta.", "Ketik stesen anda mengikut urutan. Ketik peta kosong menambah hentian baharu di laluan. Ketik Selesai apabila laluan siap.", "المس محطاتك بالترتيب. لمس مكان فارغ يضيف محطة جديدة في الطريق. المس «تم» عند انتهاء الخط.", "İstasyonlarınıza sırayla dokunun. Boş haritaya dokunmak yol üzerine yeni durak ekler. Hat bitince Bitti’ye dokunun."], ["Connect 2 or more stations with a line and finish it.", "用一条线路连接 2 个或更多车站并完成它。", "Une 2 o más estaciones con una línea y termínala.", "Reliez 2 stations ou plus par une ligne et terminez-la.", "Verbinde 2 oder mehr Stationen mit einer Linie und schließe sie ab.", "Соедините линией 2 или больше станций и завершите её.", "Collega 2 o più stazioni con una linea e finiscila.", "Ligue 2 ou mais estações com uma linha e conclua-a.", "Sambungkan 2 atau lebih stesen dengan satu laluan dan selesaikannya.", "اربط محطتين أو أكثر بخط وأنهِه.", "2 veya daha fazla istasyonu bir hatla bağlayıp bitirin."], ["With the select tool, click anything to select it and drag to move it. Drag on empty map to box-select, Shift+click to add to the selection. Scroll to zoom; hold Space or Ctrl and drag to pan.", "使用选择工具，点击任何东西即可选中，拖动即可移动。在空白处拖动可框选，Shift+点击可加入选择。滚轮缩放；按住空格或 Ctrl 拖动可平移。", "Con la herramienta de selección, haz clic en cualquier cosa para seleccionarla y arrástrala para moverla. Arrastra en el mapa vacío para seleccionar con un recuadro y usa Mayús+clic para añadir a la selección. Desplaza la rueda para hacer zoom; mantén Espacio o Ctrl y arrastra para moverte.", "Avec l’outil de sélection, cliquez sur n’importe quoi pour le sélectionner et faites-le glisser pour le déplacer. Glissez sur la carte vide pour sélectionner par cadre, Maj+clic ajoute à la sélection. Faites défiler pour zoomer ; maintenez Espace ou Ctrl et glissez pour vous déplacer.", "Mit dem Auswahlwerkzeug klickst du etwas an, um es auszuwählen, und ziehst es zum Verschieben. Ziehen auf leerer Karte wählt per Rahmen aus, Umschalt+Klick fügt zur Auswahl hinzu. Scrollen zoomt; halte Leertaste oder Strg und ziehe zum Verschieben der Ansicht.", "С инструментом выделения нажмите на что угодно, чтобы выбрать, и перетащите, чтобы переместить. Протяните по пустой карте для выделения рамкой, Shift+щелчок добавляет к выделению. Колесо масштабирует; удерживайте Пробел или Ctrl и тяните, чтобы сдвинуть вид.", "Con lo strumento di selezione, fai clic su qualsiasi cosa per selezionarla e trascinala per spostarla. Trascina sulla mappa vuota per selezionare con un riquadro, Maiusc+clic aggiunge alla selezione. Scorri per lo zoom; tieni premuto Spazio o Ctrl e trascina per spostare la vista.", "Com a ferramenta de seleção, clique em qualquer coisa para selecioná-la e arraste para movê-la. Arraste no mapa vazio para selecionar em caixa, Shift+clique adiciona à seleção. Role para dar zoom; segure Espaço ou Ctrl e arraste para mover a vista.", "Dengan alat pilih, klik apa-apa untuk memilihnya dan seret untuk mengalihkannya. Seret pada peta kosong untuk pilih kotak, Shift+klik menambah pada pilihan. Tatal untuk zum; tahan Space atau Ctrl dan seret untuk menggerakkan pandangan.", "باستخدام أداة التحديد، انقر على أي شيء لتحديده واسحبه لتحريكه. اسحب على مكان فارغ للتحديد بمربع، وShift+نقر يضيف إلى التحديد. مرّر للتكبير؛ اضغط مع الاستمرار على المسافة أو Ctrl واسحب لتحريك العرض.", "Seçme aracıyla bir şeye tıklayıp seçin, sürükleyip taşıyın. Boş haritada sürüklemek kutuyla seçer, Shift+tıklama seçime ekler. Yakınlaştırmak için kaydırın; görünümü kaydırmak için Boşluk ya da Ctrl’yi basılı tutup sürükleyin."], ["Double-tap something to select it, then drag it. Drag with one finger to move around and pinch to zoom. Double-tap and drag draws a selection box.", "双击某个东西即可选中，然后拖动它。单指拖动可移动视图，双指捏合可缩放。双击后拖动可画出选择框。", "Toca dos veces algo para seleccionarlo y luego arrástralo. Arrastra con un dedo para moverte y pellizca para hacer zoom. Tocar dos veces y arrastrar dibuja un recuadro de selección.", "Touchez deux fois un élément pour le sélectionner, puis faites-le glisser. Glissez d’un doigt pour vous déplacer et pincez pour zoomer. Toucher deux fois puis glisser trace un cadre de sélection.", "Tippe zweimal auf etwas, um es auszuwählen, und ziehe es dann. Mit einem Finger ziehen bewegt die Ansicht, mit zwei Fingern zoomst du. Zweimal tippen und ziehen zeichnet einen Auswahlrahmen.", "Коснитесь чего-либо дважды, чтобы выбрать, затем перетащите. Тяните одним пальцем, чтобы двигаться, и сводите пальцы для масштаба. Двойное касание с протягиванием рисует рамку выделения.", "Tocca due volte qualcosa per selezionarlo, poi trascinalo. Trascina con un dito per muoverti e pizzica per lo zoom. Tocca due volte e trascina per disegnare un riquadro di selezione.", "Toque duas vezes em algo para selecioná-lo e depois arraste. Arraste com um dedo para se mover e faça pinça para dar zoom. Tocar duas vezes e arrastar desenha uma caixa de seleção.", "Ketik dua kali sesuatu untuk memilihnya, kemudian seretnya. Seret dengan satu jari untuk bergerak dan cubit untuk zum. Ketik dua kali dan seret untuk melukis kotak pilihan.", "المس أي شيء مرتين لتحديده ثم اسحبه. اسحب بإصبع واحد للتنقل وقرّب الإصبعين للتكبير. اللمس مرتين ثم السحب يرسم مربع تحديد.", "Bir şeyi seçmek için iki kez dokunun, sonra sürükleyin. Gezinmek için tek parmakla sürükleyin, yakınlaştırmak için iki parmakla sıkıştırın. İki kez dokunup sürüklemek seçim kutusu çizer."], ["Move a station.", "移动一个车站。", "Mueve una estación.", "Déplacez une station.", "Verschiebe eine Station.", "Переместите станцию.", "Sposta una stazione.", "Mova uma estação.", "Alihkan satu stesen.", "حرّك محطة.", "Bir istasyonu taşıyın."], ["Select the station at the end of a line: short stubs show where you could build next, and a small bar picks Extend or New line. Click a stub, then click the map to place the next station. You can turn this off in Map → Lines.", "选中线路末端的车站：短线头会显示接下来可以建造的方向，小工具条可选择“延长”或“新建线路”。点击一个线头，再点击地图放置下一个车站。可以在 地图 → 线路 中关闭此功能。", "Selecciona la estación al final de una línea: unos tramos cortos muestran dónde podrías construir, y una pequeña barra elige Extender o Nueva línea. Haz clic en un tramo y luego en el mapa para colocar la siguiente estación. Puedes desactivarlo en Mapa → Líneas.", "Sélectionnez la station au bout d’une ligne : de courts départs montrent où construire ensuite, et une petite barre choisit Prolonger ou Nouvelle ligne. Cliquez sur un départ, puis sur la carte pour placer la station suivante. Vous pouvez désactiver cela dans Carte → Lignes.", "Wähle die Station am Ende einer Linie: kurze Ansätze zeigen, wo du weiterbauen kannst, und eine kleine Leiste wählt Verlängern oder Neue Linie. Klicke einen Ansatz an, dann die Karte, um die nächste Station zu setzen. Abschalten kannst du das unter Karte → Linien.", "Выберите станцию в конце линии: короткие отростки покажут, куда можно строить дальше, а маленькая панель выберет «Продлить» или «Новая линия». Нажмите на отросток, затем на карту, чтобы поставить следующую станцию. Отключить это можно в разделе Карта → Линии.", "Seleziona la stazione alla fine di una linea: brevi tratti mostrano dove potresti costruire, e una piccola barra sceglie Estendi o Nuova linea. Fai clic su un tratto, poi sulla mappa per posizionare la stazione successiva. Puoi disattivarlo in Mappa → Linee.", "Selecione a estação no fim de uma linha: pequenos trechos mostram onde você pode construir, e uma barrinha escolhe Estender ou Nova linha. Clique num trecho e depois no mapa para colocar a próxima estação. Você pode desligar isso em Mapa → Linhas.", "Pilih stesen di hujung laluan: cabang pendek menunjukkan tempat anda boleh membina seterusnya, dan bar kecil memilih Panjangkan atau Laluan baharu. Klik satu cabang, kemudian klik peta untuk meletakkan stesen seterusnya. Anda boleh mematikannya dalam Peta → Laluan.", "حدّد المحطة في نهاية خط: تظهر فروع قصيرة حيث يمكنك البناء بعد ذلك، وشريط صغير يختار «تمديد» أو «خط جديد». انقر على فرع ثم على الخريطة لوضع المحطة التالية. يمكنك إيقاف ذلك من الخريطة ← الخطوط.", "Bir hattın sonundaki istasyonu seçin: kısa uçlar bir sonraki inşa yönünü gösterir, küçük bir çubuk Uzat ya da Yeni hat seçer. Bir uca, sonra haritaya tıklayıp sonraki istasyonu koyun. Bunu Harita → Hatlar’dan kapatabilirsiniz."], ["Double-tap the station at the end of a line: short stubs show where you could build next, and a small bar picks Extend or New line. Tap a stub, then tap the map to place the next station.", "双击线路末端的车站：短线头会显示接下来可以建造的方向，小工具条可选择“延长”或“新建线路”。轻触一个线头，再轻触地图放置下一个车站。", "Toca dos veces la estación al final de una línea: unos tramos cortos muestran dónde podrías construir, y una pequeña barra elige Extender o Nueva línea. Toca un tramo y luego el mapa para colocar la siguiente estación.", "Touchez deux fois la station au bout d’une ligne : de courts départs montrent où construire ensuite, et une petite barre choisit Prolonger ou Nouvelle ligne. Touchez un départ, puis la carte pour placer la station suivante.", "Tippe zweimal auf die Station am Ende einer Linie: kurze Ansätze zeigen, wo du weiterbauen kannst, und eine kleine Leiste wählt Verlängern oder Neue Linie. Tippe einen Ansatz an, dann die Karte, um die nächste Station zu setzen.", "Дважды коснитесь станции в конце линии: короткие отростки покажут, куда можно строить дальше, а маленькая панель выберет «Продлить» или «Новая линия». Коснитесь отростка, затем карты, чтобы поставить следующую станцию.", "Tocca due volte la stazione alla fine di una linea: brevi tratti mostrano dove potresti costruire, e una piccola barra sceglie Estendi o Nuova linea. Tocca un tratto, poi la mappa per posizionare la stazione successiva.", "Toque duas vezes na estação no fim de uma linha: pequenos trechos mostram onde você pode construir, e uma barrinha escolhe Estender ou Nova linha. Toque num trecho e depois no mapa para colocar a próxima estação.", "Ketik dua kali stesen di hujung laluan: cabang pendek menunjukkan tempat anda boleh membina seterusnya, dan bar kecil memilih Panjangkan atau Laluan baharu. Ketik satu cabang, kemudian ketik peta untuk meletakkan stesen seterusnya.", "المس المحطة في نهاية خط مرتين: تظهر فروع قصيرة حيث يمكنك البناء بعد ذلك، وشريط صغير يختار «تمديد» أو «خط جديد». المس فرعًا ثم الخريطة لوضع المحطة التالية.", "Bir hattın sonundaki istasyona iki kez dokunun: kısa uçlar bir sonraki inşa yönünü gösterir, küçük bir çubuk Uzat ya da Yeni hat seçer. Bir uca, sonra haritaya dokunup sonraki istasyonu koyun."], ["Extend a line with a stub.", "用线头延长一条线路。", "Extiende una línea con un tramo.", "Prolongez une ligne avec un départ.", "Verlängere eine Linie über einen Ansatz.", "Продлите линию через отросток.", "Estendi una linea con un tratto.", "Estenda uma linha com um trecho.", "Panjangkan laluan dengan satu cabang.", "مدّد خطًا باستخدام فرع.", "Bir hattı bir uçla uzatın."], ["Whatever you select shows up in this panel: names, types, colours, positions and more. With nothing selected it shows the map’s own settings.", "你选中的任何东西都会显示在这个面板中：名称、类型、颜色、位置等。未选中任何东西时，这里显示地图本身的设置。", "Lo que selecciones aparece en este panel: nombres, tipos, colores, posiciones y más. Sin nada seleccionado muestra los ajustes del propio mapa.", "Tout ce que vous sélectionnez apparaît dans ce panneau : noms, types, couleurs, positions et plus. Sans sélection, il affiche les réglages de la carte.", "Alles, was du auswählst, erscheint in diesem Bereich: Namen, Typen, Farben, Positionen und mehr. Ist nichts ausgewählt, zeigt er die Einstellungen der Karte.", "Всё, что вы выбрали, появляется на этой панели: названия, типы, цвета, положение и другое. Если ничего не выбрано, здесь настройки самой карты.", "Tutto ciò che selezioni appare in questo pannello: nomi, tipi, colori, posizioni e altro. Senza selezione mostra le impostazioni della mappa.", "Tudo o que você seleciona aparece neste painel: nomes, tipos, cores, posições e mais. Sem nada selecionado, ele mostra as configurações do próprio mapa.", "Apa sahaja yang anda pilih dipaparkan dalam panel ini: nama, jenis, warna, kedudukan dan lain-lain. Jika tiada yang dipilih, ia menunjukkan tetapan peta itu sendiri.", "كل ما تحدده يظهر في هذه اللوحة: الأسماء والأنواع والألوان والمواضع وغير ذلك. وعند عدم تحديد شيء تعرض إعدادات الخريطة نفسها.", "Seçtiğiniz her şey bu panelde görünür: adlar, türler, renkler, konumlar ve daha fazlası. Hiçbir şey seçili değilken haritanın kendi ayarlarını gösterir."], ["Whatever you select opens in a panel at the bottom: names, types, colours and more. Drag its bar up to see everything.", "你选中的任何东西都会在底部的面板中打开：名称、类型、颜色等。向上拖动面板顶部的横条可查看全部内容。", "Lo que selecciones se abre en un panel abajo: nombres, tipos, colores y más. Arrastra su barra hacia arriba para verlo todo.", "Tout ce que vous sélectionnez s’ouvre dans un panneau en bas : noms, types, couleurs et plus. Faites glisser sa barre vers le haut pour tout voir.", "Alles, was du auswählst, öffnet sich in einem Bereich unten: Namen, Typen, Farben und mehr. Ziehe seine Leiste nach oben, um alles zu sehen.", "Всё, что вы выбрали, открывается в панели внизу: названия, типы, цвета и другое. Потяните её полоску вверх, чтобы увидеть всё.", "Tutto ciò che selezioni si apre in un pannello in basso: nomi, tipi, colori e altro. Trascina la sua barra verso l’alto per vedere tutto.", "Tudo o que você seleciona abre num painel embaixo: nomes, tipos, cores e mais. Arraste a barra dele para cima para ver tudo.", "Apa sahaja yang anda pilih dibuka dalam panel di bawah: nama, jenis, warna dan lain-lain. Seret barnya ke atas untuk melihat semuanya.", "كل ما تحدده يُفتح في لوحة في الأسفل: الأسماء والأنواع والألوان وغير ذلك. اسحب شريطها إلى الأعلى لرؤية كل شيء.", "Seçtiğiniz her şey alttaki bir panelde açılır: adlar, türler, renkler ve daha fazlası. Hepsini görmek için çubuğunu yukarı sürükleyin."], ["Undo and redo", "撤销和重做", "Deshacer y rehacer", "Annuler et rétablir", "Rückgängig und Wiederholen", "Отмена и повтор", "Annulla e ripeti", "Desfazer e refazer", "Buat asal dan buat semula", "التراجع والإعادة", "Geri al ve yinele"], ["Made a mistake? Ctrl+Z undoes and Ctrl+Shift+Z redoes, or use these buttons.", "出错了？Ctrl+Z 撤销，Ctrl+Shift+Z 重做，也可以使用这些按钮。", "¿Te equivocaste? Ctrl+Z deshace y Ctrl+Mayús+Z rehace, o usa estos botones.", "Une erreur ? Ctrl+Z annule et Ctrl+Maj+Z rétablit, ou utilisez ces boutons.", "Ein Fehler? Strg+Z macht rückgängig, Strg+Umschalt+Z wiederholt, oder nutze diese Knöpfe.", "Ошиблись? Ctrl+Z отменяет, Ctrl+Shift+Z повторяет, или используйте эти кнопки.", "Un errore? Ctrl+Z annulla e Ctrl+Maiusc+Z ripete, oppure usa questi pulsanti.", "Errou? Ctrl+Z desfaz e Ctrl+Shift+Z refaz, ou use estes botões.", "Tersilap? Ctrl+Z membuat asal dan Ctrl+Shift+Z membuat semula, atau gunakan butang ini.", "هل أخطأت؟ Ctrl+Z للتراجع وCtrl+Shift+Z للإعادة، أو استخدم هذين الزرين.", "Hata mı yaptınız? Ctrl+Z geri alır, Ctrl+Shift+Z yineler; ya da bu düğmeleri kullanın."], ["Made a mistake? Use these buttons to undo and redo.", "出错了？使用这些按钮撤销和重做。", "¿Te equivocaste? Usa estos botones para deshacer y rehacer.", "Une erreur ? Utilisez ces boutons pour annuler et rétablir.", "Ein Fehler? Nutze diese Knöpfe zum Rückgängigmachen und Wiederholen.", "Ошиблись? Используйте эти кнопки для отмены и повтора.", "Un errore? Usa questi pulsanti per annullare e ripetere.", "Errou? Use estes botões para desfazer e refazer.", "Tersilap? Gunakan butang ini untuk buat asal dan buat semula.", "هل أخطأت؟ استخدم هذين الزرين للتراجع والإعادة.", "Hata mı yaptınız? Geri almak ve yinelemek için bu düğmeleri kullanın."], ["Your work saves automatically in this browser. This menu starts new maps, duplicates and switches maps, and imports backups, Rail Map Painter projects and MTR servers.", "你的作品会自动保存在这个浏览器中。这个菜单可以新建地图、复制和切换地图，以及导入备份、Rail Map Painter 项目和 MTR 服务器。", "Tu trabajo se guarda solo en este navegador. Este menú crea mapas nuevos, duplica y cambia de mapa, e importa copias de seguridad, proyectos de Rail Map Painter y servidores MTR.", "Votre travail s’enregistre automatiquement dans ce navigateur. Ce menu crée de nouvelles cartes, duplique et change de carte, et importe des sauvegardes, des projets Rail Map Painter et des serveurs MTR.", "Deine Arbeit wird automatisch in diesem Browser gespeichert. Dieses Menü startet neue Karten, dupliziert und wechselt Karten und importiert Sicherungen, Rail-Map-Painter-Projekte und MTR-Server.", "Ваша работа сохраняется автоматически в этом браузере. В этом меню можно создать новую карту, скопировать или переключить карту и импортировать резервные копии, проекты Rail Map Painter и серверы MTR.", "Il tuo lavoro si salva automaticamente in questo browser. Questo menu crea nuove mappe, duplica e cambia mappa e importa backup, progetti Rail Map Painter e server MTR.", "Seu trabalho é salvo automaticamente neste navegador. Este menu cria mapas novos, duplica e troca de mapa e importa backups, projetos do Rail Map Painter e servidores MTR.", "Kerja anda disimpan secara automatik dalam pelayar ini. Menu ini memulakan peta baharu, menduplikasi dan menukar peta, serta mengimport sandaran, projek Rail Map Painter dan pelayan MTR.", "يُحفظ عملك تلقائيًا في هذا المتصفح. تبدأ هذه القائمة خرائط جديدة وتنسخ الخرائط وتتنقل بينها، وتستورد النسخ الاحتياطية ومشاريع Rail Map Painter وخوادم MTR.", "Çalışmanız bu tarayıcıda otomatik kaydedilir. Bu menü yeni harita başlatır, haritaları kopyalar ve değiştirir; yedekleri, Rail Map Painter projelerini ve MTR sunucularını içe aktarır."], ["Lines and tracks", "线路与轨道", "Líneas y vías", "Lignes et voies", "Linien und Gleise", "Линии и пути", "Linee e binari", "Linhas e trilhos", "Laluan dan landasan", "الخطوط والمسارات", "Hatlar ve raylar"], ["Pick a track", "选择一段轨道", "Elige una vía", "Choisissez une voie", "Wähle ein Gleisstück", "Выберите участок пути", "Scegli un binario", "Escolha um trilho", "Pilih landasan", "اختر مسارًا", "Bir ray seçin"], ["Each piece of track between two stations is a segment. Click one to select it.", "两个车站之间的每段轨道称为一个区段。点击一个区段即可选中。", "Cada tramo de vía entre dos estaciones es un segmento. Haz clic en uno para seleccionarlo.", "Chaque morceau de voie entre deux stations est un segment. Cliquez sur l’un d’eux pour le sélectionner.", "Jedes Gleisstück zwischen zwei Stationen ist ein Abschnitt. Klicke einen an, um ihn auszuwählen.", "Каждый участок пути между двумя станциями — это сегмент. Нажмите на него, чтобы выбрать.", "Ogni tratto di binario tra due stazioni è un segmento. Fai clic su uno per selezionarlo.", "Cada pedaço de trilho entre duas estações é um trecho. Clique em um para selecioná-lo.", "Setiap bahagian landasan antara dua stesen ialah satu segmen. Klik satu untuk memilihnya.", "كل جزء من المسار بين محطتين هو مقطع. انقر على أحدها لتحديده.", "İki istasyon arasındaki her ray parçası bir bölümdür. Seçmek için birine tıklayın."], ["Each piece of track between two stations is a segment. Double-tap one to select it.", "两个车站之间的每段轨道称为一个区段。双击一个区段即可选中。", "Cada tramo de vía entre dos estaciones es un segmento. Toca dos veces uno para seleccionarlo.", "Chaque morceau de voie entre deux stations est un segment. Touchez-en un deux fois pour le sélectionner.", "Jedes Gleisstück zwischen zwei Stationen ist ein Abschnitt. Tippe zweimal auf einen, um ihn auszuwählen.", "Каждый участок пути между двумя станциями — это сегмент. Коснитесь его дважды, чтобы выбрать.", "Ogni tratto di binario tra due stazioni è un segmento. Tocca due volte uno per selezionarlo.", "Cada pedaço de trilho entre duas estações é um trecho. Toque duas vezes em um para selecioná-lo.", "Setiap bahagian landasan antara dua stesen ialah satu segmen. Ketik dua kali satu untuk memilihnya.", "كل جزء من المسار بين محطتين هو مقطع. المس أحدها مرتين لتحديده.", "İki istasyon arasındaki her ray parçası bir bölümdür. Seçmek için birine iki kez dokunun."], ["Select a segment.", "选中一个区段。", "Selecciona un segmento.", "Sélectionnez un segment.", "Wähle einen Abschnitt aus.", "Выберите сегмент.", "Seleziona un segmento.", "Selecione um trecho.", "Pilih satu segmen.", "حدّد مقطعًا.", "Bir bölüm seçin."], ["How it bends", "弯折方式", "Cómo se curva", "Comment elle tourne", "Wie es abknickt", "Как он изгибается", "Come curva", "Como ele curva", "Cara ia membelok", "كيف ينعطف", "Nasıl kıvrılır"], ["Choose how this segment bends: straight then 45°, 45° then straight, direct, two right-angle turns, a curve or a zigzag. Drag the handles on the map to give it any shape. Double-click a track to insert a station.", "选择这个区段的弯折方式：先直后 45°、先 45° 后直、直连、两种直角转弯、曲线或之字形。拖动地图上的控制点可以做出任意形状。双击轨道可插入车站。", "Elige cómo se curva este segmento: recto y luego 45°, 45° y luego recto, directo, dos giros en ángulo recto, una curva o un zigzag. Arrastra los tiradores del mapa para darle cualquier forma. Haz doble clic en una vía para insertar una estación.", "Choisissez comment ce segment tourne : droit puis 45°, 45° puis droit, direct, deux virages à angle droit, une courbe ou un zigzag. Faites glisser les poignées sur la carte pour lui donner n’importe quelle forme. Double-cliquez sur une voie pour insérer une station.", "Wähle, wie dieser Abschnitt abknickt: gerade dann 45°, 45° dann gerade, direkt, zwei rechtwinklige Varianten, eine Kurve oder ein Zickzack. Ziehe die Griffe auf der Karte für jede beliebige Form. Doppelklicke ein Gleis, um eine Station einzufügen.", "Выберите, как изгибается этот сегмент: прямо, затем 45°; 45°, затем прямо; напрямую; два поворота под прямым углом; кривая или зигзаг. Тяните маркеры на карте, чтобы придать любую форму. Двойной щелчок по пути вставляет станцию.", "Scegli come curva questo segmento: dritto poi 45°, 45° poi dritto, diretto, due svolte ad angolo retto, una curva o uno zigzag. Trascina le maniglie sulla mappa per dargli qualsiasi forma. Fai doppio clic su un binario per inserire una stazione.", "Escolha como este trecho curva: reto e depois 45°, 45° e depois reto, direto, duas curvas em ângulo reto, uma curva ou um zigue-zague. Arraste as alças no mapa para dar qualquer forma. Clique duas vezes num trilho para inserir uma estação.", "Pilih cara segmen ini membelok: lurus kemudian 45°, 45° kemudian lurus, terus, dua belokan sudut tegak, lengkung atau zigzag. Seret pemegang di peta untuk memberi sebarang bentuk. Klik dua kali landasan untuk menyisipkan stesen.", "اختر طريقة انعطاف هذا المقطع: مستقيم ثم 45°، أو 45° ثم مستقيم، أو مباشر، أو انعطافتان بزاوية قائمة، أو منحنى، أو متعرج. اسحب المقابض على الخريطة لتمنحه أي شكل. انقر نقرًا مزدوجًا على مسار لإدراج محطة.", "Bu bölümün nasıl kıvrılacağını seçin: önce düz sonra 45°, önce 45° sonra düz, doğrudan, iki dik açılı dönüş, eğri ya da zikzak. Herhangi bir şekil vermek için haritadaki tutamaçları sürükleyin. İstasyon eklemek için raya çift tıklayın."], ["Choose how this segment bends: straight then 45°, 45° then straight, direct, two right-angle turns, a curve or a zigzag. Long-press a track to insert a station.", "选择这个区段的弯折方式：先直后 45°、先 45° 后直、直连、两种直角转弯、曲线或之字形。长按轨道可插入车站。", "Elige cómo se curva este segmento: recto y luego 45°, 45° y luego recto, directo, dos giros en ángulo recto, una curva o un zigzag. Mantén pulsada una vía para insertar una estación.", "Choisissez comment ce segment tourne : droit puis 45°, 45° puis droit, direct, deux virages à angle droit, une courbe ou un zigzag. Appuyez longuement sur une voie pour insérer une station.", "Wähle, wie dieser Abschnitt abknickt: gerade dann 45°, 45° dann gerade, direkt, zwei rechtwinklige Varianten, eine Kurve oder ein Zickzack. Halte ein Gleis gedrückt, um eine Station einzufügen.", "Выберите, как изгибается этот сегмент: прямо, затем 45°; 45°, затем прямо; напрямую; два поворота под прямым углом; кривая или зигзаг. Долгое нажатие на путь вставляет станцию.", "Scegli come curva questo segmento: dritto poi 45°, 45° poi dritto, diretto, due svolte ad angolo retto, una curva o uno zigzag. Tieni premuto un binario per inserire una stazione.", "Escolha como este trecho curva: reto e depois 45°, 45° e depois reto, direto, duas curvas em ângulo reto, uma curva ou um zigue-zague. Toque e segure um trilho para inserir uma estação.", "Pilih cara segmen ini membelok: lurus kemudian 45°, 45° kemudian lurus, terus, dua belokan sudut tegak, lengkung atau zigzag. Tekan lama landasan untuk menyisipkan stesen.", "اختر طريقة انعطاف هذا المقطع: مستقيم ثم 45°، أو 45° ثم مستقيم، أو مباشر، أو انعطافتان بزاوية قائمة، أو منحنى، أو متعرج. اضغط مطولًا على مسار لإدراج محطة.", "Bu bölümün nasıl kıvrılacağını seçin: önce düz sonra 45°, önce 45° sonra düz, doğrudan, iki dik açılı dönüş, eğri ya da zikzak. İstasyon eklemek için raya uzun basın."], ["One way", "单向", "Un solo sentido", "Sens unique", "Einbahn", "В одну сторону", "Senso unico", "Sentido único", "Sehala", "اتجاه واحد", "Tek yön"], ["Further down, Direction makes this line run one way on the segment. Arrows show the way, and stops served in one direction only get a small arrow too.", "往下滚动，“方向”可以让这条线路在该区段上单向运行。箭头指示行驶方向，只有单方向停靠的车站也会显示一个小箭头。", "Más abajo, Sentido hace que esta línea circule en un solo sentido en el segmento. Las flechas muestran el sentido, y las paradas servidas en un solo sentido también llevan una pequeña flecha.", "Plus bas, Sens fait circuler cette ligne dans un seul sens sur le segment. Des flèches indiquent le sens, et les arrêts desservis dans un seul sens reçoivent aussi une petite flèche.", "Weiter unten lässt Richtung diese Linie auf dem Abschnitt nur in eine Richtung fahren. Pfeile zeigen den Weg, und Halte, die nur in einer Richtung bedient werden, bekommen ebenfalls einen kleinen Pfeil.", "Ниже параметр «Направление» делает линию на этом сегменте односторонней. Стрелки показывают направление, а остановки, обслуживаемые только в одну сторону, тоже получают маленькую стрелку.", "Più in basso, Senso fa viaggiare questa linea in un solo senso sul segmento. Le frecce mostrano il verso, e le fermate servite in un solo senso ricevono anch’esse una piccola freccia.", "Mais abaixo, Sentido faz esta linha andar num só sentido no trecho. Setas mostram o sentido, e paradas atendidas num só sentido também ganham uma setinha.", "Di bawah lagi, Arah menjadikan laluan ini sehala pada segmen tersebut. Anak panah menunjukkan arah, dan hentian yang dilayani satu arah sahaja juga mendapat anak panah kecil.", "في الأسفل، يجعل «الاتجاه» هذا الخط يسير في اتجاه واحد على المقطع. تُظهر الأسهم الاتجاه، وتحصل المحطات المخدومة في اتجاه واحد فقط على سهم صغير أيضًا.", "Daha aşağıda, Yön bu hattı bölümde tek yönlü yapar. Oklar yönü gösterir; yalnızca tek yönde hizmet alan duraklar da küçük bir ok alır."], ["Map-wide bends", "全图弯折", "Curvas de todo el mapa", "Virages pour toute la carte", "Knicke für die ganze Karte", "Изгибы для всей карты", "Curve per tutta la mappa", "Curvas do mapa inteiro", "Selekoh seluruh peta", "انعطافات الخريطة كلها", "Harita geneli kıvrımlar"], ["With nothing selected, Map → Lines sets the bend for every segment you haven’t set by hand. Switch Bend types to Mix types and tick several: each segment then gets the one that fits best.", "在未选中任何东西时，地图 → 线路 会为所有未手动设置的区段设定弯折方式。把“弯折类型”切换为“混合类型”并勾选多种：每个区段会自动使用最合适的一种。", "Sin nada seleccionado, Mapa → Líneas fija la curva de cada segmento que no hayas ajustado a mano. Cambia Tipos de curva a Mezclar tipos y marca varios: cada segmento usará el que mejor encaje.", "Sans sélection, Carte → Lignes règle le virage de chaque segment que vous n’avez pas réglé à la main. Passez Types de virage sur Mélanger les types et cochez-en plusieurs : chaque segment prend alors celui qui convient le mieux.", "Ist nichts ausgewählt, legt Karte → Linien den Knick für jeden Abschnitt fest, den du nicht von Hand eingestellt hast. Stelle Knicktypen auf Typen mischen und wähle mehrere: Jeder Abschnitt bekommt dann den passendsten.", "Когда ничего не выбрано, Карта → Линии задаёт изгиб для всех сегментов, которые вы не настроили вручную. Переключите «Типы изгибов» на «Смешать типы» и отметьте несколько: каждый сегмент получит самый подходящий.", "Senza selezione, Mappa → Linee imposta la curva di ogni segmento che non hai impostato a mano. Passa Tipi di curva a Mescola tipi e spuntane diversi: ogni segmento userà quello più adatto.", "Sem nada selecionado, Mapa → Linhas define a curva de todo trecho que você não ajustou à mão. Mude Tipos de curva para Misturar tipos e marque vários: cada trecho usa o que melhor se encaixa.", "Apabila tiada yang dipilih, Peta → Laluan menetapkan selekoh untuk setiap segmen yang belum anda tetapkan sendiri. Tukar Jenis selekoh kepada Campur jenis dan tandakan beberapa: setiap segmen akan mendapat yang paling sesuai.", "عند عدم تحديد شيء، تضبط الخريطة ← الخطوط انعطاف كل مقطع لم تضبطه يدويًا. حوّل «أنواع الانعطاف» إلى «مزج الأنواع» وحدّد عدة أنواع: يحصل كل مقطع على الأنسب له.", "Hiçbir şey seçili değilken Harita → Hatlar, elle ayarlamadığınız her bölümün kıvrımını belirler. Kıvrım türleri’ni Türleri karıştır yapıp birkaçını işaretleyin: her bölüm en uygun olanı alır."], ["Line settings", "线路设置", "Ajustes de la línea", "Réglages de la ligne", "Linieneinstellungen", "Настройки линии", "Impostazioni della linea", "Configurações da linha", "Tetapan laluan", "إعدادات الخط", "Hat ayarları"], ["Select a line in this list or on the map to rename it and set its colour (Minecraft dyes included), type (subway, tram, bus, rail, high-speed, ferry, minecart, ice boat…), style, width and status. The eye hides a line.", "在这个列表或地图上选中一条线路，即可重命名并设置颜色（包括 Minecraft 染料）、类型（地铁、有轨电车、公交、铁路、高铁、渡轮、矿车、冰船……）、样式、宽度和状态。眼睛图标可隐藏线路。", "Selecciona una línea en esta lista o en el mapa para renombrarla y elegir su color (incluidos los tintes de Minecraft), tipo (metro, tranvía, autobús, tren, alta velocidad, ferri, vagoneta, barco sobre hielo…), estilo, ancho y estado. El ojo oculta una línea.", "Sélectionnez une ligne dans cette liste ou sur la carte pour la renommer et régler sa couleur (teintures Minecraft comprises), son type (métro, tram, bus, train, grande vitesse, ferry, wagonnet, bateau sur glace…), son style, sa largeur et son statut. L’œil masque une ligne.", "Wähle eine Linie in dieser Liste oder auf der Karte, um sie umzubenennen und Farbe (auch Minecraft-Farbstoffe), Typ (U-Bahn, Tram, Bus, Bahn, Hochgeschwindigkeit, Fähre, Lore, Eisboot …), Stil, Breite und Status festzulegen. Das Auge blendet eine Linie aus.", "Выберите линию в этом списке или на карте, чтобы переименовать её и задать цвет (включая красители Minecraft), тип (метро, трамвай, автобус, поезд, скоростной, паром, вагонетка, лодка по льду…), стиль, ширину и статус. Глаз скрывает линию.", "Seleziona una linea in questo elenco o sulla mappa per rinominarla e impostarne colore (coloranti di Minecraft inclusi), tipo (metro, tram, bus, treno, alta velocità, traghetto, carrello da miniera, barca sul ghiaccio…), stile, larghezza e stato. L’occhio nasconde una linea.", "Selecione uma linha nesta lista ou no mapa para renomeá-la e definir cor (corantes do Minecraft incluídos), tipo (metrô, bonde, ônibus, trem, alta velocidade, balsa, carrinho de mina, barco no gelo…), estilo, largura e status. O olho esconde uma linha.", "Pilih laluan dalam senarai ini atau di peta untuk menamakannya semula dan menetapkan warna (termasuk pewarna Minecraft), jenis (subway, trem, bas, kereta api, laju tinggi, feri, kereta lombong, bot ais…), gaya, lebar dan status. Ikon mata menyembunyikan laluan.", "حدّد خطًا في هذه القائمة أو على الخريطة لإعادة تسميته وضبط لونه (بما فيها أصباغ Minecraft) ونوعه (مترو، ترام، حافلة، قطار، فائق السرعة، عبّارة، عربة منجم، قارب جليد…) ونمطه وعرضه وحالته. تُخفي العين الخط.", "Bu listede ya da haritada bir hat seçip adını değiştirin; rengini (Minecraft boyaları dahil), türünü (metro, tramvay, otobüs, tren, hızlı tren, feribot, maden arabası, buz teknesi…), stilini, genişliğini ve durumunu ayarlayın. Göz simgesi hattı gizler."], ["The lines and stations list is behind this button. Select a line to rename it and set its colour, type, style, width and status.", "线路和车站列表在这个按钮后面。选中一条线路即可重命名并设置颜色、类型、样式、宽度和状态。", "La lista de líneas y estaciones está tras este botón. Selecciona una línea para renombrarla y elegir su color, tipo, estilo, ancho y estado.", "La liste des lignes et stations est derrière ce bouton. Sélectionnez une ligne pour la renommer et régler sa couleur, son type, son style, sa largeur et son statut.", "Die Liste der Linien und Stationen liegt hinter diesem Knopf. Wähle eine Linie, um sie umzubenennen und Farbe, Typ, Stil, Breite und Status festzulegen.", "Список линий и станций открывается этой кнопкой. Выберите линию, чтобы переименовать её и задать цвет, тип, стиль, ширину и статус.", "L’elenco di linee e stazioni è dietro questo pulsante. Seleziona una linea per rinominarla e impostarne colore, tipo, stile, larghezza e stato.", "A lista de linhas e estações fica atrás deste botão. Selecione uma linha para renomeá-la e definir cor, tipo, estilo, largura e status.", "Senarai laluan dan stesen ada di sebalik butang ini. Pilih laluan untuk menamakannya semula dan menetapkan warna, jenis, gaya, lebar dan status.", "قائمة الخطوط والمحطات خلف هذا الزر. حدّد خطًا لإعادة تسميته وضبط لونه ونوعه ونمطه وعرضه وحالته.", "Hat ve istasyon listesi bu düğmenin arkasında. Bir hattı seçip adını değiştirin; rengini, türünü, stilini, genişliğini ve durumunu ayarlayın."], ["Lines that share track run side by side on their own. To change their order at a station, switch to Advanced, select the station, turn on Reorder lines at stations and drag one line’s dot onto another.", "共用轨道的线路会自动并排显示。要在某个车站改变它们的顺序，请切换到“高级”，选中该车站，打开“在车站调整线路顺序”，然后把一条线路的圆点拖到另一条上。", "Las líneas que comparten vía se colocan una junto a otra solas. Para cambiar su orden en una estación, pasa a Avanzado, selecciona la estación, activa Reordenar líneas en las estaciones y arrastra el punto de una línea sobre otro.", "Les lignes qui partagent une voie se placent côte à côte d’elles-mêmes. Pour changer leur ordre à une station, passez en Avancé, sélectionnez la station, activez Réordonner les lignes aux stations et faites glisser le point d’une ligne sur un autre.", "Linien auf gemeinsamem Gleis laufen von selbst nebeneinander. Um ihre Reihenfolge an einer Station zu ändern, wechsle zu Erweitert, wähle die Station, schalte Linien an Stationen umordnen ein und ziehe den Punkt einer Linie auf einen anderen.", "Линии на общем пути сами идут рядом. Чтобы поменять их порядок на станции, перейдите в расширенный режим, выберите станцию, включите «Менять порядок линий на станциях» и перетащите точку одной линии на другую.", "Le linee che condividono un binario si affiancano da sole. Per cambiarne l’ordine a una stazione, passa ad Avanzato, seleziona la stazione, attiva Riordina le linee nelle stazioni e trascina il punto di una linea su un altro.", "Linhas que dividem o trilho ficam lado a lado sozinhas. Para mudar a ordem delas numa estação, mude para Avançado, selecione a estação, ative Reordenar linhas nas estações e arraste o ponto de uma linha sobre outro.", "Laluan yang berkongsi landasan berjalan sebelah-menyebelah dengan sendirinya. Untuk menukar susunannya di stesen, tukar ke Lanjutan, pilih stesen, hidupkan Susun semula laluan di stesen dan seret titik satu laluan ke atas titik yang lain.", "تسير الخطوط التي تتشارك المسار جنبًا إلى جنب تلقائيًا. لتغيير ترتيبها في محطة، انتقل إلى «متقدم» وحدّد المحطة وفعّل «إعادة ترتيب الخطوط في المحطات» ثم اسحب نقطة خط فوق نقطة أخرى.", "Aynı rayı paylaşan hatlar kendiliğinden yan yana gider. Bir istasyondaki sıralarını değiştirmek için Gelişmiş’e geçin, istasyonu seçin, İstasyonlarda hat sırasını değiştir’i açın ve bir hattın noktasını diğerinin üstüne sürükleyin."], ["Bend points", "折点", "Puntos de curva", "Points de virage", "Knickpunkte", "Точки изгиба", "Punti di curva", "Pontos de curva", "Titik selekoh", "نقاط الانعطاف", "Kıvrım noktaları"], ["Bend points let a line turn without a station. Show or hide them with this button or B.", "折点让线路无需车站即可转弯。用这个按钮或 B 键显示或隐藏它们。", "Los puntos de curva permiten que una línea gire sin estación. Muéstralos u ocúltalos con este botón o con B.", "Les points de virage font tourner une ligne sans station. Affichez-les ou masquez-les avec ce bouton ou B.", "Knickpunkte lassen eine Linie ohne Station abbiegen. Zeige oder verstecke sie mit diesem Knopf oder B.", "Точки изгиба позволяют линии поворачивать без станции. Показывайте и скрывайте их этой кнопкой или клавишей B.", "I punti di curva fanno girare una linea senza una stazione. Mostrali o nascondili con questo pulsante o con B.", "Pontos de curva deixam uma linha virar sem uma estação. Mostre ou esconda-os com este botão ou com B.", "Titik selekoh membolehkan laluan membelok tanpa stesen. Tunjuk atau sembunyikannya dengan butang ini atau B.", "تسمح نقاط الانعطاف للخط بالانعطاف دون محطة. أظهرها أو أخفها بهذا الزر أو بمفتاح B.", "Kıvrım noktaları hattın istasyonsuz dönmesini sağlar. Bu düğmeyle ya da B ile gösterip gizleyin."], ["Bend points let a line turn without a station. Show or hide them with this button.", "折点让线路无需车站即可转弯。用这个按钮显示或隐藏它们。", "Los puntos de curva permiten que una línea gire sin estación. Muéstralos u ocúltalos con este botón.", "Les points de virage font tourner une ligne sans station. Affichez-les ou masquez-les avec ce bouton.", "Knickpunkte lassen eine Linie ohne Station abbiegen. Zeige oder verstecke sie mit diesem Knopf.", "Точки изгиба позволяют линии поворачивать без станции. Показывайте и скрывайте их этой кнопкой.", "I punti di curva fanno girare una linea senza una stazione. Mostrali o nascondili con questo pulsante.", "Pontos de curva deixam uma linha virar sem uma estação. Mostre ou esconda-os com este botão.", "Titik selekoh membolehkan laluan membelok tanpa stesen. Tunjuk atau sembunyikannya dengan butang ini.", "تسمح نقاط الانعطاف للخط بالانعطاف دون محطة. أظهرها أو أخفها بهذا الزر.", "Kıvrım noktaları hattın istasyonsuz dönmesini sağlar. Bu düğmeyle gösterip gizleyin."], ["Stations and labels", "车站与标签", "Estaciones y etiquetas", "Stations et étiquettes", "Stationen und Beschriftungen", "Станции и подписи", "Stazioni ed etichette", "Estações e rótulos", "Stesen dan label", "المحطات والتسميات", "İstasyonlar ve etiketler"], ["Pick a station", "选择一个车站", "Elige una estación", "Choisissez une station", "Wähle eine Station", "Выберите станцию", "Scegli una stazione", "Escolha uma estação", "Pilih stesen", "اختر محطة", "Bir istasyon seçin"], ["Click a station to open its settings.", "点击一个车站以打开它的设置。", "Haz clic en una estación para abrir sus ajustes.", "Cliquez sur une station pour ouvrir ses réglages.", "Klicke eine Station an, um ihre Einstellungen zu öffnen.", "Нажмите на станцию, чтобы открыть её настройки.", "Fai clic su una stazione per aprirne le impostazioni.", "Clique numa estação para abrir as configurações dela.", "Klik stesen untuk membuka tetapannya.", "انقر على محطة لفتح إعداداتها.", "Ayarlarını açmak için bir istasyona tıklayın."], ["Double-tap a station to open its settings.", "双击一个车站以打开它的设置。", "Toca dos veces una estación para abrir sus ajustes.", "Touchez deux fois une station pour ouvrir ses réglages.", "Tippe zweimal auf eine Station, um ihre Einstellungen zu öffnen.", "Дважды коснитесь станции, чтобы открыть её настройки.", "Tocca due volte una stazione per aprirne le impostazioni.", "Toque duas vezes numa estação para abrir as configurações dela.", "Ketik dua kali stesen untuk membuka tetapannya.", "المس محطة مرتين لفتح إعداداتها.", "Ayarlarını açmak için bir istasyona iki kez dokunun."], ["Select a station.", "选中一个车站。", "Selecciona una estación.", "Sélectionnez une station.", "Wähle eine Station aus.", "Выберите станцию.", "Seleziona una stazione.", "Selecione uma estação.", "Pilih satu stesen.", "حدّد محطة.", "Bir istasyon seçin."], ["Type and shape", "类型与形状", "Tipo y forma", "Type et forme", "Typ und Form", "Тип и форма", "Tipo e forma", "Tipo e forma", "Jenis dan bentuk", "النوع والشكل", "Tür ve şekil"], ["Pick a type: station, local stop, interchange, hub, terminus, rail or high-speed rail station, tram or bus stop, a link to another city, or a bend point. Stations, interchanges and termini can have their own shape; the shape for the whole map is in Map → Stations.", "选择类型：车站、小站、换乘站、枢纽、终点站、铁路站或高铁站、电车站或公交站、通往其他城市，或折点。车站、换乘站和终点站可以有自己的形状；全图的形状在 地图 → 车站 中设置。", "Elige un tipo: estación, parada local, intercambiador, nodo, terminal, estación de tren o de alta velocidad, parada de tranvía o de autobús, enlace a otra ciudad o punto de curva. Estaciones, intercambiadores y terminales pueden tener su propia forma; la forma de todo el mapa está en Mapa → Estaciones.", "Choisissez un type : station, arrêt local, correspondance, pôle, terminus, gare ou gare grande vitesse, arrêt de tram ou de bus, lien vers une autre ville, ou point de virage. Stations, correspondances et terminus peuvent avoir leur propre forme ; celle de toute la carte est dans Carte → Stations.", "Wähle einen Typ: Station, Lokalhalt, Umstieg, Knoten, Endstation, Bahnhof oder Hochgeschwindigkeitsbahnhof, Tram- oder Bushalt, Verbindung in eine andere Stadt oder Knickpunkt. Stationen, Umstiege und Endstationen können eine eigene Form haben; die Form für die ganze Karte steht unter Karte → Stationen.", "Выберите тип: станция, местная остановка, пересадка, узел, конечная, вокзал или станция скоростной дороги, остановка трамвая или автобуса, связь с другим городом или точка изгиба. У станций, пересадок и конечных может быть своя форма; форма для всей карты — в Карта → Станции.", "Scegli un tipo: stazione, fermata locale, interscambio, nodo, capolinea, stazione ferroviaria o dell’alta velocità, fermata del tram o del bus, collegamento a un’altra città o punto di curva. Stazioni, interscambi e capolinea possono avere una forma propria; quella di tutta la mappa è in Mappa → Stazioni.", "Escolha um tipo: estação, parada local, integração, hub, terminal, estação de trem ou de alta velocidade, parada de bonde ou de ônibus, ligação para outra cidade ou ponto de curva. Estações, integrações e terminais podem ter forma própria; a forma do mapa todo fica em Mapa → Estações.", "Pilih jenis: stesen, hentian tempatan, pertukaran, hab, terminal, stesen kereta api atau laju tinggi, hentian trem atau bas, pautan ke bandar lain, atau titik selekoh. Stesen, pertukaran dan terminal boleh mempunyai bentuk sendiri; bentuk untuk seluruh peta ada dalam Peta → Stesen.", "اختر نوعًا: محطة، أو محطة محلية، أو محطة تبديل، أو مركز، أو نهاية خط، أو محطة قطار أو قطار فائق السرعة، أو موقف ترام أو حافلة، أو رابط إلى مدينة أخرى، أو نقطة انعطاف. يمكن أن يكون للمحطات ومحطات التبديل والنهايات شكل خاص؛ وشكل الخريطة كلها في الخريطة ← المحطات.", "Bir tür seçin: istasyon, yerel durak, aktarma, merkez, son durak, tren ya da hızlı tren istasyonu, tramvay ya da otobüs durağı, başka şehre bağlantı veya kıvrım noktası. İstasyonlar, aktarmalar ve son duraklar kendi şekline sahip olabilir; tüm haritanın şekli Harita → İstasyonlar’da."], ["Place the name with the compass, or pick Auto to find free space. Advanced adds a second label line, a sublabel in another language, dragging, nudging, rotation, size and colours.", "用罗盘选择名称的位置，或选“自动”寻找空位。高级模式还提供第二行名称、其他语言的副标签、拖动、微调、旋转、大小和颜色。", "Coloca el nombre con la brújula o elige Auto para buscar espacio libre. Avanzado añade una segunda línea, una subetiqueta en otro idioma, arrastrar, desplazar, girar, tamaño y colores.", "Placez le nom avec la boussole, ou choisissez Auto pour trouver de la place. Avancé ajoute une deuxième ligne, une sous-étiquette dans une autre langue, le glisser, le décalage, la rotation, la taille et les couleurs.", "Setze den Namen mit dem Kompass oder wähle Auto, um freien Platz zu finden. Erweitert bietet eine zweite Zeile, eine Unterzeile in einer anderen Sprache, Ziehen, Verschieben, Drehen, Größe und Farben.", "Расположите название с помощью компаса или выберите «Авто», чтобы найти свободное место. В расширенном режиме есть вторая строка, подпись на другом языке, перетаскивание, сдвиг, поворот, размер и цвета.", "Posiziona il nome con la bussola o scegli Auto per trovare spazio libero. Avanzato aggiunge una seconda riga, un’etichetta secondaria in un’altra lingua, trascinamento, spostamento, rotazione, dimensione e colori.", "Posicione o nome com a bússola ou escolha Auto para achar espaço livre. Avançado adiciona uma segunda linha, um subrótulo em outro idioma, arrastar, ajustar, girar, tamanho e cores.", "Letakkan nama dengan kompas, atau pilih Auto untuk mencari ruang kosong. Lanjutan menambah baris label kedua, sublabel dalam bahasa lain, seret, anjak, putaran, saiz dan warna.", "ضع الاسم باستخدام البوصلة، أو اختر «تلقائي» لإيجاد مساحة فارغة. يضيف الوضع المتقدم سطرًا ثانيًا وتسمية فرعية بلغة أخرى والسحب والإزاحة والتدوير والحجم والألوان.", "Adı pusulayla yerleştirin ya da boş yer bulmak için Otomatik’i seçin. Gelişmiş; ikinci satır, başka dilde alt etiket, sürükleme, kaydırma, döndürme, boyut ve renkler ekler."], ["Facilities and details", "设施与详情", "Servicios y detalles", "Équipements et détails", "Einrichtungen und Details", "Удобства и подробности", "Servizi e dettagli", "Serviços e detalhes", "Kemudahan dan butiran", "المرافق والتفاصيل", "Olanaklar ve ayrıntılar"], ["Add facility icons such as airport, ferry, parking or landmark, mark a station as not in service, and keep notes. Advanced adds in-game coordinates and the dimension, for travel times and teleport commands.", "添加机场、渡轮、停车场或地标等设施图标，把车站标记为停用，并记录备注。高级模式还提供游戏内坐标和维度，用于计算行程时间和生成传送命令。", "Añade iconos de servicios como aeropuerto, ferri, aparcamiento o lugar de interés, marca una estación como fuera de servicio y guarda notas. Avanzado añade coordenadas del juego y la dimensión, para tiempos de viaje y comandos de teletransporte.", "Ajoutez des icônes d’équipement comme aéroport, ferry, parking ou monument, marquez une station hors service et gardez des notes. Avancé ajoute les coordonnées en jeu et la dimension, pour les temps de trajet et les commandes de téléportation.", "Füge Symbole wie Flughafen, Fähre, Parkplatz oder Sehenswürdigkeit hinzu, markiere eine Station als außer Betrieb und mache Notizen. Erweitert ergänzt Spielkoordinaten und die Dimension, für Fahrzeiten und Teleport-Befehle.", "Добавьте значки удобств: аэропорт, паром, парковка или достопримечательность; отметьте станцию как закрытую и оставьте заметки. Расширенный режим добавляет игровые координаты и измерение — для времени в пути и команд телепорта.", "Aggiungi icone di servizi come aeroporto, traghetto, parcheggio o luogo d’interesse, segna una stazione come fuori servizio e tieni delle note. Avanzato aggiunge coordinate di gioco e dimensione, per tempi di viaggio e comandi di teletrasporto.", "Adicione ícones de serviços como aeroporto, balsa, estacionamento ou ponto turístico, marque uma estação como fora de serviço e guarde notas. Avançado adiciona coordenadas do jogo e a dimensão, para tempos de viagem e comandos de teletransporte.", "Tambah ikon kemudahan seperti lapangan terbang, feri, tempat letak kereta atau mercu tanda, tandakan stesen sebagai tidak beroperasi dan simpan nota. Lanjutan menambah koordinat dalam permainan dan dimensi, untuk masa perjalanan dan arahan teleport.", "أضف أيقونات المرافق مثل المطار والعبّارة والموقف والمعلم، وعلّم المحطة كخارج الخدمة، واحتفظ بملاحظات. يضيف الوضع المتقدم إحداثيات اللعبة والبُعد، لحساب أوقات السفر وأوامر الانتقال.", "Havalimanı, feribot, otopark veya simge yapı gibi olanak simgeleri ekleyin, istasyonu hizmet dışı işaretleyin ve not tutun. Gelişmiş; yolculuk süreleri ve ışınlanma komutları için oyun içi koordinatları ve boyutu ekler."], ["Several at once", "一次多个", "Varias a la vez", "Plusieurs à la fois", "Mehrere auf einmal", "Несколько сразу", "Più insieme", "Várias de uma vez", "Beberapa sekali gus", "عدة محطات معًا", "Birkaçı birden"], ["Select several stations to set their type, facilities or label side together, line them up neatly, or join them with an out-of-station transfer.", "选中多个车站可以一起设置类型、设施或标签方向，把它们整齐排列，或用站外换乘连接起来。", "Selecciona varias estaciones para fijar juntas su tipo, servicios o lado de la etiqueta,
