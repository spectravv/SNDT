 alinearlas o unirlas con un transbordo fuera de estación.", "Sélectionnez plusieurs stations pour régler ensemble leur type, leurs équipements ou le côté de l’étiquette, les aligner proprement ou les relier par une correspondance hors station.", "Wähle mehrere Stationen, um Typ, Einrichtungen oder Beschriftungsseite gemeinsam festzulegen, sie sauber auszurichten oder mit einem Umstieg außerhalb der Station zu verbinden.", "Выберите несколько станций, чтобы вместе задать тип, удобства или сторону подписи, ровно выстроить их или связать внестанционной пересадкой.", "Seleziona più stazioni per impostarne insieme tipo, servizi o lato dell’etichetta, allinearle con ordine o collegarle con un interscambio esterno.", "Selecione várias estações para definir juntas o tipo, os serviços ou o lado do rótulo, alinhá-las ou ligá-las com uma integração fora da estação.", "Pilih beberapa stesen untuk menetapkan jenis, kemudahan atau sisi label bersama-sama, menyusunnya dengan kemas, atau menyambungnya dengan pertukaran luar stesen.", "حدّد عدة محطات لضبط نوعها أو مرافقها أو جهة تسميتها معًا، أو محاذاتها بدقة، أو ربطها بتحويل خارج المحطة.", "Türlerini, olanaklarını ya da etiket yönlerini birlikte ayarlamak, düzgünce hizalamak veya istasyon dışı aktarmayla bağlamak için birkaç istasyon seçin."], ["Map look", "地图外观", "Aspecto del mapa", "Apparence de la carte", "Aussehen der Karte", "Вид карты", "Aspetto della mappa", "Aparência do mapa", "Rupa peta", "مظهر الخريطة", "Harita görünümü"], ["Pick a colour template, or set the background, text, station fill and water colours yourself.", "选择一个配色模板，或自行设置背景、文字、车站填充和水域颜色。", "Elige una plantilla de color o ajusta tú mismo los colores del fondo, el texto, el relleno de estaciones y el agua.", "Choisissez un modèle de couleurs, ou réglez vous-même l’arrière-plan, le texte, le remplissage des stations et l’eau.", "Wähle eine Farbvorlage oder lege Hintergrund, Text, Stationsfüllung und Wasser selbst fest.", "Выберите цветовой шаблон или сами задайте цвета фона, текста, заливки станций и воды.", "Scegli un modello di colori o imposta tu i colori di sfondo, testo, riempimento stazioni e acqua.", "Escolha um modelo de cor ou defina você mesmo as cores do fundo, texto, preenchimento das estações e água.", "Pilih templat warna, atau tetapkan sendiri warna latar, teks, isian stesen dan air.", "اختر قالب ألوان، أو اضبط بنفسك ألوان الخلفية والنص وتعبئة المحطات والماء.", "Bir renk şablonu seçin ya da arka plan, metin, istasyon dolgusu ve su renklerini kendiniz ayarlayın."], ["Water and nature", "水域与自然", "Agua y naturaleza", "Eau et nature", "Wasser und Natur", "Вода и природа", "Acqua e natura", "Água e natureza", "Air dan alam semula jadi", "الماء والطبيعة", "Su ve doğa"], ["The water tool (W) paints rivers with a brush, fills lakes and seas, and erases. The nature tool (N) draws parks, forests and fields: click points around the shape and close it on the first point.", "水域工具 (W) 可以用画笔画河流、填充湖泊和海洋，也能擦除。自然工具 (N) 用来画公园、森林和田野：围绕形状点击各点，并在第一个点上闭合。", "La herramienta de agua (W) pinta ríos con un pincel, rellena lagos y mares, y borra. La herramienta de naturaleza (N) dibuja parques, bosques y campos: haz clic en puntos alrededor de la forma y ciérrala en el primero.", "L’outil eau (W) peint des rivières au pinceau, remplit lacs et mers, et efface. L’outil nature (N) dessine parcs, forêts et champs : cliquez des points autour de la forme et fermez-la sur le premier.", "Das Wasserwerkzeug (W) malt Flüsse mit einem Pinsel, füllt Seen und Meere und radiert. Das Naturwerkzeug (N) zeichnet Parks, Wälder und Felder: klicke Punkte um die Form und schließe sie am ersten Punkt.", "Инструмент воды (W) рисует реки кистью, заливает озёра и моря и стирает. Инструмент природы (N) рисует парки, леса и поля: нажимайте точки по контуру и замкните на первой.", "Lo strumento acqua (W) dipinge fiumi con un pennello, riempie laghi e mari e cancella. Lo strumento natura (N) disegna parchi, foreste e campi: fai clic sui punti intorno alla forma e chiudila sul primo.", "A ferramenta de água (W) pinta rios com um pincel, preenche lagos e mares e apaga. A ferramenta de natureza (N) desenha parques, florestas e campos: clique pontos ao redor da forma e feche no primeiro.", "Alat air (W) melukis sungai dengan berus, mengisi tasik dan laut, dan memadam. Alat alam semula jadi (N) melukis taman, hutan dan padang: klik titik di sekeliling bentuk dan tutupnya pada titik pertama.", "ترسم أداة الماء (W) الأنهار بفرشاة وتملأ البحيرات والبحار وتمسح. وترسم أداة الطبيعة (N) الحدائق والغابات والحقول: انقر نقاطًا حول الشكل وأغلقه عند النقطة الأولى.", "Su aracı (W) fırçayla nehir boyar, göl ve deniz doldurur, siler. Doğa aracı (N) park, orman ve tarla çizer: şeklin çevresine noktalar tıklayıp ilk noktada kapatın."], ["The water tool paints rivers, fills lakes and seas, and erases. The nature tool draws parks, forests and fields: tap points around the shape and close it on the first point.", "水域工具可以画河流、填充湖泊和海洋，也能擦除。自然工具用来画公园、森林和田野：围绕形状轻触各点，并在第一个点上闭合。", "La herramienta de agua pinta ríos, rellena lagos y mares, y borra. La herramienta de naturaleza dibuja parques, bosques y campos: toca puntos alrededor de la forma y ciérrala en el primero.", "L’outil eau peint des rivières, remplit lacs et mers, et efface. L’outil nature dessine parcs, forêts et champs : touchez des points autour de la forme et fermez-la sur le premier.", "Das Wasserwerkzeug malt Flüsse, füllt Seen und Meere und radiert. Das Naturwerkzeug zeichnet Parks, Wälder und Felder: tippe Punkte um die Form und schließe sie am ersten Punkt.", "Инструмент воды рисует реки, заливает озёра и моря и стирает. Инструмент природы рисует парки, леса и поля: касайтесь точек по контуру и замкните на первой.", "Lo strumento acqua dipinge fiumi, riempie laghi e mari e cancella. Lo strumento natura disegna parchi, foreste e campi: tocca i punti intorno alla forma e chiudila sul primo.", "A ferramenta de água pinta rios, preenche lagos e mares e apaga. A ferramenta de natureza desenha parques, florestas e campos: toque pontos ao redor da forma e feche no primeiro.", "Alat air melukis sungai, mengisi tasik dan laut, dan memadam. Alat alam semula jadi melukis taman, hutan dan padang: ketik titik di sekeliling bentuk dan tutupnya pada titik pertama.", "ترسم أداة الماء الأنهار وتملأ البحيرات والبحار وتمسح. وترسم أداة الطبيعة الحدائق والغابات والحقول: المس نقاطًا حول الشكل وأغلقه عند النقطة الأولى.", "Su aracı nehir boyar, göl ve deniz doldurur, siler. Doğa aracı park, orman ve tarla çizer: şeklin çevresine noktalara dokunup ilk noktada kapatın."], ["Areas, text and images", "区域、文字和图片", "Zonas, texto e imágenes", "Zones, texte et images", "Flächen, Text und Bilder", "Области, текст и изображения", "Aree, testo e immagini", "Áreas, texto e imagens", "Kawasan, teks dan imej", "المناطق والنص والصور", "Alanlar, metin ve görseller"], ["The area tool (R) draws districts, the text tool (T) adds free text anywhere, and the image tool (I) places pictures such as logos. You can also drop an image file onto the map.", "区域工具 (R) 用来画街区，文字工具 (T) 可在任意位置添加文字，图片工具 (I) 可放置标志等图片。也可以直接把图片文件拖到地图上。", "La herramienta de zona (R) dibuja distritos, la de texto (T) añade texto libre en cualquier sitio y la de imagen (I) coloca imágenes como logotipos. También puedes soltar un archivo de imagen sobre el mapa.", "L’outil zone (R) dessine des quartiers, l’outil texte (T) ajoute du texte libre n’importe où, et l’outil image (I) place des images comme des logos. Vous pouvez aussi déposer un fichier image sur la carte.", "Das Flächenwerkzeug (R) zeichnet Bezirke, das Textwerkzeug (T) setzt freien Text überall hin und das Bildwerkzeug (I) platziert Bilder wie Logos. Du kannst auch eine Bilddatei auf die Karte ziehen.", "Инструмент областей (R) рисует районы, текст (T) добавляет свободный текст где угодно, а изображения (I) размещают картинки, например логотипы. Можно и перетащить файл изображения на карту.", "Lo strumento area (R) disegna quartieri, lo strumento testo (T) aggiunge testo libero ovunque e lo strumento immagine (I) posiziona immagini come loghi. Puoi anche trascinare un file immagine sulla mappa.", "A ferramenta de área (R) desenha bairros, a de texto (T) adiciona texto livre em qualquer lugar e a de imagem (I) coloca imagens como logotipos. Você também pode soltar um arquivo de imagem no mapa.", "Alat kawasan (R) melukis daerah, alat teks (T) menambah teks bebas di mana-mana, dan alat imej (I) meletakkan gambar seperti logo. Anda juga boleh melepaskan fail imej ke atas peta.", "ترسم أداة المناطق (R) الأحياء، وتضيف أداة النص (T) نصًا حرًا في أي مكان، وتضع أداة الصور (I) صورًا مثل الشعارات. ويمكنك أيضًا إفلات ملف صورة على الخريطة.", "Alan aracı (R) semt çizer, metin aracı (T) her yere serbest metin ekler, görsel aracı (I) logo gibi resimler yerleştirir. Haritaya bir görsel dosyası da bırakabilirsiniz."], ["The area tool draws districts, the text tool adds free text anywhere, and the image tool places pictures such as logos.", "区域工具用来画街区，文字工具可在任意位置添加文字，图片工具可放置标志等图片。", "La herramienta de zona dibuja distritos, la de texto añade texto libre en cualquier sitio y la de imagen coloca imágenes como logotipos.", "L’outil zone dessine des quartiers, l’outil texte ajoute du texte libre n’importe où, et l’outil image place des images comme des logos.", "Das Flächenwerkzeug zeichnet Bezirke, das Textwerkzeug setzt freien Text überall hin und das Bildwerkzeug platziert Bilder wie Logos.", "Инструмент областей рисует районы, текст добавляет свободный текст где угодно, а изображения размещают картинки, например логотипы.", "Lo strumento area disegna quartieri, lo strumento testo aggiunge testo libero ovunque e lo strumento immagine posiziona immagini come loghi.", "A ferramenta de área desenha bairros, a de texto adiciona texto livre em qualquer lugar e a de imagem coloca imagens como logotipos.", "Alat kawasan melukis daerah, alat teks menambah teks bebas di mana-mana, dan alat imej meletakkan gambar seperti logo.", "ترسم أداة المناطق الأحياء، وتضيف أداة النص نصًا حرًا في أي مكان، وتضع أداة الصور صورًا مثل الشعارات.", "Alan aracı semt çizer, metin aracı her yere serbest metin ekler, görsel aracı logo gibi resimler yerleştirir."], ["Set the grid size here. Everything snaps to it; hold Alt while dragging to place things freely.", "在这里设置网格大小。所有东西都会吸附到网格上；拖动时按住 Alt 可自由放置。", "Ajusta aquí el tamaño de la cuadrícula. Todo se ajusta a ella; mantén Alt al arrastrar para colocar las cosas libremente.", "Réglez ici la taille de la grille. Tout s’y aligne ; maintenez Alt en faisant glisser pour placer librement.", "Lege hier die Rastergröße fest. Alles rastet daran ein; halte beim Ziehen Alt, um frei zu platzieren.", "Задайте здесь размер сетки. Всё привязывается к ней; удерживайте Alt при перетаскивании, чтобы ставить свободно.", "Imposta qui la dimensione della griglia. Tutto vi si aggancia; tieni premuto Alt mentre trascini per posizionare liberamente.", "Defina aqui o tamanho da grade. Tudo se encaixa nela; segure Alt ao arrastar para posicionar livremente.", "Tetapkan saiz grid di sini. Semuanya melekat padanya; tahan Alt semasa menyeret untuk meletakkan secara bebas.", "اضبط حجم الشبكة هنا. يلتصق كل شيء بها؛ اضغط Alt أثناء السحب لوضع الأشياء بحرية.", "Izgara boyutunu buradan ayarlayın. Her şey ona oturur; serbestçe yerleştirmek için sürüklerken Alt’ı basılı tutun."], ["Set the grid size here. Everything snaps to it.", "在这里设置网格大小。所有东西都会吸附到网格上。", "Ajusta aquí el tamaño de la cuadrícula. Todo se ajusta a ella.", "Réglez ici la taille de la grille. Tout s’y aligne.", "Lege hier die Rastergröße fest. Alles rastet daran ein.", "Задайте здесь размер сетки. Всё привязывается к ней.", "Imposta qui la dimensione della griglia. Tutto vi si aggancia.", "Defina aqui o tamanho da grade. Tudo se encaixa nela.", "Tetapkan saiz grid di sini. Semuanya melekat padanya.", "اضبط حجم الشبكة هنا. يلتصق كل شيء بها.", "Izgara boyutunu buradan ayarlayın. Her şey ona oturur."], ["The legend lists your lines grouped by type. Drag it anywhere on the map and click it to change its heading or hide it.", "图例按类型分组列出你的线路。可以把它拖到地图任意位置，点击它可修改标题或隐藏。", "La leyenda muestra tus líneas agrupadas por tipo. Arrástrala a cualquier lugar del mapa y haz clic en ella para cambiar su título u ocultarla.", "La légende liste vos lignes groupées par type. Faites-la glisser n’importe où sur la carte et cliquez dessus pour changer son titre ou la masquer.", "Die Legende listet deine Linien nach Typ gruppiert. Ziehe sie irgendwohin auf die Karte und klicke sie an, um die Überschrift zu ändern oder sie auszublenden.", "Легенда показывает ваши линии по типам. Перетащите её в любое место карты и нажмите, чтобы изменить заголовок или скрыть её.", "La legenda elenca le tue linee raggruppate per tipo. Trascinala ovunque sulla mappa e fai clic per cambiarne il titolo o nasconderla.", "A legenda lista suas linhas agrupadas por tipo. Arraste-a para qualquer lugar do mapa e clique nela para mudar o título ou escondê-la.", "Petunjuk menyenaraikan laluan anda mengikut jenis. Seretnya ke mana-mana di peta dan klik untuk menukar tajuk atau menyembunyikannya.", "تعرض وسيلة الإيضاح خطوطك مجمّعة حسب النوع. اسحبها إلى أي مكان على الخريطة وانقر عليها لتغيير عنوانها أو إخفائها.", "Gösterge hatlarınızı türe göre gruplar. Haritada istediğiniz yere sürükleyin; başlığını değiştirmek ya da gizlemek için tıklayın."], ["The legend lists your lines grouped by type. Drag it anywhere on the map and double-tap it to change its heading or hide it.", "图例按类型分组列出你的线路。可以把它拖到地图任意位置，双击它可修改标题或隐藏。", "La leyenda muestra tus líneas agrupadas por tipo. Arrástrala a cualquier lugar del mapa y tócala dos veces para cambiar su título u ocultarla.", "La légende liste vos lignes groupées par type. Faites-la glisser n’importe où sur la carte et touchez-la deux fois pour changer son titre ou la masquer.", "Die Legende listet deine Linien nach Typ gruppiert. Ziehe sie irgendwohin auf die Karte und tippe zweimal darauf, um die Überschrift zu ändern oder sie auszublenden.", "Легенда показывает ваши линии по типам. Перетащите её в любое место карты и дважды коснитесь, чтобы изменить заголовок или скрыть её.", "La legenda elenca le tue linee raggruppate per tipo. Trascinala ovunque sulla mappa e toccala due volte per cambiarne il titolo o nasconderla.", "A legenda lista suas linhas agrupadas por tipo. Arraste-a para qualquer lugar do mapa e toque duas vezes nela para mudar o título ou escondê-la.", "Petunjuk menyenaraikan laluan anda mengikut jenis. Seretnya ke mana-mana di peta dan ketik dua kali untuk menukar tajuk atau menyembunyikannya.", "تعرض وسيلة الإيضاح خطوطك مجمّعة حسب النوع. اسحبها إلى أي مكان على الخريطة والمسها مرتين لتغيير عنوانها أو إخفائها.", "Gösterge hatlarınızı türe göre gruplar. Haritada istediğiniz yere sürükleyin; başlığını değiştirmek ya da gizlemek için iki kez dokunun."], ["The Timeline turns your map into an animation of the network being built, station by station and line by line. Switch to it here.", "时间轴会把你的地图变成路网逐步建成的动画，一站一站、一线一线地出现。在这里切换过去。", "La línea de tiempo convierte tu mapa en una animación de la red construyéndose, estación a estación y línea a línea. Cambia a ella aquí.", "La chronologie transforme votre carte en animation du réseau en construction, station par station et ligne par ligne. Passez-y ici.", "Die Zeitleiste macht aus deiner Karte eine Animation, in der das Netz Station für Station und Linie für Linie entsteht. Wechsle hier dorthin.", "Хронология превращает карту в анимацию строительства сети — станция за станцией, линия за линией. Переключитесь на неё здесь.", "La cronologia trasforma la tua mappa in un’animazione della rete che si costruisce, stazione dopo stazione e linea dopo linea. Passa qui.", "A linha do tempo transforma seu mapa numa animação da rede sendo construída, estação por estação e linha por linha. Mude para ela aqui.", "Garis masa menjadikan peta anda animasi rangkaian yang dibina, stesen demi stesen dan laluan demi laluan. Tukar kepadanya di sini.", "يحوّل الخط الزمني خريطتك إلى رسوم متحركة لبناء الشبكة، محطة بعد محطة وخطًا بعد خط. انتقل إليه من هنا.", "Zaman çizelgesi haritanızı, ağın istasyon istasyon ve hat hat kurulduğu bir animasyona dönüştürür. Buradan ona geçin."], ["The Timeline turns your map into an animation of the network being built. Open the menu and switch to Timeline.", "时间轴会把你的地图变成路网逐步建成的动画。打开菜单并切换到“时间轴”。", "La línea de tiempo convierte tu mapa en una animación de la red construyéndose. Abre el menú y cambia a Línea de tiempo.", "La chronologie transforme votre carte en animation du réseau en construction. Ouvrez le menu et passez à Chronologie.", "Die Zeitleiste macht aus deiner Karte eine Animation, in der das Netz entsteht. Öffne das Menü und wechsle zu Zeitleiste.", "Хронология превращает карту в анимацию строительства сети. Откройте меню и переключитесь на «Хронологию».", "La cronologia trasforma la tua mappa in un’animazione della rete che si costruisce. Apri il menu e passa a Cronologia.", "A linha do tempo transforma seu mapa numa animação da rede sendo construída. Abra o menu e mude para Linha do tempo.", "Garis masa menjadikan peta anda animasi rangkaian yang dibina. Buka menu dan tukar ke Garis masa.", "يحوّل الخط الزمني خريطتك إلى رسوم متحركة لبناء الشبكة. افتح القائمة وانتقل إلى الخط الزمني.", "Zaman çizelgesi haritanızı ağın kurulduğu bir animasyona dönüştürür. Menüyü açıp Zaman çizelgesi’ne geçin."], ["Open the Timeline.", "打开时间轴。", "Abre la línea de tiempo.", "Ouvrez la chronologie.", "Öffne die Zeitleiste.", "Откройте хронологию.", "Apri la cronologia.", "Abra a linha do tempo.", "Buka Garis masa.", "افتح الخط الزمني.", "Zaman çizelgesini açın."], ["Generate from lines puts every line on the track, in order, station by station. Add selected from map adds only what you had selected, and Clear track starts over. Generating replaces the current track.", "“根据线路生成”会把每条线路按顺序、一站一站地放到轨道上。“添加地图中的所选项”只添加你选中的内容，“清空轨道”则重新开始。生成会替换当前的轨道。", "Generar desde las líneas pone cada línea en la pista, en orden y estación a estación. Añadir lo seleccionado en el mapa añade solo lo que tenías seleccionado, y Vaciar pista empieza de nuevo. Generar sustituye la pista actual.", "Générer depuis les lignes place chaque ligne sur la piste, dans l’ordre, station par station. Ajouter la sélection de la carte n’ajoute que ce que vous aviez sélectionné, et Vider la piste recommence. Générer remplace la piste actuelle.", "Aus Linien erzeugen legt jede Linie der Reihe nach, Station für Station, auf die Spur. Auswahl aus der Karte hinzufügen fügt nur hinzu, was du ausgewählt hattest, und Spur leeren fängt neu an. Erzeugen ersetzt die aktuelle Spur.", "«Создать из линий» ставит на дорожку все линии по порядку, станция за станцией. «Добавить выбранное на карте» добавляет только выделенное, а «Очистить дорожку» начинает заново. Создание заменяет текущую дорожку.", "Genera dalle linee mette ogni linea sulla traccia, in ordine, stazione dopo stazione. Aggiungi la selezione dalla mappa aggiunge solo ciò che avevi selezionato, e Svuota la traccia ricomincia. Generare sostituisce la traccia attuale.", "Gerar a partir das linhas coloca cada linha na faixa, em ordem, estação por estação. Adicionar seleção do mapa adiciona só o que você tinha selecionado, e Limpar faixa recomeça. Gerar substitui a faixa atual.", "Jana daripada laluan meletakkan setiap laluan pada trek, mengikut urutan, stesen demi stesen. Tambah pilihan daripada peta hanya menambah apa yang anda pilih, dan Kosongkan trek bermula semula. Menjana menggantikan trek semasa.", "يضع «إنشاء من الخطوط» كل خط على المسار الزمني بالترتيب، محطة بعد محطة. ويضيف «إضافة المحدد من الخريطة» ما حددته فقط، ويبدأ «مسح المسار» من جديد. الإنشاء يستبدل المسار الحالي.", "Hatlardan oluştur her hattı sırayla, istasyon istasyon ize koyar. Haritadaki seçimi ekle yalnızca seçtiklerinizi ekler, İzi temizle baştan başlatır. Oluşturmak mevcut izin yerini alır."], ["Press Generate from lines.", "点击“根据线路生成”。", "Pulsa Generar desde las líneas.", "Appuyez sur Générer depuis les lignes.", "Drücke Aus Linien erzeugen.", "Нажмите «Создать из линий».", "Premi Genera dalle linee.", "Clique em Gerar a partir das linhas.", "Tekan Jana daripada laluan.", "اضغط «إنشاء من الخطوط».", "Hatlardan oluştur’a basın."], ["The track", "轨道", "La pista", "La piste", "Die Spur", "Дорожка", "La traccia", "A faixa", "Trek", "المسار الزمني", "İz"], ["Each card is one step: a station appearing or a segment being drawn, grouped by line. Drag cards or whole groups to reorder them, or click one to change its duration, insert a pause after it or remove it. Add missing puts back anything on the map that isn’t on the track yet.", "每张卡片是一个步骤：一个车站出现或一个区段被画出，并按线路分组。拖动卡片或整组可以调整顺序，点击一张卡片可以修改时长、在其后插入暂停或删除它。“添加缺失项”会把地图上尚未加入轨道的内容补上。", "Cada tarjeta es un paso: una estación que aparece o un segmento que se dibuja, agrupados por línea. Arrastra tarjetas o grupos enteros para reordenarlos, o haz clic en una para cambiar su duración, insertar una pausa después o quitarla. Añadir lo que falta repone todo lo del mapa que aún no está en la pista.", "Chaque carte est une étape : une station qui apparaît ou un segment qui se trace, groupés par ligne. Faites glisser des cartes ou des groupes entiers pour les réordonner, ou cliquez sur une carte pour changer sa durée, insérer une pause après ou la retirer. Ajouter les manquants remet tout ce qui est sur la carte mais pas encore sur la piste.", "Jede Karte ist ein Schritt: eine Station, die erscheint, oder ein Abschnitt, der gezeichnet wird, nach Linien gruppiert. Ziehe Karten oder ganze Gruppen zum Umsortieren, oder klicke eine an, um ihre Dauer zu ändern, danach eine Pause einzufügen oder sie zu entfernen. Fehlende hinzufügen holt alles von der Karte zurück, was noch nicht auf der Spur ist.", "Каждая карточка — один шаг: появление станции или прорисовка сегмента, сгруппированные по линиям. Перетаскивайте карточки или целые группы, чтобы менять порядок, или нажмите на карточку, чтобы изменить длительность, вставить паузу после неё или удалить её. «Добавить недостающее» возвращает всё с карты, чего ещё нет на дорожке.", "Ogni scheda è un passo: una stazione che appare o un segmento che si disegna, raggruppati per linea. Trascina schede o interi gruppi per riordinarli, oppure fai clic su una per cambiarne la durata, inserire una pausa dopo o rimuoverla. Aggiungi i mancanti rimette tutto ciò che è sulla mappa ma non ancora sulla traccia.", "Cada cartão é um passo: uma estação aparecendo ou um trecho sendo desenhado, agrupados por linha. Arraste cartões ou grupos inteiros para reordenar, ou clique em um para mudar a duração, inserir uma pausa depois ou removê-lo. Adicionar o que falta recoloca tudo do mapa que ainda não está na faixa.", "Setiap kad ialah satu langkah: stesen yang muncul atau segmen yang dilukis, dikumpulkan mengikut laluan. Seret kad atau seluruh kumpulan untuk menyusun semula, atau klik satu untuk menukar tempohnya, menyisipkan jeda selepasnya atau membuangnya. Tambah yang tiada memasukkan semula apa sahaja di peta yang belum ada pada trek.", "كل بطاقة خطوة واحدة: ظهور محطة أو رسم مقطع، مجمّعة حسب الخط. اسحب البطاقات أو مجموعات كاملة لإعادة ترتيبها، أو انقر على بطاقة لتغيير مدتها أو إدراج توقف بعدها أو إزالتها. تعيد «إضافة الناقص» كل ما على الخريطة ولم يُضف إلى المسار بعد.", "Her kart bir adımdır: beliren bir istasyon ya da çizilen bir bölüm; hatlara göre gruplanır. Sıralamak için kartları veya tüm grupları sürükleyin ya da birine tıklayıp süresini değiştirin, sonrasına duraklama ekleyin veya kaldırın. Eksikleri ekle, haritada olup izde olmayan her şeyi geri koyar."], ["Each card is one step: a station appearing or a segment being drawn, grouped by line. Tap one to change its duration, move it, insert a pause after it or remove it. Add missing puts back anything on the map that isn’t on the track yet.", "每张卡片是一个步骤：一个车站出现或一个区段被画出，并按线路分组。轻触一张卡片可以修改时长、移动它、在其后插入暂停或删除它。“添加缺失项”会把地图上尚未加入轨道的内容补上。", "Cada tarjeta es un paso: una estación que aparece o un segmento que se dibuja, agrupados por línea. Toca una para cambiar su duración, moverla, insertar una pausa después o quitarla. Añadir lo que falta repone todo lo del mapa que aún no está en la pista.", "Chaque carte est une étape : une station qui apparaît ou un segment qui se trace, groupés par ligne. Touchez-en une pour changer sa durée, la déplacer, insérer une pause après ou la retirer. Ajouter les manquants remet tout ce qui est sur la carte mais pas encore sur la piste.", "Jede Karte ist ein Schritt: eine Station, die erscheint, oder ein Abschnitt, der gezeichnet wird, nach Linien gruppiert. Tippe eine an, um ihre Dauer zu ändern, sie zu verschieben, danach eine Pause einzufügen oder sie zu entfernen. Fehlende hinzufügen holt alles von der Karte zurück, was noch nicht auf der Spur ist.", "Каждая карточка — один шаг: появление станции или прорисовка сегмента, сгруппированные по линиям. Коснитесь карточки, чтобы изменить длительность, переместить её, вставить паузу после неё или удалить. «Добавить недостающее» возвращает всё с карты, чего ещё нет на дорожке.", "Ogni scheda è un passo: una stazione che appare o un segmento che si disegna, raggruppati per linea. Toccane una per cambiarne la durata, spostarla, inserire una pausa dopo o rimuoverla. Aggiungi i mancanti rimette tutto ciò che è sulla mappa ma non ancora sulla traccia.", "Cada cartão é um passo: uma estação aparecendo ou um trecho sendo desenhado, agrupados por linha. Toque em um para mudar a duração, movê-lo, inserir uma pausa depois ou removê-lo. Adicionar o que falta recoloca tudo do mapa que ainda não está na faixa.", "Setiap kad ialah satu langkah: stesen yang muncul atau segmen yang dilukis, dikumpulkan mengikut laluan. Ketik satu untuk menukar tempohnya, mengalihkannya, menyisipkan jeda selepasnya atau membuangnya. Tambah yang tiada memasukkan semula apa sahaja di peta yang belum ada pada trek.", "كل بطاقة خطوة واحدة: ظهور محطة أو رسم مقطع، مجمّعة حسب الخط. المس بطاقة لتغيير مدتها أو نقلها أو إدراج توقف بعدها أو إزالتها. تعيد «إضافة الناقص» كل ما على الخريطة ولم يُضف إلى المسار بعد.", "Her kart bir adımdır: beliren bir istasyon ya da çizilen bir bölüm; hatlara göre gruplanır. Süresini değiştirmek, taşımak, sonrasına duraklama eklemek veya kaldırmak için birine dokunun. Eksikleri ekle, haritada olup izde olmayan her şeyi geri koyar."], ["Play it", "播放", "Reprodúcelo", "Lancez-la", "Abspielen", "Воспроизведите", "Riproducila", "Reproduza", "Mainkan", "شغّله", "Oynatın"], ["Play and pause here, step through the items, or drag the slider to jump anywhere. Space plays and pauses, the arrow keys step.", "在这里播放和暂停、逐项浏览，或拖动滑块跳到任意位置。空格键播放/暂停，方向键逐项前进或后退。", "Reproduce y pausa aquí, avanza paso a paso o arrastra el control deslizante para saltar a cualquier punto. Espacio reproduce y pausa; las flechas avanzan paso a paso.", "Lancez et mettez en pause ici, avancez élément par élément, ou faites glisser le curseur pour sauter n’importe où. Espace lance et met en pause, les flèches avancent pas à pas.", "Spiele hier ab und pausiere, gehe Schritt für Schritt durch oder ziehe den Regler, um irgendwohin zu springen. Leertaste spielt und pausiert, die Pfeiltasten gehen schrittweise.", "Здесь можно запускать и ставить на паузу, переходить по шагам или тянуть ползунок в любое место. Пробел — воспроизведение и пауза, стрелки — по шагам.", "Riproduci e metti in pausa qui, scorri gli elementi o trascina il cursore per saltare ovunque. Spazio riproduce e mette in pausa, le frecce avanzano passo passo.", "Reproduza e pause aqui, avance item por item ou arraste o controle deslizante para pular para qualquer ponto. Espaço reproduz e pausa, as setas avançam passo a passo.", "Main dan jeda di sini, langkau item demi item, atau seret peluncur untuk melompat ke mana-mana. Space memainkan dan menjeda, kekunci anak panah melangkah.", "شغّل وأوقف مؤقتًا من هنا، أو تنقّل بين العناصر، أو اسحب المنزلق للانتقال إلى أي مكان. المسافة للتشغيل والإيقاف المؤقت، والأسهم للتنقل خطوة بخطوة.", "Buradan oynatıp duraklatın, öğeler arasında adım adım ilerleyin ya da istediğiniz yere atlamak için kaydırıcıyı sürükleyin. Boşluk oynatır ve duraklatır, ok tuşları adım atar."], ["Play and pause here, step through the items, or drag the slider to jump anywhere.", "在这里播放和暂停、逐项浏览，或拖动滑块跳到任意位置。", "Reproduce y pausa aquí, avanza paso a paso o arrastra el control deslizante para saltar a cualquier punto.", "Lancez et mettez en pause ici, avancez élément par élément, ou faites glisser le curseur pour sauter n’importe où.", "Spiele hier ab und pausiere, gehe Schritt für Schritt durch oder ziehe den Regler, um irgendwohin zu springen.", "Здесь можно запускать и ставить на паузу, переходить по шагам или тянуть ползунок в любое место.", "Riproduci e metti in pausa qui, scorri gli elementi o trascina il cursore per saltare ovunque.", "Reproduza e pause aqui, avance item por item ou arraste o controle deslizante para pular para qualquer ponto.", "Main dan jeda di sini, langkau item demi item, atau seret peluncur untuk melompat ke mana-mana.", "شغّل وأوقف مؤقتًا من هنا، أو تنقّل بين العناصر، أو اسحب المنزلق للانتقال إلى أي مكان.", "Buradan oynatıp duraklatın, öğeler arasında adım adım ilerleyin ya da istediğiniz yere atlamak için kaydırıcıyı sürükleyin."], ["Play the timeline.", "播放时间轴。", "Reproduce la línea de tiempo.", "Lancez la chronologie.", "Spiele die Zeitleiste ab.", "Запустите хронологию.", "Riproduci la cronologia.", "Reproduza a linha do tempo.", "Mainkan garis masa.", "شغّل الخط الزمني.", "Zaman çizelgesini oynatın."], ["Timing and camera", "时间与镜头", "Tiempos y cámara", "Durées et caméra", "Timing und Kamera", "Время и камера", "Tempi e camera", "Tempos e câmera", "Masa dan kamera", "التوقيت والكاميرا", "Zamanlama ve kamera"], ["Set how long each station and segment takes (or a drawing speed instead) and how long to hold at the end. The camera can follow the drawing and zoom in while it does.", "设置每个车站和区段需要多长时间（也可以改为绘制速度），以及结尾停留多久。镜头可以跟随绘制并在跟随时放大。", "Ajusta cuánto dura cada estación y segmento (o una velocidad de dibujo) y cuánto se mantiene al final. La cámara puede seguir el dibujo y acercarse mientras lo hace.", "Réglez la durée de chaque station et segment (ou une vitesse de tracé) et combien de temps tenir à la fin. La caméra peut suivre le tracé et zoomer pendant ce temps.", "Lege fest, wie lange jede Station und jeder Abschnitt dauert (oder eine Zeichengeschwindigkeit) und wie lange am Ende gehalten wird. Die Kamera kann dem Zeichnen folgen und dabei heranzoomen.", "Задайте, сколько длится каждая станция и сегмент (или скорость рисования), и сколько держать кадр в конце. Камера может следовать за рисованием и приближать при этом.", "Imposta quanto dura ogni stazione e segmento (o una velocità di disegno) e quanto tenere alla fine. La camera può seguire il disegno e ingrandire mentre lo fa.", "Defina quanto dura cada estação e trecho (ou uma velocidade de desenho) e quanto segurar no final. A câmera pode seguir o desenho e dar zoom enquanto isso.", "Tetapkan berapa lama setiap stesen dan segmen (atau kelajuan melukis) dan berapa lama ditahan pada akhir. Kamera boleh mengikuti lukisan dan zum masuk semasa itu.", "اضبط مدة كل محطة ومقطع (أو سرعة رسم بدلًا منها) ومدة البقاء في النهاية. يمكن للكاميرا أن تتبع الرسم وتقرّب أثناء ذلك.", "Her istasyonun ve bölümün ne kadar süreceğini (ya da bir çizim hızını) ve sonda ne kadar bekleneceğini ayarlayın. Kamera çizimi takip edip bu sırada yakınlaşabilir."], ["Boards, legend and music", "信息板、图例与音乐", "Paneles, leyenda y música", "Panneaux, légende et musique", "Tafeln, Legende und Musik", "Табло, легенда и музыка", "Pannelli, legenda e musica", "Painéis, legenda e música", "Papan, petunjuk dan muzik", "اللوحات ووسيلة الإيضاح والموسيقى", "Panolar, gösterge ve müzik"], ["Line info boards introduce each line in a corner of the picture, with an optional second name and extra lines of text. An end legend lists every line at the finish. Add an audio file to play music under it all.", "线路信息板会在画面一角介绍每条线路，可附带第二名称和额外文字。结尾图例会在最后列出所有线路。添加音频文件即可为整个动画配乐。", "Los paneles de información presentan cada línea en una esquina de la imagen, con un segundo nombre y líneas de texto opcionales. Una leyenda final muestra todas las líneas al terminar. Añade un archivo de audio para poner música de fondo.", "Les panneaux d’information présentent chaque ligne dans un coin de l’image, avec un second nom et des lignes de texte en option. Une légende finale liste toutes les lignes à la fin. Ajoutez un fichier audio pour mettre de la musique sous le tout.", "Linien-Infotafeln stellen jede Linie in einer Bildecke vor, wahlweise mit zweitem Namen und zusätzlichen Textzeilen. Eine Schlusslegende listet am Ende alle Linien. Füge eine Audiodatei hinzu, um Musik darunterzulegen.", "Информационные табло представляют каждую линию в углу кадра, с необязательным вторым названием и дополнительными строками текста. Финальная легенда перечисляет все линии в конце. Добавьте аудиофайл, чтобы под всё играла музыка.", "I pannelli informativi presentano ogni linea in un angolo dell’immagine, con un secondo nome e righe di testo extra facoltativi. Una legenda finale elenca tutte le linee alla fine. Aggiungi un file audio per avere musica di sottofondo.", "Painéis de informação apresentam cada linha num canto da imagem, com um segundo nome e linhas extras de texto opcionais. Uma legenda final lista todas as linhas no fim. Adicione um arquivo de áudio para tocar música por baixo de tudo.", "Papan maklumat laluan memperkenalkan setiap laluan di satu sudut gambar, dengan nama kedua dan baris teks tambahan secara pilihan. Petunjuk akhir menyenaraikan semua laluan pada penghujung. Tambah fail audio untuk memainkan muzik di latar.", "تقدّم لوحات معلومات الخطوط كل خط في زاوية من الصورة، مع اسم ثانٍ وسطور نص إضافية اختيارية. وتعرض وسيلة الإيضاح الختامية كل الخطوط في النهاية. أضف ملفًا صوتيًا لتشغيل موسيقى في الخلفية.", "Hat bilgi panoları her hattı resmin bir köşesinde tanıtır; isteğe bağlı ikinci ad ve ek metin satırlarıyla. Bitiş göstergesi sonda tüm hatları listeler. Altta müzik çalması için bir ses dosyası ekleyin."], ["Export a video", "导出视频", "Exporta un vídeo", "Exportez une vidéo", "Ein Video exportieren", "Экспорт видео", "Esporta un video", "Exporte um vídeo", "Eksport video", "تصدير فيديو", "Video dışa aktarın"], ["Pick a resolution and export the animation as a WebM video to share.", "选择分辨率，把动画导出为 WebM 视频以便分享。", "Elige una resolución y exporta la animación como vídeo WebM para compartirla.", "Choisissez une résolution et exportez l’animation en vidéo WebM à partager.", "Wähle eine Auflösung und exportiere die Animation als WebM-Video zum Teilen.", "Выберите разрешение и экспортируйте анимацию в видео WebM, чтобы поделиться.", "Scegli una risoluzione ed esporta l’animazione come video WebM da condividere.", "Escolha uma resolução e exporte a animação como vídeo WebM para compartilhar.", "Pilih resolusi dan eksport animasi sebagai video WebM untuk dikongsi.", "اختر الدقة وصدّر الرسوم المتحركة كفيديو WebM لمشاركته.", "Bir çözünürlük seçip animasyonu paylaşmak için WebM video olarak dışa aktarın."], ["Switch back to Map to keep editing. The track keeps your order, and Add missing picks up anything new.", "切换回“地图”继续编辑。轨道会保留你的顺序，“添加缺失项”会补上新增的内容。", "Vuelve a Mapa para seguir editando. La pista conserva tu orden, y Añadir lo que falta recoge lo nuevo.", "Revenez à Carte pour continuer à modifier. La piste garde votre ordre, et Ajouter les manquants reprend tout ce qui est nouveau.", "Wechsle zurück zu Karte, um weiterzubearbeiten. Die Spur behält deine Reihenfolge, und Fehlende hinzufügen holt alles Neue dazu.", "Вернитесь на «Карту», чтобы продолжить редактирование. Дорожка сохраняет ваш порядок, а «Добавить недостающее» подхватит всё новое.", "Torna a Mappa per continuare a modificare. La traccia mantiene il tuo ordine, e Aggiungi i mancanti raccoglie tutto ciò che è nuovo.", "Volte para Mapa para continuar editando. A faixa mantém sua ordem, e Adicionar o que falta pega tudo o que for novo.", "Tukar kembali ke Peta untuk terus menyunting. Trek mengekalkan susunan anda, dan Tambah yang tiada mengambil apa sahaja yang baharu.", "عُد إلى «الخريطة» لمتابعة التحرير. يحتفظ المسار بترتيبك، وتلتقط «إضافة الناقص» أي جديد.", "Düzenlemeye devam etmek için Harita’ya dönün. İz sıranızı korur, Eksikleri ekle yeni olan her şeyi alır."], ["Open the menu and switch back to Map to keep editing. The track keeps your order, and Add missing picks up anything new.", "打开菜单并切换回“地图”继续编辑。轨道会保留你的顺序，“添加缺失项”会补上新增的内容。", "Abre el menú y vuelve a Mapa para seguir editando. La pista conserva tu orden, y Añadir lo que falta recoge lo nuevo.", "Ouvrez le menu et revenez à Carte pour continuer à modifier. La piste garde votre ordre, et Ajouter les manquants reprend tout ce qui est nouveau.", "Öffne das Menü und wechsle zurück zu Karte, um weiterzubearbeiten. Die Spur behält deine Reihenfolge, und Fehlende hinzufügen holt alles Neue dazu.", "Откройте меню и вернитесь на «Карту», чтобы продолжить редактирование. Дорожка сохраняет ваш порядок, а «Добавить недостающее» подхватит всё новое.", "Apri il menu e torna a Mappa per continuare a modificare. La traccia mantiene il tuo ordine, e Aggiungi i mancanti raccoglie tutto ciò che è nuovo.", "Abra o menu e volte para Mapa para continuar editando. A faixa mantém sua ordem, e Adicionar o que falta pega tudo o que for novo.", "Buka menu dan tukar kembali ke Peta untuk terus menyunting. Trek mengekalkan susunan anda, dan Tambah yang tiada mengambil apa sahaja yang baharu.", "افتح القائمة وعُد إلى «الخريطة» لمتابعة التحرير. يحتفظ المسار بترتيبك، وتلتقط «إضافة الناقص» أي جديد.", "Menüyü açıp düzenlemeye devam etmek için Harita’ya dönün. İz sıranızı korur, Eksikleri ekle yeni olan her şeyi alır."], ["Go back to the map.", "返回地图。", "Vuelve al mapa.", "Revenez à la carte.", "Geh zurück zur Karte.", "Вернитесь к карте.", "Torna alla mappa.", "Volte ao mapa.", "Kembali ke peta.", "عُد إلى الخريطة.", "Haritaya dönün."], ["Sharing and more", "分享及更多", "Compartir y más", "Partage et plus", "Teilen und mehr", "Публикация и другое", "Condivisione e altro", "Compartilhar e mais", "Perkongsian dan lain-lain", "المشاركة والمزيد", "Paylaşım ve daha fazlası"], ["Download your map as a PNG image in the size you choose, as an SVG vector, or as a JSON backup you can import later.", "把地图下载为你选择尺寸的 PNG 图片、SVG 矢量图，或之后可导入的 JSON 备份。", "Descarga tu mapa como imagen PNG del tamaño que elijas, como vector SVG o como copia de seguridad JSON para importar después.", "Téléchargez votre carte en image PNG à la taille choisie, en vecteur SVG, ou en sauvegarde JSON à importer plus tard.", "Lade deine Karte als PNG-Bild in der gewünschten Größe, als SVG-Vektor oder als JSON-Sicherung zum späteren Importieren herunter.", "Скачайте карту как изображение PNG нужного размера, как вектор SVG или как резервную копию JSON для импорта позже.", "Scarica la mappa come immagine PNG della dimensione scelta, come vettoriale SVG o come backup JSON da importare in seguito.", "Baixe seu mapa como imagem PNG no tamanho que escolher, como vetor SVG ou como backup JSON para importar depois.", "Muat turun peta anda sebagai imej PNG pada saiz pilihan, sebagai vektor SVG, atau sebagai sandaran JSON untuk diimport kemudian.", "نزّل خريطتك كصورة PNG بالحجم الذي تختاره، أو كرسم متجهي SVG، أو كنسخة احتياطية JSON لاستيرادها لاحقًا.", "Haritanızı seçtiğiniz boyutta PNG görsel, SVG vektör ya da sonra içe aktarabileceğiniz bir JSON yedeği olarak indirin."], ["Export is in this menu: a PNG image in the size you choose, an SVG vector, or a JSON backup you can import later.", "导出在这个菜单中：你选择尺寸的 PNG 图片、SVG 矢量图，或之后可导入的 JSON 备份。", "Exportar está en este menú: una imagen PNG del tamaño que elijas, un vector SVG o una copia de seguridad JSON para importar después.", "L’export est dans ce menu : une image PNG à la taille choisie, un vecteur SVG, ou une sauvegarde JSON à importer plus tard.", "Der Export ist in diesem Menü: ein PNG-Bild in der gewünschten Größe, ein SVG-Vektor oder eine JSON-Sicherung zum späteren Importieren.", "Экспорт — в этом меню: изображение PNG нужного размера, вектор SVG или резервная копия JSON для импорта позже.", "L’esportazione è in questo menu: un’immagine PNG della dimensione scelta, un vettoriale SVG o un backup JSON da importare in seguito.", "A exportação fica neste menu: uma imagem PNG no tamanho que escolher, um vetor SVG ou um backup JSON para importar depois.", "Eksport ada dalam menu ini: imej PNG pada saiz pilihan, vektor SVG, atau sandaran JSON untuk diimport kemudian.", "التصدير في هذه القائمة: صورة PNG بالحجم الذي تختاره، أو رسم متجهي SVG، أو نسخة احتياطية JSON لاستيرادها لاحقًا.", "Dışa aktarma bu menüde: seçtiğiniz boyutta PNG görsel, SVG vektör ya da sonra içe aktarabileceğiniz bir JSON yedeği."], ["Open a live room to edit the same map with friends at the same time. Share the room code with them.", "打开实时房间，与朋友同时编辑同一张地图。把房间代码分享给他们。", "Abre una sala en vivo para editar el mismo mapa con amigos a la vez. Comparte con ellos el código de la sala.", "Ouvrez une salle en direct pour modifier la même carte avec des amis en même temps. Partagez-leur le code de la salle.", "Öffne einen Live-Raum, um dieselbe Karte gleichzeitig mit Freunden zu bearbeiten. Teile den Raumcode mit ihnen.", "Откройте совместную комнату, чтобы редактировать одну карту с друзьями одновременно. Поделитесь с ними кодом комнаты.", "Apri una stanza dal vivo per modificare la stessa mappa con gli amici nello stesso momento. Condividi con loro il codice della stanza.", "Abra uma sala ao vivo para editar o mesmo mapa com amigos ao mesmo tempo. Compartilhe o código da sala com eles.", "Buka bilik langsung untuk menyunting peta yang sama bersama rakan pada masa yang sama. Kongsi kod bilik dengan mereka.", "افتح غرفة مباشرة لتحرير الخريطة نفسها مع أصدقائك في الوقت نفسه. شارك رمز الغرفة معهم.", "Aynı haritayı arkadaşlarınızla aynı anda düzenlemek için canlı bir oda açın. Oda kodunu onlarla paylaşın."], ["A live room (in this menu) lets friends edit the same map with you at the same time. Share the room code with them.", "实时房间（在这个菜单中）让朋友可以与你同时编辑同一张地图。把房间代码分享给他们。", "Una sala en vivo (en este menú) permite que tus amigos editen el mismo mapa contigo a la vez. Comparte con ellos el código de la sala.", "Une salle en direct (dans ce menu) permet à vos amis de modifier la même carte avec vous en même temps. Partagez-leur le code de la salle.", "Ein Live-Raum (in diesem Menü) lässt Freunde gleichzeitig mit dir dieselbe Karte bearbeiten. Teile den Raumcode mit ihnen.", "Совместная комната (в этом меню) позволяет друзьям редактировать карту вместе с вами одновременно. Поделитесь с ними кодом комнаты.", "Una stanza dal vivo (in questo menu) permette agli amici di modificare la stessa mappa con te nello stesso momento. Condividi con loro il codice della stanza.", "Uma sala ao vivo (neste menu) permite que amigos editem o mesmo mapa com você ao mesmo tempo. Compartilhe o código da sala com eles.", "Bilik langsung (dalam menu ini) membolehkan rakan menyunting peta yang sama bersama anda pada masa yang sama. Kongsi kod bilik dengan mereka.", "تتيح الغرفة المباشرة (في هذه القائمة) لأصدقائك تحرير الخريطة نفسها معك في الوقت نفسه. شارك رمز الغرفة معهم.", "Canlı oda (bu menüde) arkadaşlarınızın aynı haritayı sizinle aynı anda düzenlemesini sağlar. Oda kodunu onlarla paylaşın."], ["Find any tool or setting by name. Click here or press Ctrl+K.", "按名称查找任何工具或设置。点击这里或按 Ctrl+K。", "Encuentra cualquier herramienta o ajuste por su nombre. Haz clic aquí o pulsa Ctrl+K.", "Trouvez n’importe quel outil ou réglage par son nom. Cliquez ici ou appuyez sur Ctrl+K.", "Finde jedes Werkzeug und jede Einstellung über den Namen. Klicke hier oder drücke Strg+K.", "Найдите любой инструмент или настройку по названию. Нажмите здесь или Ctrl+K.", "Trova qualsiasi strumento o impostazione per nome. Fai clic qui o premi Ctrl+K.", "Encontre qualquer ferramenta ou configuração pelo nome. Clique aqui ou pressione Ctrl+K.", "Cari mana-mana alat atau tetapan mengikut nama. Klik di sini atau tekan Ctrl+K.", "ابحث عن أي أداة أو إعداد بالاسم. انقر هنا أو اضغط Ctrl+K.", "Herhangi bir aracı ya da ayarı adıyla bulun. Buraya tıklayın veya Ctrl+K’ya basın."], ["Find any tool or setting by name with Search in this menu.", "用这个菜单中的“搜索”按名称查找任何工具或设置。", "Encuentra cualquier herramienta o ajuste por su nombre con Buscar en este menú.", "Trouvez n’importe quel outil ou réglage par son nom avec Rechercher dans ce menu.", "Finde jedes Werkzeug und jede Einstellung über den Namen mit Suchen in diesem Menü.", "Найдите любой инструмент или настройку по названию через «Поиск» в этом меню.", "Trova qualsiasi strumento o impostazione per nome con Cerca in questo menu.", "Encontre qualquer ferramenta ou configuração pelo nome com Pesquisar neste menu.", "Cari mana-mana alat atau tetapan mengikut nama dengan Cari dalam menu ini.", "ابحث عن أي أداة أو إعداد بالاسم عبر «بحث» في هذه القائمة.", "Bu menüdeki Ara ile herhangi bir aracı ya da ayarı adıyla bulun."], ["Simple keeps the panels short. Advanced adds exact positions, label nudging, widths and other fine controls.", "“简单”让面板保持简洁。“高级”会增加精确位置、标签微调、宽度等精细控制。", "Sencillo mantiene los paneles cortos. Avanzado añade posiciones exactas, ajuste fino de etiquetas, anchos y otros controles finos.", "Simple garde les panneaux courts. Avancé ajoute les positions exactes, le décalage des étiquettes, les largeurs et d’autres réglages fins.", "Einfach hält die Bereiche kurz. Erweitert ergänzt genaue Positionen, Beschriftungsverschiebung, Breiten und andere Feineinstellungen.", "«Простой» оставляет панели короткими. «Расширенный» добавляет точные координаты, сдвиг подписей, ширину и другие тонкие настройки.", "Semplice mantiene i pannelli brevi. Avanzato aggiunge posizioni esatte, spostamento delle etichette, larghezze e altri controlli fini.", "Simples mantém os painéis curtos. Avançado adiciona posições exatas, ajuste de rótulos, larguras e outros controles finos.", "Ringkas mengekalkan panel pendek. Lanjutan menambah kedudukan tepat, anjakan label, lebar dan kawalan halus lain.", "يبقي «بسيط» اللوحات قصيرة. ويضيف «متقدم» المواضع الدقيقة وإزاحة التسميات والعروض وعناصر تحكم دقيقة أخرى.", "Basit, panelleri kısa tutar. Gelişmiş; tam konumlar, etiket kaydırma, genişlikler ve diğer ince ayarları ekler."], ["Simple keeps the panels short. Advanced (in this menu) adds exact positions, label nudging, widths and other fine controls.", "“简单”让面板保持简洁。“高级”（在这个菜单中）会增加精确位置、标签微调、宽度等精细控制。", "Sencillo mantiene los paneles cortos. Avanzado (en este menú) añade posiciones exactas, ajuste fino de etiquetas, anchos y otros controles finos.", "Simple garde les panneaux courts. Avancé (dans ce menu) ajoute les positions exactes, le décalage des étiquettes, les largeurs et d’autres réglages fins.", "Einfach hält die Bereiche kurz. Erweitert (in diesem Menü) ergänzt genaue Positionen, Beschriftungsverschiebung, Breiten und andere Feineinstellungen.", "«Простой» оставляет панели короткими. «Расширенный» (в этом меню) добавляет точные координаты, сдвиг подписей, ширину и другие тонкие настройки.", "Semplice mantiene i pannelli brevi. Avanzato (in questo menu) aggiunge posizioni esatte, spostamento delle etichette, larghezze e altri controlli fini.", "Simples mantém os painéis curtos. Avançado (neste menu) adiciona posições exatas, ajuste de rótulos, larguras e outros controles finos.", "Ringkas mengekalkan panel pendek. Lanjutan (dalam menu ini) menambah kedudukan tepat, anjakan label, lebar dan kawalan halus lain.", "يبقي «بسيط» اللوحات قصيرة. ويضيف «متقدم» (في هذه القائمة) المواضع الدقيقة وإزاحة التسميات والعروض وعناصر تحكم دقيقة أخرى.", "Basit, panelleri kısa tutar. Gelişmiş (bu menüde); tam konumlar, etiket kaydırma, genişlikler ve diğer ince ayarları ekler."], ["Language and theme", "语言与主题", "Idioma y tema", "Langue et thème", "Sprache und Design", "Язык и тема", "Lingua e tema", "Idioma e tema", "Bahasa dan tema", "اللغة والسمة", "Dil ve tema"], ["SNDT speaks 11 languages, and the theme button sw tém as linhas suaves e cruza menos.", "Tandakan jenis yang mahu digunakan. Setiap segmen mendapat jenis yang paling sesuai: Terus jika stesen sudah sebaris, jika tidak selekoh yang paling lancar dan paling sedikit bersilang.", "حدّد الأنواع المراد استخدامها. يحصل كل مقطع على الأنسب: مباشر إذا كانت المحطات على خط واحد، وإلا الانعطاف الذي يبقي الخطوط سلسة وأقل تقاطعًا.", "Kullanılacak türleri işaretleyin. Her bölüm en uygun olanı alır: istasyonlar zaten hizalıysa Doğrudan, değilse hatları düzgün tutan ve en az kesişen kıvrım."], ["Keep at least two types ticked, or switch to One type.", "至少保留两种类型，或切换为单一类型。", "Deja al menos dos tipos marcados o cambia a Un tipo.", "Gardez au moins deux types cochés, ou passez à Un type.", "Lass mindestens zwei Typen ausgewählt oder wechsle zu Ein Typ.", "Оставьте отмеченными хотя бы два типа или переключитесь на «Один тип».", "Lascia almeno due tipi spuntati o passa a Un tipo.", "Mantenha pelo menos dois tipos marcados ou mude para Um tipo.", "Kekalkan sekurang-kurangnya dua jenis, atau tukar ke Satu jenis.", "أبقِ نوعين على الأقل محددين، أو انتقل إلى نوع واحد.", "En az iki türü işaretli bırakın veya Tek tür'e geçin."], ["Picked by Mix types:", "混合类型选用：", "Elegido por Mezclar tipos:", "Choisi par Mélanger les types :", "Von Typen mischen gewählt:", "Выбрано смешиванием типов:", "Scelto da Mescola tipi:", "Escolhido por Misturar tipos:", "Dipilih oleh Campur jenis:", "اختيار مزج الأنواع:", "Türleri karıştır seçimi:"], ["Choose a type below to fix it for this segment.", "在下方选择一种类型，可将其固定用于此段。", "Elige un tipo abajo para fijarlo en este tramo.", "Choisissez un type ci-dessous pour le fixer sur ce segment.", "Wähle unten einen Typ, um ihn für diesen Abschnitt festzulegen.", "Выберите тип ниже, чтобы закрепить его для этого участка.", "Scegli un tipo qui sotto per fissarlo su questo tratto.", "Escolha um tipo abaixo para fixá-lo neste trecho.", "Pilih jenis di bawah untuk menetapkannya pada segmen ini.", "اختر نوعًا أدناه لتثبيته لهذا المقطع
